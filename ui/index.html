<!doctype html>
<html lang="en" data-theme="dark" data-viewport="md">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply persisted theme / scale / pane widths before first paint
         so there's no reflow flash on launch. The React hooks keep them in sync. -->
    <script>
      (function () {
        try {
          var d = document.documentElement
          var t = localStorage.getItem('tempo-theme')
          // System follows the computer's light/dark setting (useTheme.ts systemTheme): dark
          // when the platform cannot say. Nothing stored stays the page's own dark.
          if (t === 'system') t = window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t)
          // Density and text size (#215): the first-paint copies of useDensity and useTextSize,
          // held to them by index-preseed.test.ts. Touch is Comfortable plus data-touch.
          var den = localStorage.getItem('nexus-density')
          d.setAttribute('data-density', den === 'guided' || den === 'dense' ? den : den === 'touch' ? 'guided' : 'standard')
          if (den === 'touch') d.setAttribute('data-touch', '1')
          var ts = localStorage.getItem('nexus-text-size')
          d.setAttribute('data-text-size', ts === 'large' || ts === 'larger' ? ts : 'normal')
          if (localStorage.getItem('nexus-motion') === 'reduce') d.setAttribute('data-motion', 'reduce')
          // The contrast axis, and the asymmetry IS the feature (#215 — useFieldMode.ts is
          // the runtime copy of this derivation). EITHER field mode or the standing
          // high-contrast preference lights the tokens, so both must seed or the launch
          // flashes the indoor look; only FIELD MODE reaches the zoom seed below, because
          // only it carries the larger fit. High contrast on its own must leave the scale
          // exactly where the operator set it.
          var fieldOn = localStorage.getItem('nexus-field-mode') === '1'
          if (fieldOn || localStorage.getItem('nexus-high-contrast') === '1') {
            d.setAttribute('data-contrast', 'high')
          }
          // Night (Settings ▸ Appearance ▸ Workspace; useNight.ts is the runtime copy). On paints
          // Night from the first frame. Auto needs the station's grid square, which only arrives
          // with the first snapshot, so Auto is the hook's to set (index-preseed.test.ts).
          if (localStorage.getItem('nexus-night') === 'on') d.setAttribute('data-night', '1')
          // The colour roles (Settings ▸ Appearance ▸ Colours; usePaletteRoles.ts is the runtime
          // copy): one attribute per role, set only for a preset the table knows. The default is
          // NO attribute. These ids mirror features/paletteRoles.ts, less each role's default;
          // index-preseed.test.ts holds the two copies together preset by preset.
          var PALETTE = {
            accent: ['blue', 'violet'],
            readout: ['amber', 'green', 'violet'],
            ok: ['teal', 'mint'],
            amber: ['gold', 'yellow'],
            cyan: ['cyan', 'blue'],
          }
          for (var role in PALETTE) {
            var pick = localStorage.getItem('nexus-palette-' + role)
            if (PALETTE[role].indexOf(pick) !== -1) d.setAttribute('data-' + role, pick)
          }
          // The built-in themes (Settings ▸ Appearance ▸ Theme; useSkin.ts is the runtime copy): a
          // theme rides on its base, so it seeds only while the page is that base, and only an id the
          // table knows. The standard themes are NO attribute. These ids mirror features/skins.ts by
          // base; index-preseed.test.ts holds the two copies together theme by theme.
          var SKINS = {
            dark: ['amber-lcd', 'green-lcd', 'blue-vfd', 'midnight', 'slate', 'lagoon', 'ember', 'nebula'],
            light: ['silver', 'paper'],
          }
          var base = d.getAttribute('data-theme') || 'dark'
          var skin = localStorage.getItem('nexus-skin')
          if (Object.prototype.hasOwnProperty.call(SKINS, base) && SKINS[base].indexOf(skin) !== -1) d.setAttribute('data-skin', skin)
          // First-paint zoom seed — keep in sync with useScale.ts (SCALE_STEPS, the
          // per-surface natural fit model, keys nexus-ui-scale-mode /
          // nexus-ui-scale-cap): a pinned Manual scale applies directly (capped in a
          // pop-out, see below); otherwise auto-fit to the window (min(w/natW, h/natH),
          // snapped DOWN to a step, capped, floor 65).
          var STEPS = [65, 70, 75, 80, 85, 90, 100, 110, 125, 150, 175]
          // Per-surface mode key (mirror windowScope surfaceKey/surfaceGet, incl. the
          // instance-token grammar): a pop-out (?panel=) may carry its own pin under
          // 'nexus-ui-scale-mode.<panel>[.<instance>]'; fall back to the bare (main)
          // key only when this surface never wrote one — otherwise a pop-out with a
          // divergent pin first-painted at the main window's zoom, then jumped.
          var q = new URLSearchParams(window.location.search)
          var panel = q.get('panel')
          var inst = q.get('instance')
          var sfx = panel
            ? '.' + panel + (inst && /^(w(0|[1-9][0-9]{0,2})|r(0|[1-9][0-9]{0,8}))$/.test(inst) ? '.' + inst : '')
            : ''
          var modeRaw = sfx ? localStorage.getItem('nexus-ui-scale-mode' + sfx) : null
          if (modeRaw == null) modeRaw = localStorage.getItem('nexus-ui-scale-mode')
          var mode = Number(modeRaw)
          // This window's fit ceiling (fitScale at the max step, floor 65). Auto is
          // bounded by it; so is a PIN in a pop-out (no scale UI there to recover
          // with — mirrors capPinnedScale in src/useScale.ts). A main-window pin is
          // an operator choice and applies verbatim.
          // Per-surface NATURAL footprint (the fit denominator) — mirror of
          // PANEL_NATURAL in src/useScale.ts; index-preseed.test.ts compares this copy
          // to the real fitScale for every openable panel rather than to constants. A
          // pop-out is a small window the APP sized for its content, so fitting one
          // against the main cockpit's 1200×900 pinned EVERY pop-out at the 65% floor
          // (the "font is very, very small" band-map field report).
          var NAT = { operate: [1200, 900], bandmapPhone: [380, 520], bandmapCw: [380, 520],
                      waterfall: [560, 200], fieldday: [560, 540], pota: [620, 540],
                      fdclub: [820, 420], contestlog: [900, 560] }
          var natW = 1200, natH = 900
          if (panel) {
            var n = Object.prototype.hasOwnProperty.call(NAT, panel) ? NAT[panel] : [640, 520]
            natW = n[0]; natH = n[1]
          }
          // Field mode fits against a 0.85-shrunk natural at the ladder-top cap — the
          // mirror of fieldFitScale in src/useScale.ts (auto mode only; a pin is verbatim).
          if (fieldOn) { natW = natW * 0.85; natH = natH * 0.85 }
          var target = Math.min(window.innerWidth / natW, window.innerHeight / natH) * 100
          var fitCeil = 65
          for (var i = 0; i < STEPS.length; i++) {
            if (STEPS[i] <= target) fitCeil = STEPS[i]
          }
          var z
          if (STEPS.indexOf(mode) !== -1) {
            z = panel && mode > fitCeil ? fitCeil : mode
          } else {
            var cap = Number(localStorage.getItem('nexus-ui-scale-cap'))
            if (STEPS.indexOf(cap) === -1) cap = 100
            if (fieldOn) cap = STEPS[STEPS.length - 1]
            z = Math.min(cap, fitCeil)
          }
          var zoom = z / 100
          d.style.setProperty('--ui-zoom', String(zoom))
          // Effective (zoom-adjusted) viewport, seeded pre-paint so every
          // var(--vh-eff/--vw-eff, …) consumer paints right on frame one. useViewport
          // republishes live one rAF after mount — without this seed every pop-out
          // painted its first frame 35% short at the 65% floor, then snapped.
          var ew = window.innerWidth / (zoom || 1)
          var eh = window.innerHeight / (zoom || 1)
          d.style.setProperty('--vh-eff', eh + 'px')
          d.style.setProperty('--vw-eff', ew + 'px')
          // Initial size class from EFFECTIVE width (mirror classifyViewport() in
          // src/useViewport.ts) so the first paint is already at the right breakpoint.
          d.setAttribute('data-viewport', ew < 768 ? 'xs' : ew < 1100 ? 'sm' : ew < 1600 ? 'md' : ew < 2400 ? 'lg' : 'xl')
          // Rail preseed: a copy of usePaneWidths' fitRails, held to it by
          // index-preseed.test.ts. Each rail within its own bounds (left ≥220 ≤40% effW,
          // right ≥260 ≤60% effW), then the PAIR within what the conversation between
          // them leaves (effW less 160 px of chrome and its 360 px floor, rounded down):
          // the stored px may come from a bigger monitor, and two rails clamped only
          // one by one could add up to the whole window. If the pair does not fit, the
          // rail set last (tempo-rail-last) keeps its width, else both shrink in
          // proportion; below the floors both hold 220/260. Nothing stored (a
          // never-dragged install) seeds the hook's proportional default (0.18/0.22 ·
          // effW) — skipping the seed left the :root 300/360px fallbacks up for the first
          // paint, so EVERY launch jumped when React published the real default (~319px
          // wider at 3440w). Storage itself stays untouched either way (writes happen
          // only on operator commit/reset).
          var lp = Number(localStorage.getItem('tempo-left-rail-w'))
          var rp = Number(localStorage.getItem('tempo-right-rail-w'))
          var ls = isFinite(lp) && lp > 0
          var rs = isFinite(rp) && rp > 0
          var rlast = localStorage.getItem('tempo-rail-last')
          var lw = Math.max(220, Math.min(Math.round(ew * 0.4), ls ? lp : Math.round(ew * 0.18)))
          var rw = Math.max(260, Math.min(Math.round(ew * 0.6), rs ? rp : Math.round(ew * 0.22)))
          var room = Math.floor(ew - 160 - 360)
          if (lw + rw > room) {
            if (room < 480) {
              lw = 220
              rw = 260
            } else {
              var ranchor = (rlast === 'left' && ls) || (rlast === 'right' && rs) ? rlast : ls && !rs ? 'left' : rs && !ls ? 'right' : null
              if (ranchor === 'left') {
                lw = Math.min(lw, room - 260)
                rw = Math.max(260, Math.min(rw, room - lw))
              } else if (ranchor === 'right') {
                rw = Math.min(rw, room - 220)
                lw = Math.max(220, Math.min(lw, room - rw))
              } else {
                var rk = room / (lw + rw)
                var sl = Math.floor(lw * rk)
                var sr = Math.floor(rw * rk)
                if (sl < 220) {
                  sl = 220
                  sr = Math.min(rw, room - 220)
                } else if (sr < 260) {
                  sr = 260
                  sl = Math.min(lw, room - 260)
                }
                lw = sl
                rw = sr
              }
            }
          }
          d.style.setProperty('--left-rail-w', lw + 'px')
          d.style.setProperty('--right-rail-w', rw + 'px')
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e151f" />
    <title>Nexus — unified ham digital-ops nerve center</title>
    <meta
      name="description"
      content="Nexus is a unified, native ham digital-operations app — FT8/FT4 decode, waterfall, spots, map, propagation, logbook, and awards in one place, plus Tempo two-way free-text calling."
    />

    <!-- Open Graph / social unfurl -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus — unified ham digital-ops nerve center" />
    <meta
      property="og:description"
      content="FT8/FT4 + waterfall + spots + map + propagation + logbook + awards in one native app, plus Tempo two-way free-text calling. Zero-config setup, automatic propagation intelligence."
    />
    <meta property="og:url" content="https://github.com/kd9taw/nexus" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/kd9taw/nexus/main/docs/img/social-card.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus — unified ham digital-ops nerve center" />
    <meta
      name="twitter:description"
      content="FT8/FT4 + waterfall + spots + map + propagation + logbook + awards in one native app, plus Tempo two-way calling."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/kd9taw/nexus/main/docs/img/social-card.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
