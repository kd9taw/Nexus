<!doctype html><html><head><meta charset="utf-8"><title>topbar harness</title>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;background:#0b0e14}</style></head>
<body><div class="app" style="display:block">
<header class="topbar">
  <div class="topbar-group brand"><span class="logo-wrap"><span class="logo">Nexus</span><span class="app-version">v1.0.13</span></span><span class="mycall">KD9TAW<span class="mygrid">EN52</span></span></div>
  <div class="topbar-group radio-readout"><span style="color:var(--text)">7.0740 MHz · 40m</span></div>
  <div class="topbar-group txrx"><span class="txrx-indicator rx">RX</span><div class="rx-level"><span class="rx-level-label">RX</span></div><div class="slot-clock"><span class="slot-count">3.8s</span><span class="slot-label">next slot</span></div><span class="timesync ok"><span class="dot"></span>clock +0.01s</span></div>
  <div class="topbar-group tier-toggle">
    <button class="tier-btn"><small>Tempo</small>Fast</button><button class="tier-btn"><small>Tempo</small>Deep</button><button class="tier-btn">FT4</button><button class="tier-btn active">FT8</button><button class="tier-btn">FT2</button><button class="tier-btn"><small>BCN</small>WSPR</button><button class="tier-btn">Q65</button><button class="tier-btn">MSK144</button><button class="tier-btn"><small>RX</small>JT65</button><button class="tier-btn">FST4</button><button class="tier-btn"><small>BCN</small>FST4W</button>
  </div>
  <div class="topbar-group topbar-chips">
    <button class="theme-chip" title="Help">Help</button>
    <button class="theme-chip field-chip">Field</button>
  </div>
  <div class="topbar-group tier-toggle tx-period">
    <button class="tier-btn active">Auto <small>2nd</small></button><button class="tier-btn">Tx 1st <small>even</small></button><button class="tier-btn derived">Tx 2nd <small>odd</small></button>
  </div>
</header>
</div>
<script>
function measure(){
  const bar=document.querySelector('.topbar');
  const pills=bar.querySelector('.tier-toggle:not(.tx-period)');
  const chips=bar.querySelector('.topbar-chips');
  const tx=bar.querySelector('.tx-period');
  const r=e=>e.getBoundingClientRect();
  const barR=r(bar),pillsR=r(pills),chipsR=r(chips),txR=r(tx);
  const pad=parseFloat(getComputedStyle(bar).paddingRight)||0;
  return {
    sameLine: Math.abs(chipsR.top+chipsR.height/2-(txR.top+txR.height/2))<8,
    pillsToChips:+(chipsR.left-pillsR.right).toFixed(1),
    chipsToTx:+(txR.left-chipsR.right).toFixed(1),
    slackRight:+((barR.right-pad)-txR.right).toFixed(1),
    // Pill-row geometry: how many LINES the pill group occupies, and whether any
    // pill escapes the group box. One line = the row still fits.
    pillLines: (()=>{const t=new Set();pills.querySelectorAll('.tier-btn').forEach(b=>t.add(Math.round(r(b).top)));return t.size;})(),
    pillRowW: +pillsR.width.toFixed(1),
    pillRowH: +pillsR.height.toFixed(1),
    pillOverflow: +(Math.max(0, pills.scrollWidth - pills.clientWidth)).toFixed(1),
    pillsSum: +([...pills.querySelectorAll('.tier-btn')].reduce((a,b)=>a+r(b).width,0)).toFixed(1),
  };
}
</script></body></html>
