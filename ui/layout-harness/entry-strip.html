<!doctype html><html><head><meta charset="utf-8"><title>contest entry strip harness</title>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;background:#0b0e14}.host{border:1px dashed #334}</style></head>
<!--
  THE CONTEST ENTRY STRIP AT THE 1024 px FLOOR (spec §9).

  ⚠️ WHY THIS FILE EXISTS. jsdom computes no layout: every getBoundingClientRect in
  the vitest suite is 0×0, so a width assertion there is not a measurement, it is a
  sentence. The strip's budget is geometric — "Call plus up to five received fields on
  one row at the 1024 px supported floor, wrapping to a second row below it" — and the
  only way to know is to lay it out in a real engine and read the rects.

  It carries the REAL classes from `LogEntry.tsx`'s FD branch and links the REAL sheet.
  Mirror any DOM-structure change here (README step 2), and re-copy styles.css.

  RUN IT:  ./measure-entry-strip.sh          (headless Chrome, prints the JSON)
  or:      python3 -m http.server 8799  →  http://localhost:8799/entry-strip.html
           then `measure(1024)` in the console.

  WHAT MUST HOLD, at 1024:
   • `rowOverflow` == 0            — the row never scrolls horizontally; it WRAPS
   • `boxesOnOneLine` true         — Call + every exchange box share one line
   • `fieldsFullyVisible` true     — no box is clipped by the strip
   • `stripH` is CONTENT height    — the strip is `fit="content"`; it takes no surplus
   • the FIVE-field case wraps to at most TWO lines and still overflows nothing
   • Field Day (2 fields) is 117 px — the shipped height, unchanged by the sent block

  WHAT IT ALREADY DECIDED (2026-09-09, this build):
   Where the read-only sent block lives. §9 says "beside the entry boxes", so it was
   built in the entry row and measured there. At 1024, with Field Day's two boxes, the
   entry row fits it only by taking the slack out of the CALL box:
     • `sentIn: "row"`     stripH 117 px, callW 506.7 → 207.8 px
     • `sentIn: "header"`  stripH 117 → 130 px, callW 506.7 px unchanged
   Widen Call back and the row wraps instead, and this dock is bottom-anchored, so the
   extra line comes off the log feed and moves the fields the fixed-height verdict slot
   exists to keep still. 13 px of header is the cheaper of the two, so that is where it
   ships. `sentIn: "row"` below is the rejected alternative, kept because a number
   nobody can reproduce is not evidence.

  THE STATE QSO PARTIES (2026-09-09, re-measured when they became selectable):
   Two received boxes, exactly Field Day's count — so the ROW budget is untouched. What
   moves is the SENT string, which is longer than Field Day's `3A WI`. At 1024, header
   variant:
     • `3A WI`      sentW 286.9   callW 506.7   stripH 130   overflow 0
     • `599 WILL`   sentW 312.2   callW 506.7   stripH 130   overflow 0  (TNQP/OhQP/TXQP)
     • `1234 ALAM`  sentW 320.6   callW 506.7   stripH 130   overflow 0  (CQP, 4-digit serial)
   The sent block absorbs the extra 34 px inside its own share of the header row: the
   Call box keeps all 506.7 px, the strip stays at the shipped 130 px, and nothing
   overflows or wraps. The control still trips — six fields reports
   `boxesOnOneLine: false`, `stripH 204` — so these are a measurement, not a page that
   stopped laying out.

  THE EXCHANGE TYPE-AHEAD's DROPDOWN (2026-09-17, the county type-ahead):
   The list hangs off the last exchange box and this dock is BOTTOM-ANCHORED, so the
   only question is which way it may open. Measured with the strip pinned to the bottom
   of a 1024x768 window (`--window-size=1024,855`; headless gives innerHeight H-87):
     • 6 items, 1024 / 1366 / 1920:  listH 138, top 552, bottom 690, box top 710
       — `opensUpward` `fullyInView` `coversNoBox` all true at every width
     • 20 items (past the list's own cap): listH 220, top 470 — the max-height holds
       and it scrolls instead of growing
     • NEGATIVE CONTROL, the same list opening DOWNWARD (what the sheet would do without
       `bottom: calc(100% + 2px)`): top 756, bottom 894 in a 768 px window —
       `fullyInView: false`. The check can fail, so the trues above are evidence.
-->
<body>
<div class="app" style="display:block">
<div class="host" style="width:1024px">
  <div class="log-entry log-entry-fd">
    <div class="le-fd-header">
      <span class="le-fd-chip">FD LOG</span>
      <span class="le-fd-mode">PH</span>
      <span class="le-fd-hint">20m · contacts go to the Field Day log</span>
      <div class="le-fd-sent">
        <span class="le-fd-sent-cap">Sending<span class="le-fd-role"> in_state</span></span>
        <span class="mono le-fd-sent-val">3A WI</span>
        <button class="le-qrz le-fd-moved" type="button">I moved</button>
      </div>
    </div>
    <div class="le-fd-big">
      <label class="le-fd-field le-fd-field-call">
        <span class="le-fd-cap">Call</span>
        <input class="settings-input mono le-fd-input le-fd-input-call" placeholder="W1AW">
      </label>
      <div id="boxes"></div>
      <button class="le-log-btn le-fd-log-btn" type="button">Log FD</button>
      <button class="le-qrz" type="button">Clear</button>
    </div>
    <div class="le-fd-verdicts"></div>
  </div>
</div>
</div>
<pre id="out"></pre>
<script>
// The strip renders one box per RECEIVED slot. `fields(n)` builds n of them with the
// real classes, so the same page measures Field Day (2) and Sweepstakes (5).
const FD = ['Class', 'Section'];
const SS = ['NR', 'PREC', 'CALL', 'CK', 'SEC'];
// The state QSO parties: two received slots, same as Field Day, but a WIDER sent block
// — `599 WILL` / `1234 ALAM` against Field Day's `3A WI`. The box count is what the row
// budget is about; the sent string is what the header block's width is about, and the
// parties move only the second, so both are measured.
const QP = ['RST', 'QTH'];
const SENT = { fd: '3A WI', qp: '599 WILL', cqp: '1234 ALAM' };
function fields(caps) {
  const host = document.getElementById('boxes');
  host.replaceChildren();
  // The boxes are siblings of Call in the real DOM, so unwrap this placeholder host.
  host.style.display = 'contents';
  for (const c of caps) {
    const l = document.createElement('label');
    l.className = 'le-fd-field';
    l.innerHTML =
      '<span class="le-fd-cap">' + c + '</span>' +
      '<input class="settings-input mono le-fd-input le-fd-input-code">';
    host.appendChild(l);
  }
}

function measure(width, caps, where, sentText) {
  document.querySelector('.host').style.width = width + 'px';
  fields(caps);
  document.querySelector('.le-fd-sent-val').textContent = sentText || SENT.fd;
  // VARIANT: where the read-only sent block lives — in the entry row (the literal
  // reading of §9's "beside the entry boxes") or in the strip's header row.
  const sentEl = document.querySelector('.le-fd-sent');
  const target = where === 'header'
    ? document.querySelector('.le-fd-header')
    : document.querySelector('.le-fd-big');
  if (sentEl.parentElement !== target) target.appendChild(sentEl);
  const strip = document.querySelector('.log-entry-fd');
  const row = document.querySelector('.le-fd-big');
  const call = document.querySelector('.le-fd-field-call');
  const boxes = [...document.querySelectorAll('.le-fd-field')];
  const sent = document.querySelector('.le-fd-sent');
  const r = e => e.getBoundingClientRect();
  const rowR = r(row), stripR = r(strip);
  const tops = new Set(boxes.map(b => Math.round(r(b).top)));
  return {
    width,
    fields: caps.length,
    sentIn: where || 'row',
    sentText: document.querySelector('.le-fd-sent-val').textContent,
    // The whole point: the row WRAPS, it never scrolls.
    rowOverflow: +Math.max(0, row.scrollWidth - row.clientWidth).toFixed(1),
    stripOverflow: +Math.max(0, strip.scrollWidth - strip.clientWidth).toFixed(1),
    // Call + every exchange box on one line?
    boxesOnOneLine: tops.size === 1,
    rowLines: tops.size,
    // Nothing clipped by the strip's own box.
    fieldsFullyVisible: boxes.every(b => r(b).right <= stripR.right + 0.5),
    callW: +r(call).width.toFixed(1),
    boxW: +(boxes[1] ? r(boxes[1]).width : 0).toFixed(1),
    boxesSum: +boxes.reduce((a, b) => a + r(b).width, 0).toFixed(1),
    sentW: +r(sent).width.toFixed(1),
    sentLeft: +(r(sent).left - stripR.left).toFixed(1),
    rowW: +rowR.width.toFixed(1),
    rowH: +rowR.height.toFixed(1),
    // `fit="content"`: the strip is exactly as tall as what is in it.
    stripH: +stripR.height.toFixed(1),
  };
}

// ⭐ THE EXCHANGE TYPE-AHEAD's dropdown. It hangs off the QTH box, and this dock is
// BOTTOM-ANCHORED, so the question a real layout engine has to answer is whether the
// list opens into the window or off the edge of it. `suggest(n)` builds the real markup;
// `measureSuggest` pins the strip to the bottom of the viewport the way the dock does
// and reads the list against the window, not against the host div.
function suggest(n) {
  const host = [...document.querySelectorAll('.le-fd-field')].pop();
  host.querySelector('.le-fd-suggest')?.remove();
  if (!n) return;
  const ul = document.createElement('ul');
  ul.className = 'le-fd-suggest';
  ul.innerHTML = Array.from({ length: n }, (_, i) =>
    '<li><button type="button"><span class="mono le-fd-hit-code">MCPN</span>' +
    '<span class="le-fd-hit-name">Macoupin ' + i + '</span></button></li>').join('');
  host.appendChild(ul);
}

function measureSuggest(width, n, down) {
  const host = document.querySelector('.host');
  host.style.cssText = 'position:fixed;left:0;bottom:0;width:' + width + 'px';
  measure(width, QP, 'header', SENT.qp);
  suggest(n);
  const r = e => e.getBoundingClientRect();
  const ul = document.querySelector('.le-fd-suggest');
  // NEGATIVE CONTROL: the same list opening DOWNWARD, which is what the sheet would do
  // without `bottom: calc(100% + 2px)`. It must report `fullyInView: false` — a check
  // that cannot fail is not a check.
  if (down) { ul.style.bottom = 'auto'; ul.style.top = 'calc(100% + 2px)'; }
  const box = [...document.querySelectorAll('.le-fd-input-code')].pop();
  const u = r(ul), b = r(box);
  return {
    width,
    items: n,
    opens: down ? 'down (control)' : 'up',
    innerHeight: window.innerHeight,
    listTop: +u.top.toFixed(1),
    listBottom: +u.bottom.toFixed(1),
    listH: +u.height.toFixed(1),
    listW: +u.width.toFixed(1),
    boxTop: +b.top.toFixed(1),
    // The three things that must hold, in a real engine rather than in a sentence.
    opensUpward: u.bottom <= b.top + 0.5,
    fullyInView: u.top >= 0 && u.bottom <= window.innerHeight + 0.5,
    coversNoBox: u.bottom <= b.top + 0.5,
  };
}

function run() {
  const rows = [];
  for (const w of [1024, 1366, 1920]) {
    rows.push(measure(w, FD, 'row'));
    rows.push(measure(w, SS, 'row'));
    rows.push(measure(w, FD, 'header'));
    rows.push(measure(w, SS, 'header'));
  }
  // The QSO parties at the floor: two boxes like Field Day, and the widest sent strings
  // any shipped ruleset produces.
  rows.push(measure(1024, QP, 'header', SENT.qp));
  rows.push(measure(1024, QP, 'header', SENT.cqp));
  // CONTROL: one MORE field than the budget admits. If the numbers below do not move
  // from the five-field row, the measurement is not seeing the boxes.
  rows.push(measure(1024, SS.concat(['SIX']), 'header'));
  // THE TYPE-AHEAD DROPDOWN, at the floor and at the two widths the fold sizes differ at,
  // with the six items the strip caps a suggestion list at — plus a CONTROL of twenty,
  // which is past the list's own max-height and must therefore scroll rather than grow.
  for (const w of [1024, 1366, 1920]) rows.push(measureSuggest(w, 6));
  rows.push(measureSuggest(1024, 20));
  rows.push(measureSuggest(1024, 6, true));
  document.getElementById('out').textContent = JSON.stringify(rows, null, 1);
  return rows;
}
run();
</script>
</body></html>
