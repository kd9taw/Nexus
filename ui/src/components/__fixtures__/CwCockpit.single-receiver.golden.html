<main class="layout single cw-cockpit" style="--cw-scope-h: 13%;"><div class="cockpit-header"><div class="ch-identity"><span class="cw-mode-badge" title="The rig is set to CW while you're in this section">CW</span></div><div class="ch-freq"><div class="ch-readout" title="Scroll a digit to tune it"><span class="readout hero editable" title="Scroll a digit to tune it (100 Hz … 10 MHz) · ←/→ pick a digit, ↑/↓ spin it · click to type a frequency (MHz)" role="button" tabindex="0"><span class="readout-val" data-digit-tune="on"><span class="readout-digit" data-decade="7">1</span><span class="readout-digit" data-decade="6">4</span>.<span class="readout-digit" data-decade="5">0</span><span class="readout-digit" data-decade="4">5</span><span class="readout-digit" data-decade="3">0</span><span class="readout-digit" data-decade="2">0</span></span><span class="readout-unit">MHz</span></span></div><div class="ch-freq-extras"><div class="tuning-strip" role="group" aria-label="Tuning"><button type="button" class="tuning-nudge" title="Down 1000 Hz" aria-label="Tune down 1000 Hz">◄◄</button><button type="button" class="tuning-nudge" title="Down 100 Hz" aria-label="Tune down 100 Hz">◄</button><button type="button" class="tuning-nudge" title="Up 100 Hz" aria-label="Tune up 100 Hz">►</button><button type="button" class="tuning-nudge" title="Up 1000 Hz" aria-label="Tune up 1000 Hz">►►</button><select class="tuning-step" title="Tuning step" aria-label="Tuning step"><option value="10">10 Hz</option><option value="100">100 Hz</option><option value="1000">1 kHz</option><option value="5000">5 kHz</option></select><span class="tuning-vfo" role="group" aria-label="Active VFO"><button type="button" class="active" title="Use VFO A">A</button><button type="button" class="" title="Use VFO B">B</button><button type="button" title="Swap VFO A and B — each dial keeps its frequency and they change places, so the one you were listening on is a press away." aria-label="Swap VFO A and B">⇄</button></span><span class="tuning-clar"><button type="button" title="RIT clarifier — click to clear">RIT</button><button type="button" aria-label="RIT down">−</button><span class="tuning-clar-val mono">0</span><button type="button" aria-label="RIT up">+</button></span><span class="tuning-clar"><button type="button" title="XIT clarifier — click to clear">XIT</button><button type="button" aria-label="XIT down">−</button><span class="tuning-clar-val mono">0</span><button type="button" aria-label="XIT up">+</button></span></div></div><div class="ch-bandtune"><div class="ch-band"><div class="band-picker"><span class="band-picker-dot" style="background: rgb(61, 220, 106);" aria-hidden="true"></span><button type="button" class="band-menu-trigger band-picker-trigger" style="color: rgb(61, 220, 106); border-color: rgb(61, 220, 106); box-shadow: 0 0 0 1px #3ddc6a55, 0 0 10px #3ddc6a33;" aria-label="Band: 20m" title="Band — your last frequency on this band in this mode this session, else the start of your licensed segment" id="radix-:rID:" aria-haspopup="menu" aria-expanded="false" data-state="closed"><span class="band-menu-value">20m</span><span class="band-menu-caret" aria-hidden="true"></span></button></div></div><div class="ch-tune"><button type="button" class="cockpit-tune" title="Key a steady carrier to tune an ATU/amp (auto-stops on the tune watchdog). Click again to stop.">Tune</button></div></div></div><div class="ch-mode-extras"><label class="cw-wpm" title="Keyer speed — PgUp/PgDn to nudge (Shift = ±4)"><span>Speed</span><input type="range" min="5" max="50" aria-label="CW keyer speed (WPM)" value="22"><span class="cw-wpm-val">22 WPM</span></label><label class="cw-wpm" title="CAT keyer — the rig generates CW (rig in CW). Zero extra hardware."><span>Keyer</span><select class="settings-input cw-keyer-select" aria-label="CW keyer back-end"><option value="cat" title="CAT keyer — the rig generates CW (rig in CW). Zero extra hardware.">CAT</option><option value="serial" title="Serial keyline — Nexus toggles DTR/RTS into the rig's KEY jack (rig in CW, rig shapes the signal). The clean N1MM/fldigi method for rigs without CAT CW. Set the keyline port + line in Settings ▸ CW.">Serial</option><option value="winkeyer" title="K1EL WinKeyer — hardware keyer over serial (rig in CW). Set its port in Settings ▸ CW.">WinKeyer</option><option value="soundcard" title="Soundcard keyer — a keyed audio tone (this TAKES THE RADIO OUT OF CW, into a data mode like FT8 uses; CW mode returns when you pick another keyer). A workaround: works ONLY if Nexus's audio output is routed to the rig (like FT8) AND PTT works, and you must keep drive below ALC. WinKeyer or the serial keyline are the clean options.">Soundcard</option></select></label><label class="cw-wpm" title="Sidetone / zero-beat pitch (Hz) — the scope's dashed marker"><span>Pitch</span><input type="number" class="settings-input cw-pitch" min="300" max="1200" step="10" aria-label="CW pitch (Hz)" value="600"></label><div class="ph-filter" title="RX filter / passband width (CAT) — narrow to dig CW out of QRM"><span class="ph-filter-lbl">BW</span><button type="button" class="ph-filter-step" title="Narrower (−50 Hz)">−</button><span class="ph-filter-val mono">500</span><button type="button" class="ph-filter-step" title="Wider (+50 Hz)">+</button></div><span role="group" aria-label="Rotator" title="Rotator at NaN° true" style="display: inline-flex; align-items: center; gap: 0.35rem; color: inherit;"><span style="font-size: 0.65em; letter-spacing: 0.08em; opacity: 0.55; font-weight: 600;" aria-hidden="true">ROTOR</span><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="flex: 0 0 auto;"><circle cx="11" cy="11" r="10" fill="none" stroke="currentColor" stroke-opacity="0.3"></circle><g transform="rotate(NaN 11 11)"><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line><circle cx="11" cy="2" r="1.4" fill="currentColor"></circle></g></svg><span class="mono" style="font-size: 0.95em; font-weight: 600; white-space: nowrap;">NaN°T</span><span class="mono" style="font-size: 0.75em; opacity: 0.8; white-space: nowrap;" title="Auto-tracking {{bird}} ({{state}}) — the Satellites section owns the rotor until LOS">⟳ {{bird}}</span><button type="button" style="font: inherit; color: inherit; background: transparent; border: 1px solid; border-radius: 4px; padding: 3px 8px; opacity: 0.7; cursor: pointer;" title="Stop rotation NOW (mid-pass: stops the satellite track too)">■</button></span><div class="ph-split "><button class="ph-split-toggle" title="Work split — TX off your RX frequency (e.g. up 5)">SPLIT</button><button class="ph-split-step" title="TX 1 kHz lower">−</button><span class="ph-split-amt mono" title="TX offset from your RX dial (kHz)">+5</span><button class="ph-split-step" title="TX 1 kHz higher">+</button></div><button type="button" class="ph-rec" aria-label="Record QSO audio" title="Record the received audio to a WAV in the recordings folder"><span class="ph-rec-dot" aria-hidden="true">●</span>REC</button></div><div class="ch-actions"><span class="cockpit-txstate">▼ RX</span><button type="button" class="cockpit-stoptx" title="Stop TX (Esc)">Stop TX</button><span class="cockpit-cat ok" title="CAT link OK">CAT ✓</span></div></div><section class="ph-scope-panel" title="Scroll here to tune the VFO"><div class="ph-scope-head"><span class="ph-scope-title" title="Receiver AUDIO centered on your CW pitch (288–913 Hz) — tune a signal onto the dashed hairline, mid-screen, to zero-beat it.">CW audio <span class="ph-scope-sub">· zero-beat</span></span><span class="zb idle" role="group" aria-label="Zero-beat tuning indicator" title="Where the received tone sits against your CW pitch. The light comes on within 25 Hz. Tune until the needle centres — it runs the same way as the scope below it. Display only: it never moves your radio."><span class="zb-name">Zero beat</span><span class="zb-lamp" aria-hidden="true"></span><span class="zb-bar" aria-hidden="true"><span class="zb-centre"></span></span><span class="zb-read">no signal</span></span><span class="ph-scope-head-label">Colors</span><select class="wf-palette" aria-label="Waterfall color palette (Phone, CW, RTTY and SSTV — FT has its own)" title="Waterfall color palette — shared by Phone, CW, RTTY and SSTV. The FT waterfall keeps its own."><option value="auto">Auto (theme)</option><option value="inferno">Inferno</option><option value="viridis">Viridis</option><option value="turbo">Turbo</option><option value="sdr-green">SDR Green</option><option value="amber-crt">Amber CRT</option><option value="blue">Blue</option><option value="grayscale">Grayscale</option></select></div><div data-testid="scope-stub"></div></section><div class="pane-splitter horizontal" role="separator" aria-orientation="horizontal" aria-label="scope height" title="Drag to resize (scope height)"></div><div class="cockpit-panes" data-cols="1" data-flow="stack"><div class="cockpit-col"><section class="pane-frame" data-pane="decode" data-fit="fill" aria-label="Decode" style="flex: var(--cockpit-pane-flex, 3 1 0); min-height: var(--cockpit-fill-min, 0);"><header class="pane-head"><span class="pane-title">Decode</span><div class="cockpit-pane-acts"><span class="cw-ai-beta">AI</span><span class="cw-decode-wpm">22 WPM</span><button type="button" role="switch" aria-checked="false" class="toggle" title="AI decoder off (classic pitch decoder) — click to turn AI on"><span class="toggle-knob"></span></button><button class="cw-decode-clear" title="Clear the decoded + sent transcript">Clear</button></div></header><div class="pane-body"><div class="cw-decode panel" title="Live CW decode — the AI (neural-net) decoder reads the whole 400–1200 Hz window, far better weak-signal copy than a pitch-tracking decoder. Turn AI off to fall back to the classic decoder."><div class="cw-decode-text" aria-hidden="true"><span class="cw-decode-idle">listening…</span></div><div class="sr-only" role="log" aria-label="Decoded CW">CQ CQ DE KD9TAW</div></div></div></section><section class="pane-frame" data-pane="rigctl" data-fit="content" aria-label="Rig controls" style="flex: 0 0 auto;"><header class="pane-head"><span class="pane-title">Rig controls</span><div class="cockpit-pane-acts"></div></header><div class="pane-body"><div class="cw-rigctl"><div class="ph-dsp" role="group" aria-label="Rig DSP functions"><span class="ph-dsp-label">DSP</span><button type="button" class="ph-dsp-btn on" aria-pressed="true" title="Noise Blanker — kills impulse/ignition noise (RX)">NB</button><button type="button" class="ph-dsp-btn on" aria-pressed="true" title="Noise Reduction — pulls a tone out of broadband hiss (RX, DSP)">NR</button><button type="button" class="ph-dsp-btn" aria-pressed="false" title="Auto-Notch (ANF) — nulls a competing carrier (RX, DSP)">Auto notch</button></div><div class="ph-dsp-levels" role="group" aria-label="RX DSP levels"><label class="ph-dsplev" title="Noise-reduction depth — raise until the noise floor drops, back off if the tone gets watery"><span>NR</span><input type="range" min="0" max="100" aria-label="Noise-reduction level" value="30"><span class="ph-power-val">30%</span></label><div class="ph-agc" role="group" aria-label="AGC speed" title="AGC time constant — Fast for CW/pileups, Slow for steady copy"><span class="ph-dsplev-lbl">AGC</span><button type="button" class="theme-chip" aria-pressed="false">Auto</button><button type="button" class="theme-chip active" aria-pressed="true">Fast</button><button type="button" class="theme-chip" aria-pressed="false">Mid</button><button type="button" class="theme-chip" aria-pressed="false">Slow</button><button type="button" class="theme-chip" aria-pressed="false">Off</button></div></div></div></div></section><section class="pane-frame" data-pane="bandActivity" data-fit="content" aria-label="Band activity" style="flex: 0 0 auto;"><header class="pane-head"><span class="pane-title">Band activity</span><div class= %; background: var(--state-pending);"></div></div><span class="ph-txmeter-value">—</span></div><div class="ph-txmeter" title="Speech compression"><span class="ph-txmeter-label">COMP</span><div class="ph-txmeter-track"><div class="ph-txmeter-fill" style="width: 0%; background: var(--state-pending);"></div></div><span class="ph-txmeter-value">—</span></div><span class="ph-txmeters-hint">TX meters — readings appear on transmit</span></div><div class="cw-macros" role="group" aria-label="CW macros"><button type="button" class="cw-macro" title="CQ CQ DE {MYCALL} {MYCALL} K"><span class="cw-macro-key">F1</span><span class="cw-macro-label">CQ</span></button><button type="button" class="cw-macro" title="! DE {MYCALL} {MYCALL} K"><span class="cw-macro-key">F2</span><span class="cw-macro-label">Call</span></button><button type="button" class="cw-macro" title="! DE {MYCALL} UR {RST} {RST} NAME {NAME} {NAME} HW? KN"><span class="cw-macro-key">F3</span><span class="cw-macro-label">Reply</span></button><button type="button" class="cw-macro" title="! DE {MYCALL} TU 73 SK"><span class="cw-macro-key">F4</span><span class="cw-macro-label">73</span></button><button type="button" class="cw-macro" title="{MYCALL}"><span class="cw-macro-key">F5</span><span class="cw-macro-label">My Call</span></button><button type="button" class="cw-macro" title="! "><span class="cw-macro-key">F6</span><span class="cw-macro-label">His Call</span></button><button type="button" class="cw-macro" title="AGN AGN"><span class="cw-macro-key">F7</span><span class="cw-macro-label">AGN</span></button><button type="button" class="cw-macro" title="? "><span class="cw-macro-key">F8</span><span class="cw-macro-label">?</span></button></div><div class="cw-send"><label class="cw-hiscall" title="The station you are working. The ! in a macro sends this call. A decoded call fills it in; type over it to answer someone else, then press Enter or a macro key."><span class="cw-hiscall-label">His call</span><input class="settings-input cw-hiscall-input" aria-label="His call" maxlength="15" autocomplete="off" spellcheck="false" value=""></label><input class="settings-input cw-type" placeholder="Type CW to send… (Enter)" autocomplete="off" spellcheck="false" value=""><button type="button" class="cw-send-btn" disabled="">Send</button></div></div></main>
