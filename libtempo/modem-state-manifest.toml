# =============================================================================================
# libtempo modem state manifest - AUTHORITATIVE
# =============================================================================================
#
# WHAT THIS IS
#   The complete, per-symbol classification of every module-scope / statically-allocated data
#   symbol in the vendored WSJT-X + FT1 Fortran under libtempo/vendor/wsjtx/lib/. The `file`
#   key of every [[symbol]] below is relative to that directory (so `ft8/ft8b.f90` means
#   libtempo/vendor/wsjtx/lib/ft8/ft8b.f90).
#
# WHY IT EXISTS
#   The decoders are 1990s-style Fortran: state lives in SAVE variables, DATA-initialized
#   locals, COMMON blocks, and - the part no grep finds - ordinary locals that gfortran spilled
#   into .bss because they exceed -fmax-stack-var-size. ALL of it is process-global. Two radio
#   chains decoding two different bands inside ONE process therefore share EVERY symbol in this
#   file unless the class-1 set is explicitly swapped at the decode() boundary.
#
#   The failure mode is not a crash. Chain A's callsign hash table, a7 replay list, IR-HARQ
#   slot buffer or cached wideband spectrum, consumed by chain B, produces a CRC-valid,
#   syntactically perfect, WRONG decode - logged, uploaded to LoTW/QRZ/ClubLog, and
#   indistinguishable after the fact from a real QSO. That is the entire reason this audit
#   exists, and it is why the tie-break rule is asymmetric: when the evidence is not decisive,
#   file the symbol class 1. A few bytes of memcpy against a fabricated QSO is not a trade.
#
# CLASSES
#   class 1 = PER-CHAIN   carries chain-specific data between calls; MUST be swapped
#   class 2 = INIT-ONCE   written once, content provably chain-independent; shareable
#   class 3 = SCRATCH     fully overwritten before read each call; shareable IF calls serialize
#   class 4 = CONSTANT    never written (PARAMETER or read-only DATA); shareable
#
# THE RULE (enforced, not advisory)
#   Every module-scope / statically-allocated data symbol in the vendored tree MUST appear here,
#   keyed by file:line. A vendor refresh that introduces a new one - or moves an existing one to
#   a new line - MUST classify it in this file. An unclassified symbol FAILS THE BUILD: the
#   manifest gate re-scans the tree, diffs the (file, line, name) key set against these tables,
#   and exits non-zero on any symbol it cannot find. Do not silence the gate by deleting rows;
#   re-key them. An unclassified symbol is, by default, a shared one - which is precisely the
#   bug class this manifest was written to prevent. (Gate not yet wired into CMake/CI - see the
#   implementer notes at the end of this file.)
#
# HOW THIS PASS DIFFERS FROM THE FIRST
#   The first pass (marked PARTIAL / do-not-build-from) died mid-run with 188 of 291 challenges
#   unexecuted, and - worse - could not attribute the results it did have, because 87 symbol
#   NAMES collide across files (`first` x23, `twopi` x11, `dt` x6, `icos7` x4, `one` x2, `cw`
#   x2 at 174 B and 580608 B in the same call chain). This pass was run BATCHED BY FILE GROUP
#   (six batches, listed below) and every verdict is KEYED BY file:line, never by name. Where a
#   name appears N times it now appears as N independent rows with N independent verdicts - and
#   several of those pairs genuinely disagree (tempofast_downsample.f90:47 `x` is class 1 while
#   tempofast_sync.f90:44 `x`, same source idiom, is class 3). Every row states whether it
#   upholds or OVERTURNS the first pass and why; sizes were re-measured against nm/size rather
#   than inferred from declarations.
#
# BATCHES (the file groups this pass was run in)
#   GROUP A - ft8 core: ft8b / ft8_downsample / sync8 / sync8d / subtractft8 / baseline /
#             get_spectrum_baseline / ft8apset
#   GROUP B - ft8 FEC: osd174_91 / bpdecode174_91 / decode174_91 / encode174_91(+_nocrc) /
#             get_crc14 / chkcrc14a
#   GROUP C - ft8 a7 + waveform + params: ft8_a7 / gen_ft8wave / genft8 / ft8_params / ft8_testmsg
#   GROUP D - ft4: ft4_decode / ft4_downsample / ft4_params / ft4_baseline / gen_ft4wave / genft4 /
#             get_ft4_bitmetrics / getcandidates4 / subtractft4 / sync4d
#   GROUP E - tempofast/FT1: tempofast_decode / tempofast_downsample / tempofast_sync /
#             gen_tempofastwave / gen_tempofast / ir_harq_combine / cpm_trellis /
#             matched_filter_bank / ldpc348_91 / turbo_decode_tempofast / tempofast_interleave /
#             tempofast_demod_bcjr / bcjr_cpm / tempofast_rv_detect / tempofast_params /
#             tempofast_test
#   GROUP F - shared 77bit/lib: packjt77 / packjt / pfx / four2a / fftw3mod / crc / timer_module /
#             indexx / polyfit / stateless leaf routines
#
# THE NUMBER THAT MATTERS
#   TOTAL CLASS-1 BYTES = 3,530,670 (3.37 MiB) of DISTINCT storage.
#   That is the per-chain context cost, and the whole two-radio design rests on it.
#   The 67 class-1 [[symbol]] rows sum to 3,821,000; the 290,330 B difference is deliberate
#   double-counting of shared storage addressed under two names (the ft4_downsample x/cx
#   EQUIVALENCE pair, 290,304 B, plus the two cross-file packjt77 write-site rows, 26 B).
#   See [summary] for the full breakdown.
# =============================================================================================


# =============================================================================================
# CLASS 1 - PER-CHAIN. THE MEMCPY SET.
# 67 symbols, 3,530,670 bytes of DISTINCT storage (rows sum to 3,821,000; see class_1_bytes_double_counted)
# ---------------------------------------------------------------------------------------------
# Carries chain-specific data ACROSS a call boundary: written on one call, read on a later
# one, with content that depends on which radio/band/QSO produced it. Shared between two
# chains this does not crash - it produces WELL-FORMED WRONG DECODES that pass CRC and get
# logged. Every symbol here must live in the per-chain context and be swapped at the
# decode() boundary. Rows with size_bytes = 0 are EQUIVALENCE aliases or cross-file write
# sites whose storage is counted once under the owning row - do not allocate them twice.
#
# IMPLEMENTATION STATUS (2026-07-21). Every class-1 row below now carries an explicit verdict
# at the END of its `reason`: either "IN THE PER-CHAIN CONTEXT as <component>" or "NOT IN
# CONTEXT" plus why. 43 of the 68 rows are in tempo_ctx_t (libtempo/ft8_cabi.f90); 25 are not.
#
# Getting to 43 required HOISTING 18 symbols out of vendored subroutines into modules, because
# a SAVE/DATA local of a subroutine is a FILE-LOCAL symbol (nm: `apbits.5`, `hashmy10.13`) that
# no other compilation unit can name - it cannot be swapped until it moves to module scope.
# The hoists, each marked with a MODIFIED FOR NEXUS header a vendor refresh must re-apply:
#   ft4_decode.f90        -> module ft4_decode_apstate  (apbits, apmy_ru, aphis_fd,
#                                                        mycall0, hiscall0)
#   tempofast_decode.f90  -> module ft1_decode_apstate  (apbits, mycall0, hiscall0)
#   77bit/packjt77.f90    -> module scope, out of unpack77 (mycall13_0, dxcall13_0,
#                            mycall13_set, dxcall13_set, hashmy10/12/22, hashdx10/12/22)
# (ft8/ft4/tempofast_downsample.f90 -> *_downsample_state were hoisted in the earlier pass.)
#
# The 25 NOT in the context are not an admission of risk, they are a finding: this pass
# re-derived each from the source rather than inheriting the audit's tie-break, and each is
# either chain-INDEPENDENT in content, not statically allocated at all, or already per-chain by
# construction. Three of them are REAL DEFECTS that a memcpy would have hidden rather than
# fixed, and they are recorded here so they are not lost:
#   * ft8b.f90's `mcq=2*mcq-1` family - non-idempotent transform re-fires if ncontest ever
#     alternates. Corrupts a SINGLE chain too. Fix the transform, not the scoping.
#   * gen_ft4wave.f90 / gen_tempofastwave.f90 - the whole first-call block latches the FIRST
#     caller's fsample, and callers genuinely disagree (48 kHz TX vs 12 kHz subtract) WITHIN
#     one chain. Recompute on fsample change; that is a waveform change needing approval.
#   * ft4_decode.f90 `napwid` - assigned inside `if(ipass.gt.3)`, read on every pass to pick
#     OSD depth. Upstream read-before-write; fixing it changes which codewords are accepted.
# =============================================================================================

# --- group A ---

[[symbol]]
name = "x"
file = "ft8/ft8_downsample.f90"
line = 11
class = 1
size_bytes = 768008
reason = "WRITTEN only under `if(newdat)` (:23-29); READ unconditionally at :40 (`c1(k)=cx(i)`) on EVERY call. The write gate is a DUMMY argument that this routine itself clears at :28, so whether the buffer is refreshed is decided by CALLER-owned state, not by entry. Both callers hard-code a non-refresh path: ft8b.f90:140 and ft8_a7.f90:172 pass the literal .false., so the majority of calls consume a spectrum they did not compute. Contents = one chain's ENTIRE 192000-point wideband audio spectrum. If chain B refreshes it and chain A's next candidate reuses it, chain A downsamples chain B's audio at chain A's frequency and logs chain B's stations on chain A's band -- precisely the plausible-wrong-decode failure. It self-heals ONLY if every chain re-enters via ft8_cabi.f90:266/:351 (newdat=.true. per pass) with no interleave finer than a whole ft8_decode_frame; nothing in this file enforces that. nm: `b equiv.0.0` 0xbb808 = 768008 B .bss. Upholds first pass class 1. IN THE PER-CHAIN CONTEXT as p%ft8_spec (the cx face of the EQUIVALENCE carries the whole block) (ft8_cabi.f90)."

[[symbol]]
name = "cx"
file = "ft8/ft8_downsample.f90"
line = 10
class = 1
size_bytes = 0
reason = "EQUIVALENCE alias of x (association declared at :14); identical 768008-byte block (nm equiv.0.0) -- complex(0:NFFT1/2)=96001 elems = exactly x's 192002 reals. cx is the READ face of the cache (:40) while x is the WRITE face (:25-26), so an alias-blind scan that only looked for the written name would classify the read side as untouched. Save/restore the block once under either name. First pass keyed the group only at :11 and never at :10; recorded separately here. sizeBytes 0 to avoid double-counting the shared storage. IN THE PER-CHAIN CONTEXT as p%ft8_spec (ft8_cabi.f90)."

[[symbol]]
name = "mcq"
file = "ft8/ft8b.f90"
line = 39
class = 1
size_bytes = 116
reason = "OVERTURNS first pass (class 2). DATA {0,1} at :39, then transformed IN PLACE by `mcq=2*mcq-1` at :52 -- a NON-IDEMPOTENT write (-1 -> -3 -> -7, never recoverable). The write is gated by `if(first.or.(ncontest.ne.ncontest0))` at :51, i.e. by two OTHER pieces of persistent state, one of which (ncontest0) is an argument echo. Read at :303/:309 as `llrz(1:29)=apmag*mcq(1:29)` with apmask(1:29)=1, forcing 29 callsign bits before OSD in decode174_91 -- wrong signs/magnitudes here manufacture CRC-valid but WRONG callsigns, the exact logged-false-decode mode. First pass's class 2 rests on 'ncontest is the literal 0 at ft8_cabi.f90:207' -- a property of today's caller, not of this symbol (the same reasoning that mis-filed ir_harq_combine `slots`). Worse, ANY partial split (per-chain `first` with shared mcq, or the reverse) re-fires the transform and corrupts the AP table for the life of the process. nm: `d mcq.34` 0x74 in .DATA, not .bss -- a per-chain copy MUST be seeded from the load-time image, never zero-filled (zero-filled -> all bits become -1 -> forced wrong CQ mask). Move the whole :39-:47 + :29 cluster per-chain; total cost 816 B. NOT IN CONTEXT (2026-07-21). Content is chain-INDEPENDENT: the post-transform table is a fixed function of the DATA literal, with no per-call, per-band or per-chain input, so there is nothing chain-specific to swap. The hazard this row was filed under is that `mcq=2*mcq-1` is NON-IDEMPOTENT and re-fires whenever ncontest differs from the previous call's -- an upstream WSJT-X defect that corrupts a SINGLE chain just as surely (toggle contest mode twice) and that per-chain copies would MASK rather than fix. ncontest is the literal 0 at ft8_cabi.f90's ft8_decode_frame, so the :51 guard fires exactly once per process. If ncontest ever becomes runtime state, fix the transform (make it idempotent or move it out of the guarded block); do not paper over it with a memcpy. Whole cluster {first, ncontest0, mcq, mcqru, mcqfd, mcqtest, mcqww, mrrr, m73, mrr73} stays shared TOGETHER -- a partial split is the one configuration that really does corrupt."

