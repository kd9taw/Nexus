# Nexus release pipeline — tag → build every platform → verify → publish.
#
# GitHub is primary. Push a version tag and this builds Windows, Linux x86_64, and the
# two Raspberry Pi bases, verifies each artifact, and publishes a GitHub Release with all
# of them attached. No hand-assembly, no scrub — this repo IS the published source.
#
#   git tag v0.14.0 && git push origin v0.14.0     # full automatic release
#   (Actions ▸ Release ▸ Run workflow)             # build + verify only, publishes NOTHING
#
# The manual (workflow_dispatch) path exists to prove a build green WITHOUT cutting a
# release: every build/verify job runs, but the publish job is gated on a real tag push.
#
# SCOPE: this publishes to GitHub. SourceForge FRS upload and the version.json update
# endpoint are a deliberate fast-follow (each needs its own secret + external system);
# the SF *git* mirror is scripts/mirror-to-sourceforge.sh. See
# nexus-notes/single-repo-pipeline-plan.md.
#
# WHY THE GATES: on 2026-07-20 a fully-green build shipped a .deb with the AI CW model
# silently absent (14 MB light, no error anywhere). "Automatic on tag" here does NOT mean
# "unchecked" — every artifact is proven (arch, model present + digest, version == tag)
# before the release is created.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Creating a Release needs write access to the repo contents.
permissions:
  contents: write

env:
  # The DeepCW model is gitignored (AGPL-3.0 (c) e04); every build job stages it from this
  # release and pins it by digest. One place to bump if it is ever re-folded.
  DEEPCW_RELEASE: deepcw-model-v1
  MODEL_SHA: a7b3b4aa2610d3e88b8c7d4420eceee31be2d0ae595b3413264334f3ffb1eab5
  MODEL_JSON_SHA: b4342157b90229ee7380e165f3d8036179b80d1e6ae02f2557388b7fcd558c01
  # The highest glibc symbol version the published x86_64 Linux binaries may require, and
  # therefore the oldest distro they run on. 2.39 = Ubuntu 24.04, which is what the pinned
  # `ubuntu-24.04` runner below produces today; docs/install.md states the same floor to
  # operators and the two must be changed together.
  #
  # WHY THIS IS A GATE AND NOT A COMMENT. Before it, the floor was an emergent property of the
  # string `ubuntu-latest`: nothing pinned it, nothing declared it, and nothing checked it. It
  # silently excluded Ubuntu 22.04 and every Mint 21.x built on it (glibc 2.35 — issue #3), and
  # the day GitHub rolls that label to a newer image it would rise again and break the operators
  # who work today, with no commit to blame and a fully green build. An AppImage cannot absorb
  # it either: an AppImage bundles application libraries, not libc.
  #
  # The .deb declares no `libc6 (>= x.y)` to catch it at install time, and it deliberately must
  # not: `bundle.linux.deb.depends` in tauri.conf.json is the ONLY deb-depends config in the
  # repo and ALL FIVE .debs build from it — scripts/Dockerfile.pi seds the bundle list and
  # createUpdaterArtifacts, never depends — so an x86 floor stamped there would make the Pi
  # bookworm package (glibc 2.36) refuse to install on the Pis it serves today. Any declared
  # floor has to be per-target.
  GLIBC_FLOOR: '2.39'

jobs:
  # ---------------------------------------------------------------------------------------
  # Linux x86_64 — .deb + AppImage via the same scripts/build-linux.sh developers use.
  # ---------------------------------------------------------------------------------------
  linux-x86:
    name: Linux x86_64 (.deb + AppImage)
    # PINNED, not `ubuntu-latest`. The build host's glibc IS the floor of every published
    # x86_64 artifact, so an unpinned label makes the supported-distro list move on GitHub's
    # schedule rather than ours. The arm64 jobs below have always been pinned AND containerised
    # (`debian:${BASE}`) and name their base in the filename; this is the same discipline for
    # x86_64. Changing this line changes who can run Nexus — keep it in step with GLIBC_FLOOR
    # and docs/install.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Stage the DeepCW model (not committed — AGPL-3.0 (c) e04)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$DEEPCW_RELEASE" --repo "${{ github.repository }}" \
            --pattern 'model.onnx*' --dir src-tauri/resources/deepcw --clobber
          echo "$MODEL_SHA  src-tauri/resources/deepcw/model.onnx" | sha256sum -c -
          echo "$MODEL_JSON_SHA  src-tauri/resources/deepcw/model.onnx.json" | sha256sum -c -

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libsoup-3.0-dev patchelf \
            build-essential cmake ninja-build gfortran \
            libfftw3-dev libboost-dev libasound2-dev libudev-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # AppImage's bundler (appimagetool) normally needs FUSE, which hosted runners lack.
      # APPIMAGE_EXTRACT_AND_RUN makes it self-extract instead — the standard CI workaround.
      - name: Build .deb + AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The AppImage is self-updatable and gets a .sig; the .deb is apt-managed and cannot
          # self-update, so it is published unsigned by design.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-linux.sh

      - name: Verify artifacts
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          app=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          [ -n "$deb" ] || { echo "no .deb produced"; exit 1; }
          [ -n "$app" ] || { echo "no .AppImage produced"; exit 1; }
          [ "$(dpkg-deb -f "$deb" Architecture)" = "amd64" ] || { echo "deb not amd64"; exit 1; }
          # The model must be IN the package — the failure that shipped on 2026-07-20 is
          # invisible to every check except looking inside the artifact.
          dpkg-deb -x "$deb" /tmp/dc
          m=/tmp/dc/usr/lib/Nexus/resources/deepcw/model.onnx
          [ -s "$m" ] || { echo "DeepCW model missing from the .deb"; exit 1; }
          echo "$MODEL_SHA  $m" | sha256sum -c -
          # GLIBC FLOOR — the check that makes the supported-distro list a decision instead of
          # a side effect of the runner image. Both shipped binaries are read: the .deb's
          # payload and the AppImage's INNER binary, because an AppImage bundles application
          # libraries but not libc, so it carries exactly the same requirement and papers over
          # nothing. A binary needing more than GLIBC_FLOOR cannot start on the oldest distro we
          # say we support, which is the failure operators actually meet: the package installs,
          # the menu entry appears, and clicking it does nothing at all.
          #
          # Sorted with `sort -V` because glibc versions are not lexical — 2.9 sorts after 2.39
          # as text and before it as a version.
          appdir=$(mktemp -d)
          chmod +x "$app"
          app_abs=$(readlink -f "$app")
          ( cd "$appdir" && "$app_abs" --appimage-extract >/dev/null )
          floor_ok() {
            # `|| true` on the pipeline, not on the assignment: under `set -e` a grep that
            # matches nothing would abort the step before the empty-result check below could
            # report WHY. An empty result means the check itself is broken (wrong path, objdump
            # missing, a statically linked binary) and must fail loudly, not pass quietly.
            need=$( { objdump -T "$2" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' \
                      | sort -uV | tail -1; } || true )
            [ -n "$need" ] || { echo "$1: no GLIBC symbol versions found in $2 — check broken"; exit 1; }
            if [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$need" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
              echo "$1 requires GLIBC_$need, above the declared floor GLIBC_$GLIBC_FLOOR."
              echo "The build host moved, or a new dependency raised it. Do NOT just bump the"
              echo "floor: that silently drops every operator between the two versions."
              exit 1
            fi
            echo "$1: needs GLIBC_$need, floor GLIBC_$GLIBC_FLOOR — ok"
          }
          floor_ok "deb payload" /tmp/dc/usr/bin/Nexus
          floor_ok "AppImage inner binary" "$appdir/squashfs-root/usr/bin/Nexus"
          mkdir -p out && cp "$app" out/
          # NAME THE PC PACKAGE FOR THE MACHINE IT INSTALLS ON, not just its architecture
          # (operator ask, 1.0.0). Tauri emits Nexus_<ver>_amd64.deb; the Pi jobs emit
          # Nexus_<ver>_pi_arm64_<base>.deb. Someone scanning the release page should not have to
          # know that amd64 means "PC" and arm64 means "Pi" to pick the right file. The AppImage
          # keeps its name deliberately: it is one of the two SIGNED self-updating artifacts and
          # is not a Debian package, so renaming it would churn the updater manifest for nothing.
          ver=$(dpkg-deb -f "$deb" Version)
          cp "$deb" "out/Nexus_${ver}_pc_amd64.deb"
          # The AppImage's updater signature, when the signing secrets were present.
          [ -f "$app.sig" ] && cp "$app.sig" out/ || echo "note: unsigned build (no signing secrets)"
          ( cd out && sha256sum ./* )

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x86
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Windows — cross-compiled NSIS installer (offline WebView2 + Hamlib bundled).
  # ---------------------------------------------------------------------------------------
  windows:
    name: Windows (NSIS installer)
    runs-on: ubuntu-latest
    env:
      # Baked into the binary via option_env! (build.rs). Only referenced in this
      # tag/dispatch-triggered job — NEVER in a pull_request job — so a fork PR cannot
      # reach it. The key is extractable from any shipped binary regardless (it is a
      # read-only ClubLog most-wanted token); the proper fix is a proxy — see
      # nexus-notes/clublog-key-proxy-plan.md.
      CLUBLOG_API_KEY: ${{ secrets.CLUBLOG_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage the DeepCW model (not committed — AGPL-3.0 (c) e04)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$DEEPCW_RELEASE" --repo "${{ github.repository }}" \
            --pattern 'model.onnx*' --dir src-tauri/resources/deepcw --clobber
          echo "$MODEL_SHA  src-tauri/resources/deepcw/model.onnx" | sha256sum -c -
          echo "$MODEL_JSON_SHA  src-tauri/resources/deepcw/model.onnx.json" | sha256sum -c -

      - name: Install MinGW-w64 cross toolchain + NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gfortran-mingw-w64-x86-64 \
            libboost-dev cmake ninja-build build-essential nsis

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-gnu

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cross-build the NSIS installer
        # Signed for self-update: the bundler emits a `.sig` beside the installer when these are
        # present. If the secrets are absent (a fork, or before they are configured) the build
        # still succeeds unsigned — the updater simply has nothing to verify, which is the right
        # failure: no release, rather than an unsigned one clients would refuse anyway.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-windows-cross.sh

      - name: Verify installer
        run: |
          set -euo pipefail
          exe=$(find src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis -name '*-setup.exe' -print -quit)
          [ -n "$exe" ] || { echo "no NSIS installer produced"; exit 1; }
          # It bundles the offline WebView2 runtime + Hamlib, so it is large by design; a
          # runt file means a bundling step silently no-op'd.
          sz=$(stat -c%s "$exe")
          [ "$sz" -gt 50000000 ] || { echo "installer only $sz bytes — bundling likely failed"; exit 1; }
          mkdir -p out && cp "$exe" out/
          # The updater signature, when the signing secrets were present.
          [ -f "$exe.sig" ] && cp "$exe.sig" out/ || echo "note: unsigned build (no signing secrets)"
          ( cd out && sha256sum ./* )

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Raspberry Pi — one .deb per live Pi OS base, native on the hosted arm64 runner.
  # (Same job as ci.yml's pi-deb; duplicated here so a tag builds everything in one run.)
  # ---------------------------------------------------------------------------------------
  pi:
    name: Raspberry Pi .deb (${{ matrix.base }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        base: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v7

      - name: Stage the DeepCW model (not committed — AGPL-3.0 (c) e04)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$DEEPCW_RELEASE" --repo "${{ github.repository }}" \
            --pattern 'model.onnx*' --dir src-tauri/resources/deepcw --clobber
          echo "$MODEL_SHA  src-tauri/resources/deepcw/model.onnx" | sha256sum -c -
          echo "$MODEL_JSON_SHA  src-tauri/resources/deepcw/model.onnx.json" | sha256sum -c -

      - name: Build .deb in a debian:${{ matrix.base }} container
        run: >
          docker buildx build
          --platform linux/arm64
          -f scripts/Dockerfile.pi
          --build-arg BASE=${{ matrix.base }}
          --progress=plain
          --target export
          --output type=local,dest=pi-out/${{ matrix.base }}
          .

      - name: Tag the artifact with its base, and verify it
        run: |
          set -euo pipefail
          deb=$(find pi-out/${{ matrix.base }} -name '*.deb' -print -quit)
          [ -n "$deb" ] || { echo "no .deb produced"; exit 1; }
          ver=$(dpkg-deb -f "$deb" Version)
          [ "$(dpkg-deb -f "$deb" Architecture)" = "arm64" ] || { echo "not arm64"; exit 1; }
          dpkg-deb -x "$deb" /tmp/debcheck
          bin=$(find /tmp/debcheck/usr/bin -type f -print -quit)
          file "$bin" | grep -q 'ARM aarch64' || { echo "payload is not ARM aarch64"; exit 1; }
          m=/tmp/debcheck/usr/lib/Nexus/resources/deepcw/model.onnx
          [ -s "$m" ] || { echo "DeepCW model missing from the package"; exit 1; }
          echo "$MODEL_SHA  $m" | sha256sum -c -
          mv "$deb" "pi-out/${{ matrix.base }}/Nexus_${ver}_pi_arm64_${{ matrix.base }}.deb"
          sha256sum pi-out/${{ matrix.base }}/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-pi-${{ matrix.base }}
          path: pi-out/${{ matrix.base }}/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Publish — only on a real tag push. Gathers every artifact, proves version == tag across
  # ALL of them, and creates the GitHub Release. A dispatch run stops before this.
  # ---------------------------------------------------------------------------------------
  # ---------------------------------------------------------------------------------------
  # Windows artifact smoke — install the ACTUAL installer on a real Windows runner, launch
  # the ACTUAL installed exe, and require it to still be running 45 s later. This is the
  # dead-on-arrival gate: a cross-built artifact can pass every Linux-side check and still
  # crash at startup on real Windows (missing DLL, bundler no-op, WebView2 wiring). Runs on
  # BOTH the tag path and the dispatch dry-run, so a broken artifact is caught in rehearsal.
  # ---------------------------------------------------------------------------------------
  smoke-windows:
    name: Smoke — install + launch the Windows artifact
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nexus-windows
          merge-multiple: true

      - name: Silent-install the NSIS artifact
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no *-setup.exe in the nexus-windows artifact' }
          Write-Host "installing $($setup.Name) silently (per-user, /S)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

      - name: Launch the installed app and require it to stay alive
        shell: pwsh
        run: |
          # Per-user NSIS install → find the installed exe under LOCALAPPDATA.
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'Nexus.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw "Nexus.exe not found under $env:LOCALAPPDATA after install" }
          Write-Host "launching $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          # First run does real work (profile creation, webview init) — give it
          # 45 s, then the only question that matters: is it still running?
          Start-Sleep -Seconds 45
          if ($p.HasExited) {
            throw "app exited during startup (code $($p.ExitCode)) — dead-on-arrival artifact"
          }
          Write-Host "alive after 45 s (pid $($p.Id)) — startup smoke passed"
          Stop-Process -Id $p.Id -Force

  publish:
    name: Publish GitHub Release
    # Windows + Linux gate the release (operator's release order); the Pi .debs attach
    # in publish-pi as they finish and can never hold the primary artifacts hostage.
    # smoke-windows gates too: an installer that dies at launch must never publish.
    needs: [linux-x86, windows, smoke-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # `actions: write` is for the downstream hand-off at the end of this job. Job-level
    # permissions REPLACE the workflow-level block rather than adding to it, so `contents:
    # write` is repeated here — without it this job loses its ability to create the release.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need tags + history for the notes range

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nexus-linux-x86
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nexus-windows
          merge-multiple: true

      - name: Derive + cross-check the version
        id: ver
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          # The tag must match the version in tauri.conf.json — the single source of truth
          # every artifact is stamped from. A mismatch means someone forgot to bump.
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          [ "$conf" = "$ver" ] || { echo "tag $tag ($ver) != tauri.conf.json ($conf)"; exit 1; }
          # And every artifact filename must carry that exact version — catches a stale
          # artifact from a cached/retried job sneaking into the release.
          for f in dist/*; do
            case "$(basename "$f")" in
              *"$ver"*) : ;;
              *) echo "artifact does not carry version $ver: $f"; exit 1 ;;
            esac
          done
          echo "All artifacts stamped $ver:"; ls -la dist/

      - name: Assemble release notes
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.ver }}"
          notes="dist/NOTES.md"
          if [ -f "docs/RELEASE_NOTES-$ver.md" ]; then
            cp "docs/RELEASE_NOTES-$ver.md" "$notes"
          else
            # Fall back to the commit range since the previous tag. Hand-written notes in
            # docs/RELEASE_NOTES-<ver>.md take precedence when present.
            prev=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag }}^" 2>/dev/null || true)
            echo "# Nexus $ver" > "$notes"; echo >> "$notes"
            if [ -n "$prev" ]; then
              echo "Changes since $prev:" >> "$notes"; echo >> "$notes"
              git log --no-merges --pretty='- %s' "$prev..${{ steps.ver.outputs.tag }}" >> "$notes"
            else
              git log --no-merges --pretty='- %s' -n 50 "${{ steps.ver.outputs.tag }}" >> "$notes"
            fi
          fi
          echo "----- notes -----"; cat "$notes"

      - name: Checksums
        run: ( cd dist && sha256sum Nexus_* | tee SHA256SUMS.txt )

      # The self-update manifest. Generated FROM the .sig files the bundler just produced, so it
      # can never disagree with what actually shipped — a hand-maintained manifest is a signature
      # mismatch waiting to happen, and the client's only symptom would be a silent refusal.
      #
      # Windows NSIS + Linux AppImage only: .deb (amd64 and both Pi bases) is apt-managed and
      # cannot self-update, so those platforms keep the notify-and-download path forever. Emitting
      # a manifest entry for them would promise an update route that does not exist.
      - name: Build the updater manifest (latest.json)
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.ver }}'
          tag='${{ steps.ver.outputs.tag }}'
          base="https://github.com/kd9taw/Nexus/releases/download/$tag"
          win=$(find dist -name '*_x64-setup.exe' -print -quit)
          app=$(find dist -name '*_amd64.AppImage' -print -quit)
          platforms=''
          add() { # $1=platform key  $2=artifact path
            [ -n "$2" ] && [ -f "$2.sig" ] || { echo "note: no signature for ${1:-?} — omitting"; return; }
            platforms="$platforms$(printf '"%s":{"signature":"%s","url":"%s/%s"},' \
              "$1" "$(cat "$2.sig")" "$base" "$(basename "$2")")"
          }
          add "windows-x86_64" "$win"
          add "linux-x86_64"   "$app"
          if [ -z "$platforms" ]; then
            echo "No signed artifacts — skipping latest.json. Clients keep the notify-only path."
            exit 0
          fi
          printf '{"version":"%s","notes":"See the release notes.","pub_date":"%s","platforms":{%s}}\n' \
            "$ver" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${platforms%,}" > dist/latest.json
          python3 -c "import json;json.load(open('dist/latest.json'));print('latest.json valid')"
          cat dist/latest.json

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Nexus ${{ steps.ver.outputs.ver }}" \
            --notes-file dist/NOTES.md \
            dist/Nexus_* dist/SHA256SUMS.txt \
            $( [ -f dist/latest.json ] && echo dist/latest.json )

  # Second wave (operator's release order: Windows + Linux first, then Pi): attach the
  # Raspberry Pi .debs to the already-published release as their builds finish. Waits on
  # publish so the release exists; a Pi failure never blocks the primary platforms.
      # ── HAND OFF TO THE DOWNSTREAM PUBLISH ────────────────────────────────────────────
      # Without this, publish.yml never runs on its own and the release reaches NOBODY: the
      # SourceForge upload, the site's version.json and the Cloudflare deploy all wait on it,
      # and nothing goes red — which is exactly how 1.0.1 shipped while the in-app update check
      # told every operator 1.0.0 was newest for two days. It was still true at 1.0.5 (every
      # run of publish.yml in this repo's history has been a manual dispatch), so this closes it.
      #
      # `on: release: published` cannot do the job: GitHub suppresses events raised by
      # GITHUB_TOKEN to stop recursion, and this job creates the release with exactly that.
      # workflow_dispatch is the documented exception — "workflow_dispatch and
      # repository_dispatch events always create workflow runs" — so NO PAT is needed, only
      # `actions: write` above. publish.yml's own header says a PAT is required; that is wrong,
      # and it is corrected there.
      #
      # Fired from THIS job rather than publish-pi on purpose. publish.yml opens by polling for
      # all five installers and their checksums with a 30-minute deadline, so it is built to be
      # started before the Pi .debs land and to wait for them. And publish-pi SKIPS when the Pi
      # build fails (0.18.0), which would leave the hand-off unreachable in the one case where
      # someone most needs to be told — this way it times out loudly instead.
      #
      # `|| true`: the release itself is already published and correct at this point. A failed
      # hand-off must not turn a good release red; the run summary carries the warning and the
      # manual dispatch is still there.
      - name: Hand off to the downstream publish (SourceForge + site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh workflow run publish.yml --repo "${{ github.repository }}" -f tag="$tag"; then
            echo "Dispatched publish.yml for $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Downstream publish was NOT dispatched"
              echo "The release is published and correct, but SourceForge, the site's"
              echo "\`version.json\` and the Cloudflare deploy have not run."
              echo ""
              echo "Run it by hand:"
              echo '```'
              echo "gh workflow run publish.yml --repo ${{ github.repository }} -f tag=$tag"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-pi:
    name: Attach Raspberry Pi .debs
    needs: [publish, pi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pidist
          pattern: nexus-pi-*
          merge-multiple: true
      - name: Upload to the release + extend SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -la pidist/
          gh release upload "$tag" --repo "${{ github.repository }}" pidist/Nexus_* --clobber
          # Append the Pi sums to the published SHA256SUMS.txt so one file covers all.
          gh release download "$tag" --repo "${{ github.repository }}" --pattern SHA256SUMS.txt --dir . --clobber
          ( cd pidist && sha256sum Nexus_* ) >> SHA256SUMS.txt
          gh release upload "$tag" --repo "${{ github.repository }}" SHA256SUMS.txt --clobber
