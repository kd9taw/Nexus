# DIAGNOSTIC BRANCH ONLY (never merged): investigates the Windows startup heap corruption
# (STATUS_HEAP_CORRUPTION, 0xC0000374) the 1.25.0 dry run's Windows smoke hit. It builds nothing:
# it installs a Windows artifact an earlier release.yml run made, reproduces the crash, prints the
# app's own diagnostic log and the Windows error record, and then runs the exe under cdb, first on
# the normal heap and then with full page heap, to get the stack that corrupts the heap.
name: Release

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: release.yml run whose nexus-windows artifact to diagnose
        default: '44032822546'

permissions:
  contents: read
  actions: read

jobs:
  diag-windows:
    name: Diag — Windows startup heap corruption
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      _NT_SYMBOL_PATH: srv*C:\sym*https://msdl.microsoft.com/download/symbols
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexus-windows
          path: dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: Silent-install the NSIS artifact
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          Write-Host "installing $($setup.Name)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

      - name: Debugging tools on this runner
        shell: pwsh
        run: |
          $dbg = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          Get-ChildItem $dbg -Filter *.exe -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize
          Get-Command procdump -ErrorAction SilentlyContinue

      - name: Plain launch x5 (reproduce) + the app's logs + the Windows error record
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'Nexus.exe' | Select-Object -First 1).FullName
          for ($i = 1; $i -le 5; $i++) {
            $t0 = Get-Date
            $p = Start-Process -FilePath $exe -PassThru
            $null = $p.WaitForExit(60000)
            if ($p.HasExited) {
              Write-Host ("launch {0}: EXITED code {1} (0x{1:X8}) after {2:N1} s" -f $i, $p.ExitCode, ((Get-Date) - $t0).TotalSeconds)
            } else {
              Write-Host "launch ${i}: alive after 60 s"
              Stop-Process -Id $p.Id -Force
            }
            Start-Sleep -Seconds 3
          }
          Write-Host '==== app logs ===='
          Get-ChildItem "$env:LOCALAPPDATA","$env:APPDATA" -Recurse -Depth 4 -Include 'nexus-diag.log*','nexus-crash.txt' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName -Tail 200 }
          Write-Host '==== Application Error / WER events ===='
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error','Windows Error Reporting' } |
            Select-Object -First 6 | ForEach-Object { Write-Host "---- $($_.ProviderName) $($_.Id)"; Write-Host $_.Message }

      - name: Under cdb, normal heap (the stack where the corruption is DETECTED)
        shell: pwsh
        continue-on-error: true
        run: |
          $dbg = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          $exe = (Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'Nexus.exe' | Select-Object -First 1).FullName
          $cmds = '.echo ==EVENT==; .lastevent; .echo ==ANALYZE==; !analyze -v; .echo ==ALLSTACKS==; ~*kn 80; .echo ==END==; q'
          $p = Start-Process -FilePath "$dbg\cdb.exe" -ArgumentList @('-g','-G','-logo',"$env:RUNNER_TEMP\cdb-normal.log",'-c',"`"$cmds`"","`"$exe`"") -PassThru -NoNewWindow
          if (-not $p.WaitForExit(240000)) { Write-Host 'cdb still running after 240 s (no crash under the debugger?)'; Stop-Process -Id $p.Id -Force; Get-Process Nexus -ErrorAction SilentlyContinue | Stop-Process -Force }
          Get-Content "$env:RUNNER_TEMP\cdb-normal.log" -ErrorAction SilentlyContinue

      - name: Under cdb, FULL PAGE HEAP (the stack of the bad write or bad free)
        shell: pwsh
        continue-on-error: true
        run: |
          $dbg = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          $exe = (Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'Nexus.exe' | Select-Object -First 1).FullName
          & "$dbg\gflags.exe" /p /enable Nexus.exe /full
          & "$dbg\gflags.exe" /p
          $cmds = '.echo ==EVENT==; .lastevent; .echo ==ANALYZE==; !analyze -v; .echo ==ALLSTACKS==; ~*kn 80; .echo ==END==; q'
          $p = Start-Process -FilePath "$dbg\cdb.exe" -ArgumentList @('-g','-G','-logo',"$env:RUNNER_TEMP\cdb-pageheap.log",'-c',"`"$cmds`"","`"$exe`"") -PassThru -NoNewWindow
          if (-not $p.WaitForExit(420000)) { Write-Host 'cdb still running after 420 s (no crash under page heap?)'; Stop-Process -Id $p.Id -Force; Get-Process Nexus -ErrorAction SilentlyContinue | Stop-Process -Force }
          Get-Content "$env:RUNNER_TEMP\cdb-pageheap.log" -ErrorAction SilentlyContinue
          & "$dbg\gflags.exe" /p /disable Nexus.exe

      - name: The app's logs after the debugger runs
        shell: pwsh
        if: always()
        run: |
          Get-ChildItem "$env:LOCALAPPDATA","$env:APPDATA" -Recurse -Depth 4 -Include 'nexus-diag.log*','nexus-crash.txt' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName -Tail 120 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-cdb-logs
          path: ${{ runner.temp }}/cdb-*.log
          if-no-files-found: ignore
