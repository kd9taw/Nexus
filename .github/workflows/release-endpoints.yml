# Release-endpoint drift — do the update feeds agree with the latest release?
#
# WHY THIS EXISTS (1.0.1, 2026-08-05). Nexus was released to GitHub and the
# operator's own "Check for updates" button kept answering "Nexus 1.0.0 is
# available". Nothing was broken in the build: the tag, the workflow, the
# artifacts and the Tauri updater manifest were all correct and all said 1.0.1.
# What was stale was the endpoint the IN-APP check actually reads --
# hamradiotools.io/nexus/version.json, which lives in a SEPARATE repo and is
# deployed by hand -- and its fallback, SourceForge's best_release.json, which
# only moves when the operator flips Default Download in the browser. Both halves
# of one checklist step, skipped together, so neither could rescue the other.
#
# The only guard at the time was a reminder PRINTED by scripts/release-prep:
#   "3. After CI publishes: SourceForge mirror + FRS, and update the site's
#      /nexus/version.json (separate repo) -- the update-check endpoint stays
#      stale until you do."
# That reminder is only seen by someone who runs the script. The 1.0.1 CHANGELOG
# was stamped by hand, release-prep never ran, the reminder never printed, and the
# step was missed. A guard that a shortcut walks straight past is not a guard.
#
# WHY IT IS NOT PART OF release.yml. The site deploy and the Default-Download flip
# are MANUAL steps that necessarily happen after CI publishes. A check inside the
# release job would fail every single release, teach everyone to ignore it, and be
# worse than nothing. So this runs on a schedule and gives the manual steps a grace
# window before it complains.
#
# WHAT IT DOES NOT DO: it cannot deploy anything or flip Default Download (no API
# exists for the latter -- a scripted POST returns 401). It tells you which feed
# disagrees and what to run. Fixing it stays a deliberate, operator-gated act.

name: Release endpoints

on:
  schedule:
    # 14:00 UTC daily. Late enough that an evening release has had a night's grace.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      grace_hours:
        description: 'Hours after publish before a stale feed is an error'
        required: false
        default: '12'

permissions:
  contents: read

jobs:
  drift:
    name: Update feeds match the latest release
    runs-on: ubuntu-latest
    steps:
      - name: Compare every update feed against the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GRACE_HOURS: ${{ github.event.inputs.grace_hours || '12' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          GRACE = float(os.environ.get("GRACE_HOURS") or 12)

          def get(url, tries=3):
              """Fetch with retries. A transient blip must not red the badge, but an
              update endpoint that is genuinely unreachable is itself a real fault --
              so exhausting the retries is reported, never silently tolerated."""
              last = None
              for _ in range(tries):
                  try:
                      req = urllib.request.Request(
                          url, headers={"User-Agent": "nexus-release-endpoints",
                                        "Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:          # noqa: BLE001 - report, don't classify
                      last = e
              raise RuntimeError(f"unreachable after {tries} tries: {url} ({last})")

          # --- the reference: what GitHub calls the latest release -----------------
          rel = json.loads(get("https://api.github.com/repos/kd9taw/Nexus/releases/latest"))
          tag = rel["tag_name"]                      # e.g. v1.0.1
          want = tag.lstrip("v")
          published = datetime.strptime(rel["published_at"], "%Y-%m-%dT%H:%M:%SZ") \
                              .replace(tzinfo=timezone.utc)
          age_h = (datetime.now(timezone.utc) - published).total_seconds() / 3600
          print(f"latest release: {tag}  (published {rel['published_at']}, {age_h:.1f} h ago)")
          print(f"grace window:   {GRACE} h\n")

          # --- every feed that can disagree ---------------------------------------
          problems, checked = [], []

          def check(name, got, fix):
              ok = (got == want)
              checked.append((name, got, ok))
              print(f"  {'OK  ' if ok else 'STALE'}  {name:34} {got}")
              if not ok:
                  problems.append((name, got, fix))

          # 1. The Tauri updater manifest. Generated by release.yml from the tag and
          #    hard-gated against tauri.conf.json, so it cannot drift on its own -- a
          #    mismatch here means the release itself is malformed, not a missed step.
          lj = json.loads(get(
              "https://github.com/kd9taw/Nexus/releases/latest/download/latest.json"))
          check("latest.json (self-update)", lj.get("version", "?"),
                "the release is malformed -- re-run release.yml for this tag")

          # 2. The in-app 'Check for updates' PRIMARY feed. Separate repo
          #    (~/work/hamtoolssite), deployed by hand. This is the one that was
          #    stale for 1.0.1.
          vj = json.loads(get("https://hamradiotools.io/nexus/version.json"))
          check("hamradiotools.io version.json", vj.get("latest", "?"),
                "bump public/nexus/version.json in the site repo, npm run build, then\n"
                "     npx wrangler pages deploy dist --project-name=hamradiotools "
                "--branch=main --commit-dirty=true\n"
                "     then VERIFY the live cache-busted URL -- wrangler exits 0 on a "
                "deploy that shipped nothing")

          # 3. The in-app FALLBACK feed, used when the site endpoint cannot be reached.
          #    Moves only when the operator flips Default Download in the SF web UI.
          #
          #    PARSED THE SAME WAY THE APP PARSES IT -- crates/tempo-app/src/update.rs
          #    parse_latest_version(): platform_releases.windows.filename first, then
          #    release.filename, and the version comes from the "Nexus_<ver>" token in
          #    the FILENAME, not from the directory. Two traps live here, both hit while
          #    writing this check: `release` is often literally null (SF fills it per the
          #    requesting client's platform, so a Linux runner sees null while a browser
          #    sees a value), and reading the version out of the /vX.Y.Z/ directory
          #    instead of the filename checks a string the app never looks at. A drift
          #    check that parses differently from the app is not checking the app.
          br = json.loads(get(
              "https://sourceforge.net/projects/nexus-ham-radio/best_release.json"))
          fn = ((br.get("platform_releases") or {}).get("windows") or {}).get("filename") \
               or (br.get("release") or {}).get("filename") or ""
          m = re.search(r"Nexus_(\d+\.\d+\.\d+)", fn)
          check("SourceForge best_release.json", m.group(1) if m else f"unparsed:{fn!r}",
                "upload the installers to /home/frs/project/nexus-ham-radio/" + tag + "/,\n"
                "     then set Default Download in the SF web UI (Files -> the .exe -> i ->\n"
                "     Default Download For: Windows -> Save). There is NO API for this.")

          if not problems:
              print(f"\nAll {len(checked)} feeds agree on {want}.")
              sys.exit(0)

          print(f"\n{len(problems)} feed(s) disagree with {tag}:\n")
          for name, got, fix in problems:
              print(f"  * {name}: serves {got}, release is {want}")
              print(f"     fix: {fix}\n")

          if age_h < GRACE:
              print(f"Within the {GRACE} h grace window ({age_h:.1f} h since publish) -- "
                    "the manual publish steps are probably still in progress. "
                    "Reporting, not failing.")
              sys.exit(0)

          print("An operator pressing 'Check for updates' is being told the wrong version.")
          sys.exit(1)
          PY
