# IOTA lists cache — keep main's copy of the last good IOTA lists, for release.yml to fall back on.
#
# The IOTA island-group and islands lists (© RSGB and IOTA Ltd) ship in the installer with IOTA
# Ltd's permission and are never committed (src-tauri/resources/iota/README.md, NOTICE). Each
# release job downloads them from iota-world.org, and that server answers HTTP 202 with no file
# while it rebuilds them: 1.22.0 and 1.25.0-beta.1 shipped an installer without them. So
# release.yml's jobs restore the last good lists from the Actions cache and fall back to them.
#
# WHY A WORKFLOW OF ITS OWN. A tag run reads only caches saved under its own tag or under main,
# and a tag is new on every release, so the copy has to be saved on main. Nothing else on main
# stages the lists: ci-main.yml runs ci.yml on main only when it has to, and ci.yml never
# downloads them. This runs on every push to main, which includes each release-prep commit before
# its tag, and weekly, so the entry is never evicted for want of use (GitHub evicts after 7 days
# untouched).
#
# Entries are saved under iota-lists-main-<sha256 of the two lists>, only from main (a dispatch on
# another branch refreshes nothing), and only when the content changed; the restore takes the
# newest. This is NOT a trust boundary: any workflow run on main can save a main-scoped entry
# under any key, and actions/cache extracts unconfined (`tar -P`). So release.yml restores these
# entries only in its iota-lists job, which builds nothing and holds no secret, and hands the
# installer jobs only the checked files (release.yml's iota-lists comment has the threat model).
# The path, the prefixes and the hash match that job's steps; change them together, or the
# release restores nothing from here.

name: IOTA lists cache

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh the cached IOTA lists
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Empty the IOTA cache directory
        run: rm -rf ~/.nexus-iota-cache

      - name: Restore the last good IOTA lists
        id: iota-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nexus-iota-cache
          key: iota-lists-main-${{ github.run_id }}
          restore-keys: iota-lists-main-

      # A download that fails falls back to the restored copy and passes; only with neither does
      # this fail, and then main holds no copy for the next release until a run here succeeds.
      - name: Download the IOTA lists
        id: stage
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/iota-lists"
          node scripts/gen-iota-groups.mjs --download "$out" --fallback ~/.nexus-iota-cache
          # The lists' content names the cache entry; release.yml's iota-lists job computes it the same way.
          echo "hash=$(cat "$out/iota_groups.json" "$out/iota_islands.json" | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
          rm -rf ~/.nexus-iota-cache
          mkdir -p ~/.nexus-iota-cache
          cp "$out/iota_groups.json" "$out/iota_islands.json" "$out/iota_groups.manifest.json" ~/.nexus-iota-cache/

      - name: Save the IOTA lists when they changed
        if: github.ref == 'refs/heads/main' && !endsWith(steps.iota-cache.outputs.cache-matched-key, format('-{0}', steps.stage.outputs.hash))
        uses: actions/cache/save@v6
        with:
          path: ~/.nexus-iota-cache
          key: iota-lists-main-${{ steps.stage.outputs.hash }}
