name: Repair PR 194

on:
  push:
    branches:
      - fix/clublog-batch-upload-193
    paths:
      - .github/workflows/repair-pr-194.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild PR on current upstream main
        shell: bash
        env:
          REPAIR_SCRIPT_B64: 
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/kd9taw/Nexus.git 2>/dev/null || true
          git fetch upstream main
          git fetch origin fix/clublog-batch-upload-193
          git checkout --detach upstream/main
          git cherry-pick -X ours 8c5dd33336a47fc9cfaddffdf6cdd17522906773
          printf '%s' "$REPAIR_SCRIPT_B64" | base64 -d > /tmp/repair-pr-194.py
          python3 /tmp/repair-pr-194.py
          cargo fmt --all
          cargo test -p tempo-core clublog --lib
          cargo check -p propagation --features live
          cargo check -p tempo-app
          git add crates/propagation/Cargo.toml crates/propagation/src/live/clublog.rs crates/tempo-core/src/clublog.rs src-tauri/src/lib.rs
          git commit --amend --no-edit --author='KR8MER <69276965+KR8MER@users.noreply.github.com>'
          git push --force origin HEAD:refs/heads/fix/clublog-batch-upload-193
