# Tempo CI — headless Rust workspace tests/clippy + the web UI build.
#
# Scope: Linux-hosted gates — the simulation-only Rust tests/clippy, the web UI
# build + Vitest, AND a Windows cross-COMPILE of the desktop app (compile/link
# only, to catch src-tauri breakage the Linux tests can't see). It does NOT bundle
# the NSIS installer or download the WebView2/Hamlib runtimes — that full packaging
# is produced out-of-band by scripts/build-windows.sh (native MSYS2 UCRT64),
# scripts/build-windows.ps1 (PowerShell wrapper), and scripts/build-windows-cross.sh
# (the same Linux/WSL2 cross toolchain, with --bundles nsis) — see WINDOWS.md.
# Published Windows binaries are cross-compiled beta and are not bundled here.
#
# Toolchain: the Rust jobs pin an exact stable (dtolnay/rust-toolchain with
# toolchain: 1.93.1) instead of floating @stable. A floating stable silently rolls
# rustfmt/clippy forward and reformats/re-lints the whole tree the day a new Rust
# ships — which is exactly what bit this repo. Bump the version below deliberately
# to adopt newer lints. The MSRV job intentionally stays pinned at 1.91.0
# (raised from 1.87 when the RUSTSEC-2026-0217 fix moved deepcw to tract 0.23,
# whose own rust-version is 1.91 — a security bump outranks MSRV stability).
# The action is pinned to a commit of its master branch, the one release.yml uses, and so is every
# other action here from outside GitHub's own: a branch or a tag is whatever that repository holds
# the day the job runs. scripts/release-secrets.test.mjs refuses an action that is not, and a
# download with no checksum, here as in release.yml.

name: CI

on:
  # A push to main starts this through ci-main.yml, which skips a commit that already passed here.
  pull_request:
    branches: [main]
  # Manual trigger — also the diagnostic lever for "why has CI never run".
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every Linux job runs on ubuntu-24.04, not ubuntu-latest. ubuntu-latest became 26.04 on 2026-10-19,
# and its gfortran 15 / libm moved the vendored WSJT-X synthesis by a few parts in a million, so the
# FT8/FST4 waveform pins (recorded on 24.04) failed with no code change; localhost resolution and the
# WebKitGTK WebDriver package also changed there. Move to 26.04 as one deliberate step: re-record the
# pins there, prove the change is the toolchain's alone, and get a green run.
jobs:
  # Job 1 — Rust workspace: build the Fortran/C/C++ libtempo modem (via the
  # tempo-fast-sys build.rs CMake project) and run the headless modem/engine/net/TempoDeep
  # round-trip tests, then clippy across the whole workspace.
  # The Rust gates were ONE job until 2026-09-20, and it was the whole workflow's
  # critical path: 57 minutes, of which `cargo test --workspace` was 32 and
  # `cargo test tempo-audio --features device,serial` was 10, run in series behind
  # one setup. The three jobs below run the SAME commands, unchanged, in parallel.
  # Measured 57 min -> ~37, and ~37 is then the floor for this family because the
  # workspace run alone is 32.
  #
  # Clippy was NOT the bottleneck and was deliberately not split out: all three
  # clippy steps together were 1.1 of the 57 minutes. Split on the slow TESTS.
  #
  # Nothing was removed. The proof is mechanical, not a claim: `scripts/gates --list`
  # yields an identical command set before and after this split. Re-run that diff if
  # you move a step between these jobs.

  test:
    name: Rust tests + clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # libtempo build deps. The native (host == target) CMake path locates the
      # FFTW3 single-precision library via pkg-config (`pkg_check_modules(FFTW3F
      # REQUIRED fftw3f)`) and Boost via `find_package(Boost REQUIRED)`:
      #   - gfortran        : the 4-CPM turbo modem is Fortran (gfortran runtime).
      #   - libfftw3-dev     : ships fftw3f.pc + libfftw3f + fftw3.f03 (FFTW3
      #                        SINGLE precision — used by four2a.f90 / fftw3 module).
      #   - libboost-dev     : ships <boost/crc.hpp> for the header-only CRC-14 in
      #                        crc14.cpp (find_package(Boost) config).
      #   - cmake, ninja-build : drive the libtempo CMake project.
      #   - pkg-config       : required by find_package(PkgConfig REQUIRED).
      - name: Install libtempo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libfftw3-dev \
            libboost-dev \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libhamlib-utils

      # libhamlib-utils above ships `rigctld`: the tempo-audio integration
      # suite (tests/rigctld_dummy.rs) drives the REAL CAT client against a
      # real Hamlib dummy rig (-m 1). Without rigctld those tests self-skip,
      # so dropping the package silently removes the coverage — keep it.


      - name: Set up Rust 1.93.1 toolchain (pinned — see header)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt


      # THE CARGO CACHES: restored by every run, SAVED ONLY ON MAIN. Measured 2026-10-30 on the
      # land/* runs, which reach this file by workflow_dispatch on their own branch:
      #  - A run can restore only its own branch's caches or main's. Since ci-main.yml stopped
      #    re-running this workflow on main for a commit that already passed, main held no cache at
      #    all, and every land/* branch runs once: each run started cold and saved ~6 GB that no
      #    other branch can ever read. That pushed the repository past GitHub's 10 GB cap, and the
      #    eviction took main's caches first, because the branch saves were newer than main's last
      #    read. Saving on main only keeps main's set alive; every branch reads it.
      #  - The three Rust jobs shared ONE key, so the first to finish saved its build and the other
      #    two failed with "Unable to reserve cache"; the winner's build was then restored into jobs
      #    that compile different things. Each job has its own key now.
      #  - Incremental state is left out. It is the largest part of target/ and cargo throws it away
      #    for any crate whose source changed, which is every crate a run is testing; leaving it out
      #    keeps main's set under the cap. The registry's unpacked sources are left out for the same
      #    reason: cargo unpacks them again from registry/cache in seconds.
      # A cache is speed only. A miss rebuilds from source and tests exactly the same thing.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-


      - name: cargo fmt --check
        run: cargo fmt --all --check

      # `cargo fmt --all` stops at the workspace boundary and src-tauri declares its
      # OWN `[workspace]` table, so the step above has never reached it and no other
      # job formats it either. Measured 2026-09-07, independently by two branches
      # that both found the same number: the root step exited 0 while
      # src-tauri/src/lib.rs carried 21 drifted regions no check could report. That
      # also made `cargo fmt` unsafe to run in that directory, because it swept ~20
      # unrelated reformats into whatever commit happened to be open. The sweep
      # landed as its own commit so it could not contaminate a real diff.
      #
      # `--all` rather than the bare form: src-tauri is a single-package workspace
      # today, so the two are equivalent — but if a member is ever added, the bare
      # form silently stops covering it. Cheap and fast, so it sits beside the root
      # fmt step: a formatting failure should not wait for a build.
      - name: cargo fmt --check src-tauri
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      # `--no-fail-fast` on every multi-binary `cargo test`: without it cargo stops
      # at the first test BINARY that fails, so a red run names the failures in
      # one crate and says nothing about the others — the next push finds those.
      # A red run must leave every failing test's name behind, once (scripts/gates
      # reads them out of the log; CI's log is what a human reads).
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

      # The fd-rules publish gate, run here on the file it exists to guard.
      # `.github/workflows/fd-rules.yml` runs this exact command before pushing
      # the seed to the rolling `fd-rules` Release that every install downloads,
      # so a seed edit that the app would refuse goes red at MERGE time rather
      # than at publish time.
      #
      # The gate is `crates/tempo-core/src/bin/fd-rules-check.rs`: a thin shell
      # around `fd_rules::validate` — i.e. `parse_spec`, the very function the
      # shipped app enforces. It replaced a SECOND validator written in node
      # (`scripts/check-fd-rules.mjs` + `scripts/rust-serde-schema.mjs`) that was
      # kept in step with the loader by a parity corpus. Four rounds of parity
      # fixes each closed some divergence classes and revealed others, because
      # agreeing with the loader byte-for-byte means reimplementing serde's
      # derive behaviour and serde_json's lexer — presence rules, integer widths,
      # surrogate pairing, the recursion limit, `IgnoredAny` scanning for unknown
      # fields, and the exact error text. The last round reddened the gate on the
      # seed's own `_provenance` prose, a file every shipped app accepts. There is
      # one implementation now, so parity is true by construction.
      #
      # The corpus stayed and is walked THROUGH THIS BINARY by
      # `cargo test -p tempo-core --test fd_rules_corpus` (in the run above):
      # every refuse fixture must exit 1 with its recorded reason, every accept
      # fixture must exit 0.
      #
      # `!cancelled()` on this step and clippy: they run after a red test step,
      # so one push reports a bad seed or a lint along with the failing tests
      # instead of leaving them for the next push (21 Oct: both were skipped).
      - name: fd-rules publish gate on the in-repo seed
        if: ${{ !cancelled() }}
        run: cargo run --quiet -p tempo-core --bin fd-rules-check -- crates/tempo-core/src/fd_rules.seed.json

      - name: cargo clippy (deny warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Main only, and after a red step too: the build is as good as a green run's. The key is the
      # restore step's; the paths must be its paths exactly, or the save lands where nothing reads.
      - name: Save the cargo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The feature-gated crates, which a plain `--workspace` run does not build:
  # tempo-audio's service.rs is `#[cfg(feature = "device")]` and propagation's
  # fetchers are behind `live`, so the default pass silently skips both. The
  # 10-minute step is `cargo test tempo-audio` — its tail is one rigctl-per-model
  # test, not a hang.

  test-features:
    name: Rust feature-gated crates (tempo-audio, propagation)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The SAME system-dependency list as the `test` job — see there for why each
      # package is present. The three Rust jobs must keep identical lists: they build
      # the same libtempo, so a package added to only one of them goes red in the
      # other two on a build unrelated to the change that added it.
      # (A composite action would state this once, but `scripts/gates` reports a local
      # `uses: ./…` as UNKNOWN, which costs every local gate run its full-coverage
      # claim — a worse trade than duplication. Teaching the tool to resolve local
      # composite actions would fix that, and is the right follow-up.)
      - name: Install libtempo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libfftw3-dev \
            libboost-dev \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libhamlib-utils

      # libhamlib-utils above ships `rigctld`: the tempo-audio integration
      # suite (tests/rigctld_dummy.rs) drives the REAL CAT client against a
      # real Hamlib dummy rig (-m 1). Without rigctld those tests self-skip,
      # so dropping the package silently removes the coverage — keep it.


      - name: Set up Rust 1.93.1 toolchain (pinned — see header)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
          # For the Android check at the end of this job.
          targets: aarch64-linux-android


      # Its own key, restored everywhere and saved on main only: see the `test` job's cache.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-


      # The real-radio path (cpal audio + serial PTT) is feature-gated out of the
      # default build. Lint AND run its tests here — the Transport reconfig
      # decisions, the WSJT-X/PSK emit builders, and the rigctld round-trip — so
      # service.rs/device.rs can't silently rot or regress on the air.
      - name: cargo clippy tempo-audio --features device,serial
        run: cargo clippy -p tempo-audio --features device,serial --all-targets -- -D warnings

      - name: cargo test tempo-audio --features device,serial
        run: cargo test -p tempo-audio --features device,serial --no-fail-fast

      # `--workspace` uses DEFAULT features, so the propagation `live` tests —
      # including the seven that assert QRZ/ClubLog/LoTW credentials are never
      # sent over plain HTTP or echoed into an error — compiled in NO job and
      # never ran (measured: 326 vs 364 tests). The MSRV job's `cargo check`
      # doesn't even type-check test code (`--all-targets` is what would).
      - name: cargo clippy propagation --features live
        run: cargo clippy -p propagation --features live --all-targets -- -D warnings

      - name: cargo test propagation --features live
        run: cargo test -p propagation --features live --no-fail-fast

      # The client core's feature-gated shapes, which no other step lints: src-tauri builds the
      # crate as a path dependency, so its clippy steps read none of it, and `--workspace` takes its
      # default features alone. Here as the app builds it (this computer's sound devices, beside
      # tempo-audio's serial as the app has it) and in a test build's shape (the road switch), its
      # code and its tests both.
      - name: cargo clippy tempo-client --features device,bench-road-switch
        run: cargo clippy -p tempo-client --features device,bench-road-switch,tempo-audio/serial --all-targets -- -D warnings

      # ...and its tests in that shape, which the lint above only compiles: the road switch's own
      # tests exist only with the feature, so no other step runs them. The crate's other tests run
      # here again too, which costs seconds and needs no list of names that could fall behind.
      - name: cargo test tempo-client --features device,bench-road-switch
        run: cargo test -p tempo-client --features device,bench-road-switch,tempo-audio/serial --no-fail-fast

      # The DeepCW inference bridge: compiled by no other Linux job (the model
      # file is gitignored, so only compile coverage is possible here — see the
      # documented silent-lobotomy trap in the release runbook).
      - name: cargo check tempo-audio --features device,serial,ai-cw
        run: cargo check -p tempo-audio --features device,serial,ai-cw --all-targets

      # The client core on a phone: it builds for Android with no engine, no Tauri and nothing
      # Windows-only, so a phone app can be built on it. Last in the job, so a red here never hides
      # one of the steps above. A check still runs the build scripts, so ring's C and libopus
      # (CMake) are compiled for the phone, both from the runner's own NDK: ring by its clang
      # (API 24, Android 7.0; the phone app sets its own minimum when it is built), libopus through
      # the NDK's CMake toolchain file, which opusic-sys takes from ANDROID_NDK_HOME.
      - name: cargo check tempo-client for Android (aarch64)
        run: |
          : "${ANDROID_NDK_HOME:?no Android NDK on this runner}"
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ANDROID_PLATFORM=android-24 CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang" \
            AR_aarch64_linux_android="$bin/llvm-ar" cargo check -p tempo-client --target aarch64-linux-android

      - name: Save the cargo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # src-tauri and the native Remote controller. src-tauri declares its OWN
  # `[workspace]`, so `cargo test --workspace` and `cargo fmt --all` never reach it.
  # That boundary is exactly why these are separate commands, and why moving them to
  # their own job changes nothing about what is covered.

  test-tauri:
    name: Rust src-tauri + native Remote
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The SAME system-dependency list as the `test` job — see there for why each
      # package is present. The three Rust jobs must keep identical lists: they build
      # the same libtempo, so a package added to only one of them goes red in the
      # other two on a build unrelated to the change that added it.
      # (A composite action would state this once, but `scripts/gates` reports a local
      # `uses: ./…` as UNKNOWN, which costs every local gate run its full-coverage
      # claim — a worse trade than duplication. Teaching the tool to resolve local
      # composite actions would fix that, and is the right follow-up.)
      - name: Install libtempo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libfftw3-dev \
            libboost-dev \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libhamlib-utils

      # libhamlib-utils above ships `rigctld`: the tempo-audio integration
      # suite (tests/rigctld_dummy.rs) drives the REAL CAT client against a
      # real Hamlib dummy rig (-m 1). Without rigctld those tests self-skip,
      # so dropping the package silently removes the coverage — keep it.


      - name: Set up Rust 1.93.1 toolchain (pinned — see header)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt


      # Its own key, restored everywhere and saved on main only: see the `test` job's cache. Every
      # cargo command in this job, the native Remote probe's included, builds into src-tauri/target
      # (src-tauri is its own workspace), which the shared cache this replaced never held: the
      # job rebuilt src-tauri from nothing on every run, hit or miss.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/debug/incremental
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-


      # src-tauri is its OWN workspace root (empty `[workspace]` table in its
      # Cargo.toml), so `--workspace` above does NOT reach it — verified by
      # planting a type error in src-tauri and watching both `cargo test
      # --workspace` and `cargo clippy --workspace -D warnings` exit CLEAN.
      # Nothing else in CI type-checks it either: the Windows job only runs
      # `cargo build --release`, which never compiles `#[cfg(test)] mod tests`.
      #
      # That left the ENTIRE Tauri command layer — every window label, the
      # geometry store, and the multi-radio chain addressing whose whole job is
      # to make a wrong-rig bug unrepresentable — with no automated gate at all.
      # `--features radio` is required; src-tauri does not compile without it.
      #
      # This step ALSO needs the Tauri Linux system libraries (webkit2gtk, gtk-3,
      # soup-3, appindicator, rsvg, xdo) in the install step above — they are what
      # `glib-sys` and friends pkg-config for. They were missing when the gate was
      # added, so it failed on `glib-2.0 was not found` on every run and this
      # supposedly-closed hole was still wide open (caught 2026-07-25, after the
      # 0.17.11 run finally got past a red fmt step and reached it).
      - name: cargo test src-tauri --features radio
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features radio

      # `-D warnings`, matching every workspace clippy step: this crate carried ~38
      # pre-existing lints (MSRV, needless borrows, type complexity, redundant
      # casts) precisely because this step ran with no `-D warnings`, so nothing
      # ever failed on them — invisible debt, not a clean bill. Burned down in the
      # commit that added this flag; do not let it silently regrow. `chains.rs`'s
      # own `#![deny(warnings, clippy::all)]` is now redundant with this step but
      # left in place as a second, file-scoped backstop.
      #
      # `--all-targets`, and the scope is the point. This step read `--lib` until
      # 2026-09-15 — copied down from the `cargo test` step above, where `--lib`
      # is right because it names which tests RUN. On clippy it names what gets
      # COMPILED, and `--lib` builds the library WITHOUT `cfg(test)`: every
      # `#[cfg(test)] mod tests` in the crate — which is where nearly all of
      # src-tauri's test code lives — was not leniently linted, it was never
      # looked at. Nine findings were sitting in it when `--all-targets` was
      # first tried. Test code is where the Remote fixtures and the grant/
      # transmit assertions live; a lint that rots there rots unwatched. Every
      # other clippy step in this file already says `--all-targets`; this one
      # is not an exception, it was a transcription slip that stood from
      # b5033af6 (2026-07-22), the commit that added the gate, to 2026-09-15.
      - name: cargo clippy src-tauri --features radio
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features radio -- -D warnings

      # The same lint over a TEST build's shape. `bench-road-switch` is the
      # switch a test build of the remote client carries, to block one of its
      # roads to the shack while a bench measures what the other does. It is
      # off by default and no release can turn it on: the `cargo test` step
      # above runs the guard that fails if one could. So neither step above
      # compiles the switch, and between test builds its code and its tests
      # could break with nothing noticing. This step compiles both, under the
      # same toolchain, cache and `-D warnings`. It builds nothing that ships.
      - name: cargo clippy src-tauri --features radio,bench-road-switch
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features radio,bench-road-switch -- -D warnings

      # The tests that exist only in that shape, which the lint above compiles and nothing ran
      # until 2026-10-23: two of them had gone red unseen, when a feed added later was taken for
      # a press. Each Stop road alone stopping every kind of over with the other road blocked, a
      # start refused while either road is blocked, a road opened under a blocked link reaching
      # nothing, and the switch's own command. Filtered by name, not the whole suite again: the
      # filters are every test the feature adds (`cargo test ... -- --list` with and without it
      # differ by exactly these five, and by the no-switch guard the step above runs).
      - name: cargo test src-tauri --features radio,bench-road-switch (the road switch's tests)
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --lib --features radio,bench-road-switch -- road_switch stop_road::bench:: a_road_opened_while_the_link_is_blocked'

      - name: Set up Node.js for the native Remote integration
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The Rust probe runs the real controller, Publisher and outbound socket.
      # Only its OS vault and hardware readings are substituted in test code.
      # workerd verifies ephemeral JWTs and executes the actual D1 migrations.
      - name: Build the local Remote integration runtime
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm --prefix ui ci
          npm --prefix remote ci
          npm --prefix ui run build:remote
          npm --prefix remote run build

      - name: Native Remote controller through the Cloudflare runtime
        run: npm --prefix remote run test:native

      - name: Save the cargo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The hosted page is the stream page. The old watch/control workspace and the observer view take no
  # new features; new Remote work goes to the stream, the LAN stream window or the native client.
  remote-web:
    name: Remote browser and Cloudflare service (local only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Remote dependencies
        run: |
          npm --prefix ui ci
          npm --prefix remote ci
      - name: Build the hosted browser
        run: npm --prefix ui run build:remote
      - name: Check and bundle the Cloudflare service without deployment
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm --prefix remote run types
          npm --prefix remote run check
          npm --prefix remote run build
      - name: Service authorization, real sockets and hibernation
        run: npm --prefix remote test
      - name: Remote staging scope, artifact integrity and deployment checks
        run: npm --prefix remote run test:staging
      - name: Remote dependency advisories
        run: npm --prefix remote audit --audit-level=moderate

  # The compiled-browser sweep, split out of `remote-web` and SHARDED on 2026-09-20.
  #
  # It is the stream page's two scenarios, at a desktop's size and at a phone's, each doing
  # PKCE, local device approval and the stream end to end in real Chrome; node:test runs
  # tests within a file in series, so each shard runs one. The old workspace's 28 scenarios
  # went with the workspace.
  #
  # The shards PARTITION the scenarios, and a shard that selects none refuses to run.
  #
  # The count is stated LITERALLY below and must equal the matrix length. `strategy.job-total`
  # would derive it and was tried first, but `scripts/gates` cannot expand a runtime context,
  # so it marked the step BLOCKED and the sweep stopped running locally altogether. A literal
  # keeps it runnable here: gates expands `matrix.shard`, lists every shard, and together
  # they still run every scenario on this box.
  #
  # Stating it twice is a desync risk, so it is GUARDED, not trusted:
  # `scripts/gates.test.mjs` asserts the matrix length equals the NEXUS_BROWSER_SHARDS this
  # job passes, and that test is itself a gate in this workflow. Change one, the test names
  # the other.
  #
  # Unset env means shard 0 of 1, i.e. everything, so a local run and `scripts/gates`
  # keep full coverage; the test file refuses loudly rather than selecting nothing.
  #
  # `fail-fast: false` for the same reason `--no-fail-fast` is on every cargo test here:
  # a red run must name every failing scenario once, not stop at the first shard and
  # leave the others to be discovered on the next push.
  #
  # NOT path-filtered, deliberately. It is not the critical path, and the repository is
  # public so Actions minutes are free. A filter would buy no wall-clock time and no money,
  # and would add a way for the sweep to be silently skipped.
  remote-browser:
    name: Compiled browser (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Remote dependencies
        run: |
          npm --prefix ui ci
          npm --prefix remote ci
      - name: Build the hosted browser
        run: npm --prefix ui run build:remote
      # The sweep runs against the BUILT Worker, not its source: runtime.mjs:39 loads
      # `../dist/index.js` into workerd. Splitting this job out of `remote-web` left that
      # build behind and all three shards failed on the first run — the same trap the
      # Remote notes already record for `npm --prefix remote test`. `types` and `check`
      # stay in `remote-web`; they are validation, and only the bundle is needed here.
      - name: Bundle the Cloudflare service (the sweep loads dist/, not src/)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm --prefix remote run build
      # The suite carries 53 `if(artifacts)` capture sites behind
      # NEXUS_REMOTE_BROWSER_ARTIFACTS, and nothing in this repo ever set it — so every
      # screenshot it knows how to take was dead code HERE, in the one place the failures
      # actually happen. A `remote-nexus-tempo-failure.png` was written for exactly the v10
      # red on 2026-09-22 and went nowhere, which is why attributing that red took an
      # afternoon of re-runs. A guard that cannot deliver its evidence is not instrumentation.
      - name: Compiled browser sign-in, approval, observation and responsive layouts
        env:
          NEXUS_BROWSER_SHARD: ${{ matrix.shard }}
          NEXUS_BROWSER_SHARDS: "2"   # must equal the matrix length above — guarded by scripts/gates.test.mjs
          NEXUS_REMOTE_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          google-chrome --version
          npm --prefix remote run test:browser
      # Only on failure: a green run writes the passing captures too and they are not worth
      # storing. `if-no-files-found: ignore` because a job that dies before the first capture
      # must report ITS failure, not a second one about a missing upload.
      - name: The failing scenario's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shard-${{ matrix.shard }}-failure
          path: remote/browser-artifacts/
          if-no-files-found: ignore


  # Job 2 — Web UI (Vite + React + TypeScript). `npm run build` is `tsc -b &&
  # vite build`, so this also type-checks the DTO contract that mirrors
  # crates/tempo-app/src/dto.rs.
  ui:
    name: Web UI build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build UI
        run: npm --prefix ui run build

      - name: Test UI (Vitest)
        run: npm --prefix ui test

      # The translator kits pin the rows they shipped. A change that removes or rewords a catalog
      # string without re-pinning the kit leaves a volunteer's verifier failing on a file they never
      # touched. With no rows translated in the committed CSVs, a red here can only mean the pins and
      # the file disagree. make-kit.py --check is deliberately NOT run (see translations/it/README.md).
      - name: Translator kits match their pins
        run: |
          python3 translations/pt-BR/verify-ptbr.py translations/pt-BR/nexus-ptbr-translation.csv
          python3 translations/it/verify-it.py translations/it/nexus-it-translation.csv

      # `ui/`'s build output IS the hosted browser application, and nothing audited it - while
      # remote/ has had this gate all along and Rust is covered by cargo-deny on both lockfiles.
      #
      # BLOCKING on what actually ships. The dev tree currently carries 9 advisories (vitest, vite,
      # esbuild, postcss, nanoid, browserslist, undici) and clearing them means major bumps of vite
      # and vitest; production dependencies are clean today. A gate that is red the day it lands is
      # a gate somebody deletes, so the enforced one is the honest boundary - a vulnerability in a
      # package that reaches an operator's browser fails the build.
      #
      # No informational full-tree step sits beside it on purpose. scripts/gates deliberately
      # ignores `continue-on-error` (it can only hide a failure, never invent one), so such a step
      # would make the LOCAL gate permanently red over something CI tolerates; and writing
      # `|| true` to dodge that is the piped-green-hides-the-exit-code bug this project has already
      # shipped once. The dev-tree count belongs in a deliberate decision about bumping vite and
      # vitest, not in a step nobody can act on.
      - name: UI dependency advisories (shipped dependencies)
        run: npm --prefix ui audit --omit=dev --audit-level=moderate

      # Guardrail: no demo/mock/fabricated data may reach an operator. Greps the
      # Rust + TS sources AND the just-built UI bundle for the deleted demo/mock
      # fingerprints (propagation::demo, mockEngine, demoPropagation, …). Runs
      # after the build so it also proves the mock tree-shook out of dist/.
      - name: No demo/mock data guard
        run: bash scripts/check-no-demo.sh

      # The installers carry the license texts of the npm packages in the desktop bundle as
      # resources/ui/THIRD-PARTY.txt, copied from licenses/ui/THIRD-PARTY.txt. The build above
      # derives the same file from the modules its chunks contain (ui/vite.config.ts, with the
      # hosted browser's generator in ui/remote-licenses.ts) and stops when a shipped package has
      # no license text. This fails when the committed copy is behind it, so a dependency bump, or
      # an import that pulls one more package into the bundle, cannot reach an installer with the
      # old notices. To refresh: build the UI, `cp ui/dist/THIRD-PARTY.txt licenses/ui/`, and name
      # any new package in NOTICE.
      - name: The installers' UI license texts match the bundle
        run: diff -u licenses/ui/THIRD-PARTY.txt ui/dist/THIRD-PARTY.txt

      # The TLE-mirror generator runs unattended in its own workflow and
      # publishes to every install, so its derivation and its sanity gates are
      # tested HERE, on committed fixtures, where a regression blocks a merge
      # rather than shipping a shortened bird list six hours later.
      - name: Test the TLE mirror generator
        run: node --test scripts/gen-tles.test.mjs

      # Same argument for the street map's host: street-maps.yml copies and deletes unattended,
      # and the index it publishes is what every street-map download reads. Its rules are tested
      # here too, and here, after `npm ci`, the test can also hold the icons the hosting job
      # generates to the style the UI actually ships. Its copy of the build runs the rclone that
      # workflow pins (the test holds the pins equal), fetched in this step itself because
      # scripts/gates runs a step with no GITHUB_PATH, and unpacked by python3 because not every
      # box has unzip.
      - name: Test the street-map hosting job
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/rclone.zip" https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          python3 -m zipfile -e "$RUNNER_TEMP/rclone.zip" "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/rclone-v1.75.1-linux-amd64/rclone"
          PATH="$RUNNER_TEMP/rclone-v1.75.1-linux-amd64:$PATH" node --test scripts/street-maps.test.mjs

      # (The fd-rules publish gate used to have a node half here, walking a
      # corpus against a second validator written in JS. There is one validator
      # now — the loader itself — so the gate and its corpus both live in the
      # `test` job above; see the comment there.)

      # scripts/gates derives the local gate list from THIS FILE, and its whole
      # value rests on one property: a step added here appears there with no edit
      # to the script. scripts/gates.test.mjs is what holds that property down —
      # it plants a step in a scratch copy of this workflow and fails if --list
      # misses it — and until now it ran in no workflow at all. Same argument as
      # the doc generators above, which is not a coincidence: a tool whose only
      # trigger is somebody remembering is not a gate.
      #
      # The recursion is the point. This step is in ci.yml, so scripts/gates
      # derives it and runs it, and the tool ends up gating its own correctness.
      - name: scripts/gates still derives the gate list from this workflow
        run: node --test scripts/gates.test.mjs

      # release.yml keeps every secret out of the jobs that build or run third-party code
      # (FFTW, Hamlib, npm, crates.io, the AppImage tooling), signs the Windows and Linux
      # installers in a job that builds nothing, and pins everything it downloads to build with, as
      # this file and scripts/Dockerfile.pi pin theirs.
      # A release exercises that once, in public, so it is read here on every commit instead, by a
      # test that plants its own violations to prove it can still see one. Same argument as the
      # suites around it: a tool whose only trigger is somebody remembering is not a gate.
      - name: release.yml keeps its secrets out of the third-party builds, and the release and CI pin their downloads
        run: node --test scripts/release-secrets.test.mjs

      # The check every macOS build runs on what it ships (scripts/check-macho-bundle.mjs) only ever
      # runs for real on a Mac, and only says anything when a build goes wrong. Its own tests run
      # here, on Linux, against Mach-O files they write byte by byte: the paths and the minimum it
      # must refuse, and the clean bundle it must pass.
      - name: The macOS bundle check refuses build-machine paths and a too-new minimum macOS
        run: node --test scripts/check-macho-bundle.test.mjs

      # The xcrun the macOS release bundler runs (scripts/xcrun-staple-retry.sh): stapling the
      # notarization ticket is retried a bounded number of times and logged, every other call
      # passes through. It only runs for real inside a release; its tests use a fake xcrun.
      - name: The macOS release retries stapling the notarization ticket, and gives up loudly
        run: node --test scripts/xcrun-staple-retry.test.mjs

      # Exactly the same argument, one file over. `.githooks/pre-push` is the one gate in this
      # project that is mechanism rather than prose — wrong-remote, release-tag, identity, the
      # per-commit content scrub and the licence/NOTICE guard — and `.githooks/pre-push.test.sh`
      # is its regression suite, whose own header calls it "the one that has to be provable".
      # It ran in no workflow either. A suite that only runs when somebody remembers cannot
      # catch the change that stops remembering, and the hook is the last thing between a
      # private identity and public history.
      #
      # Cheap and hermetic, which is why there is no excuse: ~2.5 s, no network (verified under
      # a network-less namespace), no `gh`. It builds a throwaway bare remote under $TMPDIR,
      # stubs the CI-evidence predicate, and uses STAND-IN leak patterns, never the real
      # private ones — so it is safe in a public repo and needs no secret to run here.
      - name: The pre-push hook still refuses what it must
        run: ./.githooks/pre-push.test.sh

      # scripts/require-green-ci is the predicate that decides whether a release may
      # publish — release.yml's ci-evidence job, publish.yml's resolve job and the
      # pre-push release-tag gate all call THIS ONE FILE. It is therefore the piece of
      # this repo that is hardest to test at the moment it matters: a real release
      # exercises it once, in public, with a tag already pushed.
      #
      # So it is exercised here instead, on every commit, in BOTH directions — the
      # refusals (cancelled, timed_out, in_progress, a green run on the wrong commit, a
      # pull_request run, no run at all) and the passes, plus the override. The suite
      # carries its own positive control: a stubbed script that always exits 0 makes 28
      # of its cases go red, so a suite that comes back green is a suite that can fail.
      #
      # Same argument as gates.test.mjs above and the doc generators below, which is not
      # a coincidence: a tool whose only trigger is somebody remembering is not a gate.
      # This one is worse than that, because the thing it guards is the publish.
      - name: The release green-CI gate still refuses and still passes
        run: bash scripts/require-green-ci.test.sh

      # scripts/release-prep refuses a release with no prose notes, and that refusal must change
      # nothing. It used to come after the version bump, so the re-run refused as "not greater
      # than current" and the TLE seed and the alignment check never ran: 1.17.0's seed was re-cut
      # by hand. Hermetic (a throwaway repo per case, no network, ~1 s), both directions.
      - name: release-prep refuses before it changes anything, and its re-run goes through
        run: bash scripts/release-prep.test.sh

      # The repository is public and its working notes are not. A comment, test name or doc that
      # cites one of them (a ruling, task, agent or batch number, a private document's section, a
      # file under tasks/) leaks the shape of the private tree and tells a reader nothing. A
      # push-time scrub sees only what a push adds; this reads the whole tree on every commit.
      # Hermetic (~3 s, no network); it runs its own planted controls first and fails closed, and
      # its header lists the false positives it allows and why.
      - name: The tree cites no private notes, rulings or task ids
        run: bash scripts/check-internal-refs.sh

      # The two doc generators, in --check mode: they write nothing, they exit 1
      # when the committed page is behind the source it is derived from.
      #
      # WHY THEY ARE HERE. Both existed for weeks with nothing invoking them, and
      # that is exactly how they failed. gen-wiki.mjs THREW on every run from
      # a6097c92 (2026-08-09) onward — docs/install.md stopped containing the text
      # one of its required replacements is keyed on — and three releases shipped
      # over the top of a generator that could not run, because nobody ran it. A
      # tool whose only trigger is somebody remembering is not a gate.
      #
      # Both are deterministic and offline. When one goes red the fix is to re-run
      # it without --check and commit what moved, or to repair the rule it names.
      - name: docs/guide/settings-reference.md is generated from the registry
        run: node scripts/gen-settings-reference.mjs --check

      - name: docs/launch/wiki/ is generated from docs/
        run: node scripts/gen-wiki.mjs --check

      # docs/shipped.json is read by the WEBSITE, in another repo, to check that its
      # features page still lists everything Nexus ships. A stale manifest there is a
      # website that quietly under-claims — which is how PSK31 went four releases and
      # FT2 two without appearing on the page whose job is listing them.
      - name: docs/shipped.json is generated from the app's own lists
        run: node scripts/gen-shipped.mjs --check

      # The per-commit half of scripts/release-docs.mjs: every published screenshot is mapped to
      # the source it depicts, every image a page points at exists and carries alt text, every
      # image in docs/img/manual/ is actually placed on a page, and every local link and heading
      # anchor across docs/ resolves.
      #
      # WHY --push-gate AND NOT THE WHOLE SCRIPT. The rest of release-docs asks release questions
      # — is there a RELEASE_NOTES for this version, is the CHANGELOG stamped, are its issue
      # credits closed on GitHub, is the live site in sync — all legitimately unfinished on a
      # topic branch, and two of them need the network. Those stay at release time. What is here
      # is true of every commit and needs nothing but the checkout.
      #
      # WHY IT IS HERE AT ALL. release-docs.mjs ran in no workflow, so its checks fired only when
      # somebody remembered to run it — which is the exact argument that file was written to make
      # about gen-wiki.mjs, and it had come to apply to the file itself.
      - name: The manual's images and cross-references resolve
        run: node scripts/release-docs.mjs --push-gate

  # The scope and waterfall in a real browser (ui/spectrum-harness/, see its README).
  #
  # jsdom never lays out and has no graphics context, so every gate in `ui` above stays green
  # through a broken waterfall paint path, and the compiled-browser sweep drives the hosted Remote
  # page, not the desktop scope. This mounts the SHIPPED PhoneScope and Waterfall in headless Chrome
  # with the desktop IPC bridge stood in by synthetic frames and the real clock, and checks their
  # pictures against stored PNGs under a tolerance and their row cadence against the sweeps a source
  # published; frame pacing, main-thread time and the IPC parse cost are measured and printed, never
  # asserted, because this runner is nobody's shack PC.
  #
  # Two controls run every time — a wrong palette must fail the picture comparison, a planted extra
  # row must be found — so a green run is one whose instruments could have gone red. A check marked
  # as a KNOWN FAILURE (the scope's repeated rows today) keeps this job green while it fails and turns
  # it red the day it passes, so the marker leaves in the same change as the defect.
  #
  # No GPU. The harness pins Chrome to software rasterisation and SwiftShader WebGL and asserts it,
  # and the stored pictures are keyed on that backend; they came out byte-identical under Chrome 140,
  # 147 and 151. Measured at 187 s through `scripts/gates --job spectrum-harness`, the UI install
  # included; most of it is real time the probes wait out, so a slower runner adds little.
  spectrum-harness:
    name: Scope and waterfall in a real browser
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Pictures, row cadence, frame pacing and IPC cost of the shipped scope and waterfall
        run: |
          google-chrome --version
          node ui/spectrum-harness/run.mjs --out "$RUNNER_TEMP/spectrum-harness"
      # Only on failure, as the browser sweep's: the rendered pictures, their diffs and the numbers.
      - name: The harness's pictures, diffs and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-harness-failure
          path: |
            ${{ runner.temp }}/spectrum-harness/results.json
            ${{ runner.temp }}/spectrum-harness/pixels/
          if-no-files-found: ignore

  # The downloadable manual's EPUB must stay valid — a doc change that breaks it should go
  # red here, on the push, not be discovered on a Kindle after release. Builds the EPUB only
  # (no Chrome/PDF) and runs the official W3C epubcheck, which exits non-zero on any error.
  # Its own first ship failed epubcheck with 89 errors (broken cross-links, missing images),
  # so this gate is not hypothetical.
  manual-epub:
    name: Manual EPUB validates (epubcheck)
    # ubuntu-24.04, as release.yml's manual job: the pillow pin below is the wheel for its CPython 3.12.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tools (pandoc + pillow; Java is preinstalled)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
          # pillow: WebP→PNG for the EPUB. The exact version, a wheel only, and the sha256 PyPI publishes
          # for the one file pip may pick here (CPython 3.12, x86_64), as release.yml's manual job
          # installs it. To move it, take the new version's hash for the same wheel tag from
          # https://pypi.org/pypi/pillow/<version>/json. pip reads it from stdin so that this step
          # stays install commands only, which scripts/gates reads as setup, not as a gate.
          python3 -m pip install --quiet --only-binary=:all: --require-hashes -r /dev/stdin <<'EOF'
          pillow==12.3.0 --hash=sha256:78cb2c6865a35ab8ff8b75fd122f6033b92a62c82801110e48ddd6c936a45d91
          EOF
      - name: Build the EPUB
        run: |
          set -euo pipefail
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          python3 scripts/build-manual-epub.py --version "$ver" --out /tmp/Nexus-Manual.epub
      - name: Validate with W3C epubcheck
        run: |
          set -euo pipefail
          EC=5.3.0
          # The zip's sha256, as release.yml's manual job checks it (where its second source is noted).
          # Move EC and this line together.
          EC_SHA256=6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5
          curl -fsSL "https://github.com/w3c/epubcheck/releases/download/v${EC}/epubcheck-${EC}.zip" -o /tmp/ec.zip
          echo "$EC_SHA256  /tmp/ec.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/ec.zip').extractall('/tmp')"
          java -jar "/tmp/epubcheck-${EC}/epubcheck.jar" /tmp/Nexus-Manual.epub

  # Job 3 — MSRV: the workspace must compile on the pinned minimum toolchain
  # (Cargo.toml [workspace.package] rust-version = "1.91"). Build-only check,
  # incl. the propagation `live` feature (the heaviest dep set).
  msrv:
    name: MSRV (1.91) check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # libssl-dev: propagation's `live` feature links OpenSSL on Linux for the HRDLog.net
      # transport (native-tls), and openssl-sys's build script needs the headers + pkg-config file.
      - name: Install libtempo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libfftw3-dev libboost-dev cmake ninja-build pkg-config libssl-dev

      - name: Set up Rust 1.91 toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.91.0

      # Restored everywhere and saved on main only: see the `test` job's cache.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ runner.os }}-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-

      - name: cargo check --workspace (MSRV)
        run: cargo check --workspace --all-targets

      - name: cargo check propagation --features live (MSRV)
        run: cargo check -p propagation --features live

      - name: Save the cargo cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Job 4 — Supply chain: RustSec advisories, license allow-list, sources, bans.
  deny:
    name: cargo-deny (supply chain + licenses)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2, 2026-07-13
        with:
          command: check advisories bans sources licenses

      # src-tauri is its OWN workspace root with its OWN Cargo.lock (see the
      # planted-error note above): the job above never scans the 281 packages
      # that ship ONLY in the desktop shell, and the two lockfiles can pin
      # different versions of shared deps — so CI tested a different dependency
      # set than shipped (45 divergences measured). Do NOT "fix" this by making
      # src-tauri a workspace member; it needs a WebView toolchain Linux lacks.
      - name: cargo-deny (src-tauri lockfile)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2, 2026-07-13
        with:
          command: check advisories bans sources licenses
          manifest-path: src-tauri/Cargo.toml

      # Shared deps must resolve identically in both lockfiles where semver
      # allows it, or CI tests a different dependency set than ships (measured
      # before this gate: 45 divergences, including the tract inference stack
      # the AI CW decoder actually runs on). Incompatible-major pairs (the
      # tauri stack legitimately requires newer majors than the workspace) are
      # REPORTED, not failed — they cannot align. KNOWN_BLOCKED names the pairs
      # where BOTH directions are wedged by hard requirements, each with the
      # blocker recorded; new compatible drift fails until aligned with
      # `cargo update -p <name> --precise <ver>`.
      - name: lockfile divergence (workspace vs src-tauri)
        run: |
          python3 - <<'PY'
          import re, sys
          # Pairs wedged on BOTH sides by hard requirements go here, each with
          # the blocking requirement named. (The time family lived here until
          # the tract 0.23 bump dropped time from the workspace tree entirely.)
          KNOWN_BLOCKED = set()
          def pins(path):
              d = {}
              for n, v in re.findall(r'name = "([^"]+)"\nversion = "([^"]+)"', open(path).read()):
                  d.setdefault(n, []).append(v)
              return d
          def ck(v):
              p = v.split('+')[0].split('.')
              return (p[0], p[1]) if p[0] == '0' else (p[0],)
          ws, st = pins('Cargo.lock'), pins('src-tauri/Cargo.lock')
          bad = []
          for n in sorted(ws.keys() & st.keys()):
              # A name can appear at SEVERAL majors in one lockfile (src-tauri
              # holds reqwest 0.12 AND 0.13); compare per semver-compat range,
              # where cargo guarantees a single resolved version per side.
              a = {ck(v): v for v in ws[n]}
              b = {ck(v): v for v in st[n]}
              for key in sorted(a.keys() & b.keys()):
                  if a[key] != b[key]:
                      if n in KNOWN_BLOCKED:
                          print(f"info: known-blocked {n}: {a[key]} vs {b[key]}")
                      else:
                          bad.append((n, a[key], b[key]))
          for n, x, y in bad:
              print(f"DIVERGED {n}: workspace {x} vs src-tauri {y}")
          if bad:
              print(f"{len(bad)} alignable shared dependencies resolve differently — "
                    "`cargo update -p <name>@<ver> --precise <ver>` one side into line "
                    "(or add to KNOWN_BLOCKED with the blocking requirement named).")
              sys.exit(1)
          print("lockfiles agree on all alignable shared dependencies")
          PY

      # reqwest must stay rustls-only in BOTH lockfiles. HRDLog.net's upload is the one
      # connection that needs the operating system's TLS stack, and it gets it through the
      # native-tls crate DIRECTLY (crates/propagation/src/live/hrdlog.rs), locked to one host.
      # reqwest's own native-tls feature would instead move every reqwest client in the app
      # onto that stack, silently, because cargo unifies features. The script header has the
      # measurement. cargo tree needs a toolchain, which cargo-deny's container does not give.
      - name: Set up Rust 1.93.1 toolchain (pinned — for cargo tree in the next step)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1

      - name: reqwest has no native-tls backend (workspace + src-tauri lockfiles)
        run: bash scripts/check-reqwest-rustls-only.sh

      # The installers carry the license texts of the Rust crates the desktop app is built from as
      # resources/rust/THIRD-PARTY.txt, copied from licenses/rust/THIRD-PARTY.txt, and Settings ▸
      # Licenses shows the same file. scripts/gen-rust-licenses.py derives it from src-tauri's
      # Cargo.lock: cargo's build graph on every installer target with the release features, each
      # crate's own license files, and, for a package that carries none, the reviewed upstream text
      # pinned for that crate version in licenses/rust/upstream.json. This fails when the committed
      # copy is behind the lockfile, so a dependency bump cannot reach an installer with the old
      # notices, and a new crate with no license text stops here until its text is reviewed. It
      # takes a few seconds: the step above has already downloaded every crate it reads. To
      # refresh: `python3 scripts/gen-rust-licenses.py`, and commit the result.
      - name: The installers' Rust license texts match the lockfile
        run: python3 scripts/gen-rust-licenses.py --check

  # Job 5 — Windows cross-compile. The desktop shell (src-tauri) is outside the
  # workspace and needs a WebView/MinGW toolchain the Linux test job lacks, so
  # `cargo test` never touches it. This job cross-compiles it to
  # x86_64-pc-windows-gnu with the MinGW-w64 toolchain — proving the Tauri command
  # surface, the feature-gated `radio` audio/CAT path, and the libtempo Fortran/C/C++
  # modem all still LINK for Windows. It is a compile/link check, not the shipping
  # installer: no NSIS bundle, no WebView2/Hamlib download (those run out-of-band
  # via scripts/build-windows-cross.sh, which adds --bundles nsis).
  windows-cross:
    name: Windows cross-compile (src-tauri)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # MinGW-w64 cross toolchain: gcc/g++/gfortran for the Fortran/C/C++ modem,
      # cmake/ninja to drive the libtempo CMake project, and a host build-essential
      # (cc/make) to cross-build FFTW3f for MinGW. nasm assembles libvpx's x86 code
      # (Remote as a stream's VP8 encoder, built by the same script).
      - name: Install MinGW-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            gfortran-mingw-w64-x86-64 \
            libboost-dev \
            cmake \
            ninja-build \
            build-essential \
            nasm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Rust 1.93.1 toolchain (pinned) + windows-gnu target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-gnu

      # Restored everywhere and saved on main only: see the `test` job's cache.
      - name: Restore the cargo, FFTW and libvpx cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            src-tauri/target
            target/fftw-mingw
            target/vpx-mingw
          # The cross script is in the key because it holds FFTW's configure flags. Under a key
          # that ignores them, an exact hit keeps restoring the library built with the old flags
          # and is never saved again. The script's stamp refuses that old build (a restore-key
          # match still brings one in) and rebuilds it; this key lets the rebuild be cached.
          key: ${{ runner.os }}-wincross-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.lock', 'scripts/build-windows-cross.sh') }}
          restore-keys: |
            ${{ runner.os }}-wincross-

      # Cross-build FFTW3f for MinGW + the libtempo modem self-test exes (win_smoke,
      # roundtrip, …). Proves the native modem chain links for Windows and produces
      # target/fftw-mingw, which tempo-fast-sys/build.rs reads on the src-tauri step below,
      # and target/vpx-mingw (the pinned libvpx), which tempo-stream/build.rs reads.
      - name: Cross-build FFTW + libtempo modem exes
        run: bash scripts/build-windows-cross.sh --no-gui

      # src-tauri embeds the web UI via the custom-protocol feature. `cargo build`
      # does NOT run Tauri's beforeBuildCommand, so build the dist explicitly first
      # or the asset embed fails ("frontendDist does not exist").
      - name: Build web UI (embedded assets)
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # Compile/link the desktop app for Windows. NOT `cargo tauri build` — no NSIS
      # bundle, no WebView2/Hamlib download — just prove src-tauri compiles clean.
      - name: Cross-compile src-tauri (x86_64-pc-windows-gnu)
        env:
          FFTW_MINGW_PREFIX: ${{ github.workspace }}/target/fftw-mingw
          VPX_MINGW_PREFIX: ${{ github.workspace }}/target/vpx-mingw
          # This job proves COMPILE/LINK, not shipping: the gitignored DeepCW
          # model isn't staged here, and build.rs hard-fails a release-profile
          # radio build without it (the silent-lobotomy gate). Allow it HERE
          # only — release.yml stages + digest-verifies the real model.
          NEXUS_ALLOW_MISSING_AICW: "1"
          # Same reasoning for the bundled Hamlib: the .exe/.dll are gitignored and
          # this job deliberately doesn't run scripts/fetch-hamlib.sh, so build.rs's
          # CAT-dead gate would fail a release+radio Windows build. Allow it HERE
          # only — the gate exists to stop a SHIPPING build (build-windows-cross.sh
          # and any local `cargo tauri build`) going out with no CAT.
          NEXUS_ALLOW_MISSING_HAMLIB: "1"
          # THE LINK PROFILE. On main and on a tag this is src-tauri's own [profile.release],
          # fat LTO and one codegen unit, as release.yml links the installer. Anywhere else (a
          # land/* or topic branch, a pull request) it is cargo's ordinary release linking,
          # `lto = false` (no cross-crate LTO) and 16 codegen units: the same code compiled
          # and linked for Windows, in minutes. A BRANCH RUN THEREFORE DOES NOT PROVE THE FAT-LTO LINK; main's run does,
          # before any tag. Measured 2026-10-30: the src-tauri crate under fat LTO had grown
          # from 15 to 37 minutes of this job. scripts/release-secrets.test.mjs holds the main
          # and tag values to the profile and keeps the override out of release.yml.
          CARGO_PROFILE_RELEASE_LTO: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '16' }}
        run: >
          cargo build --release
          --manifest-path src-tauri/Cargo.toml
          --target x86_64-pc-windows-gnu
          --features radio,custom-protocol

      # Security test A2 (Remote as a stream, S11): nothing compiled into the Windows build
      # injects operating-system input (SendInput, keybd_event, mouse_event), beyond the two
      # reviewed Tauri callers the script names. It reads sources, not Nexus.exe: Tauri's own
      # crates already import SendInput, so the binary cannot answer the question. The
      # self-test plants calls first, so a clean result comes from a check shown to find one.
      - name: No operating-system input injection (A2)
        run: |
          python3 scripts/check-no-input-injection.py --self-test
          python3 scripts/check-no-input-injection.py

      - name: Save the cargo, FFTW and libvpx cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
            src-tauri/target
            target/fftw-mingw
            target/vpx-mingw
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Job 5b — the client core for iOS. The only macOS job on branch and main CI.
  #
  # The macOS APP is not built here. Its compile checks (one on macos-14 for Apple Silicon, one on
  # macos-15-intel for Intel) left this workflow because they cost too much on every run: the Intel
  # one alone took over two hours (release profile, fat LTO and one codegen unit, on GitHub's slow
  # Intel runner), and the slowest job is the whole run's wall time. Every check they made is still
  # made, at release, on the binaries that ship: release.yml's `macos` job builds both DMGs on
  # those same runners, at bundle.macOS.minimumSystemVersion, from FFTW, libusb and Hamlib built
  # from source, and before it signs anything runs scripts/check-macho-bundle.mjs on the app binary
  # and on the staged Hamlib (each required tool and dylib), so a Mach-O built for a newer macOS
  # than the app promises, or one that loads from /opt/homebrew, /usr/local or /opt/local, fails
  # the release before upload. It checks the signed .app and the DMG again after, and
  # `smoke-macos` repeats it on a clean runner. A `workflow_dispatch` of release.yml is a dry run
  # that builds and verifies without publishing: use it to prove a Mac-only change before a tag.
  # The unit tests of check-macho-bundle.mjs still run on every push, in the `ui` job.
  #
  # What stays: the client core on an iPhone or iPad. It builds for iOS with no engine, no Tauri
  # and nothing Windows-only, so a phone app can be built on it. A check still runs the build
  # scripts, so ring's C and libopus (CMake) are compiled for iOS, by Xcode's clang and SDK, which
  # the cc crate finds through xcrun. No app build, no web UI, no Fortran: minutes, not hours.
  ios-client-check:
    name: iOS client core check (tempo-client)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          brew install cmake

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-ios

      - name: cargo check tempo-client for iOS (aarch64)
        run: cargo check -p tempo-client --target aarch64-apple-ios

  # Job 6 — Raspberry Pi .deb, one per live Pi OS base. Runs on GitHub's hosted
  # arm64 runner (free for public repos), so the aarch64 build is NATIVE: the same
  # image under QEMU on a dev box takes 45+ minutes and is 5-20x slower.
  #
  # Two bases, not one: Pi OS moved to Trixie (Debian 13) in late 2025 while a large
  # installed base is still on Bookworm (12). Trixie bumps libc/GTK/webkit2gtk, so a
  # .deb built on one will not reliably install on the other. This is a BUILD MATRIX,
  # not a port — identical source, two runtimes.
  #
  # fail-fast is off deliberately: if Trixie breaks (its webkit is a different major
  # version) the Bookworm .deb — the one most users need — must still be produced.
  #
  # NOTE: a green build proves the .deb COMPILES and PACKAGES. It does not prove the
  # app RENDERS. The webview smoke test (waterfall, map/globe, Settings) still has to
  # run on real hardware before a base is called supported.
  pi-deb:
    name: Raspberry Pi .deb (${{ matrix.base }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        base: [bookworm, trixie]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The DeepCW AI CW model is AGPL-3.0 (c) e04 and is NOT committed (15 MB binary,
      # gitignored — see src-tauri/resources/deepcw/README.md). A checkout therefore never
      # has it, and Tauri's resource glob matches the directory regardless, so without this
      # step the build silently produces a package ~14 MB lighter with no AI CW decoder and
      # no error. build-linux.sh hard-fails if these are absent, so this step is load-bearing.
      - name: Stage the DeepCW model (not committed — AGPL-3.0 (c) e04)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download deepcw-model-v1 --repo "${{ github.repository }}" \
            --pattern 'model.onnx*' --dir src-tauri/resources/deepcw --clobber
          # Pin by digest: a silently-swapped model would change decode behaviour with no
          # other visible signal.
          echo "a7b3b4aa2610d3e88b8c7d4420eceee31be2d0ae595b3413264334f3ffb1eab5  src-tauri/resources/deepcw/model.onnx" | sha256sum -c -
          echo "b4342157b90229ee7380e165f3d8036179b80d1e6ae02f2557388b7fcd558c01  src-tauri/resources/deepcw/model.onnx.json" | sha256sum -c -

      # No QEMU/binfmt setup: the runner is already aarch64, so `--platform
      # linux/arm64` selects the native architecture and the container runs at
      # full speed. The Debian base image supplies every build dep, so nothing
      # is installed on the runner itself.
      #
      # The WSJT-X-derived modem source is vendored in-tree at libtempo/vendor/wsjtx
      # and is CMake's default WX, so the checkout is self-contained — no external
      # tree to stage, which is what previously forced a dev-box path into the image.
      #
      # THE LINK PROFILE, as the Windows job's: src-tauri's fat LTO and one codegen unit on main
      # and on a tag, cargo's ordinary release linking anywhere else. A BRANCH RUN THEREFORE DOES
      # NOT PROVE THE FAT-LTO LINK, and its uploaded .deb is not linked as a release's is. The
      # two bare `--build-arg NAME`s hand the container these values from the step env;
      # Dockerfile.pi's own defaults are the release profile, which is what release.yml (passing
      # neither) builds. Measured 2026-10-30: the src-tauri crate under fat LTO had grown from
      # 18 to 36 minutes of this job.
      - name: Build .deb in a debian:${{ matrix.base }} container
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '1' || '16' }}
        run: >
          docker buildx build
          --platform linux/arm64
          -f scripts/Dockerfile.pi
          --build-arg BASE=${{ matrix.base }}
          --build-arg CARGO_PROFILE_RELEASE_LTO
          --build-arg CARGO_PROFILE_RELEASE_CODEGEN_UNITS
          --progress=plain
          --target export
          --output type=local,dest=pi-out/${{ matrix.base }}
          .

      # tauri names BOTH bases' output Nexus_<ver>_arm64.deb. Publishing them
      # side by side without a suffix means one silently overwrites the other and
      # a tester has no way to tell which OS their download was built for.
      - name: Tag the artifact with its base, and verify it is genuinely arm64
        run: |
          set -euo pipefail
          deb=$(find pi-out/${{ matrix.base }} -name '*.deb' -print -quit)
          [ -n "$deb" ] || { echo "no .deb produced"; exit 1; }
          ver=$(dpkg-deb -f "$deb" Version)
          arch=$(dpkg-deb -f "$deb" Architecture)
          echo "package: $(dpkg-deb -f "$deb" Package) / $ver / $arch"
          [ "$arch" = "arm64" ] || { echo "expected arm64, got $arch"; exit 1; }
          # HRDLog.net uploads link OpenSSL 3 (native-tls), a load-time dependency of the whole
          # binary, so the package must declare it. `libssl3` is a real package on Bookworm and a
          # Provides of libssl3t64 on Trixie, so the one name resolves on both bases.
          dpkg-deb -f "$deb" Depends | grep -qw libssl3 \
            || { echo "Depends lacks libssl3: $(dpkg-deb -f "$deb" Depends)"; exit 1; }
          # Prove the payload is really ARM — an x86 binary with an arm64 filename
          # installs cleanly and then fails to exec on the Pi.
          dpkg-deb -x "$deb" /tmp/debcheck
          bin=$(find /tmp/debcheck/usr/bin -type f -print -quit)
          file "$bin" | tee /tmp/filetype
          grep -q 'ARM aarch64' /tmp/filetype || { echo "payload is not ARM aarch64"; exit 1; }
          # Assert the AI CW model actually made it INTO the package. The staging step and
          # build-linux.sh both guard the inputs; this checks the output, because the failure
          # this catches (a package that installs and runs with the decoder silently absent)
          # is invisible to every other check. 2026-07-20: shipped exactly that, 14 MB light.
          m=/tmp/debcheck/usr/lib/Nexus/resources/deepcw/model.onnx
          [ -s "$m" ] || { echo "DeepCW model missing from the package"; exit 1; }
          echo "a7b3b4aa2610d3e88b8c7d4420eceee31be2d0ae595b3413264334f3ffb1eab5  $m" | sha256sum -c -
          mv "$deb" "pi-out/${{ matrix.base }}/Nexus_${ver}_pi_arm64_${{ matrix.base }}.deb"
          sha256sum pi-out/${{ matrix.base }}/*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pi-${{ matrix.base }}
          path: pi-out/${{ matrix.base }}/*.deb
          if-no-files-found: error
          retention-days: 30

  # Job 7 — E2E smoke: launch the REAL app under WebDriver (tauri-driver →
  # WebKitWebDriver → the built binary, headless via Xvfb) and prove what unit
  # tests structurally cannot: the app starts, a fresh profile gets the setup
  # wizard, the main UI mounts, and Settings OPENS (the class of the public
  # crash-on-Settings incident). Flows live in e2e/smoke.mjs — zero npm deps.
  e2e-linux:
    name: E2E smoke (launch + wizard + Settings)
    # ubuntu-24.04, not -latest: on 26.04 (ubuntu-latest since 2026-10-19) the WebKitGTK WebDriver
    # package is renamed (webkit2gtk-driver -> webkitgtk-webdriver) and apt refuses the install.
    # Move to the new image with its own package name and a green run, not by guessing.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build + driver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libfftw3-dev libboost-dev cmake ninja-build pkg-config \
            libasound2-dev libudev-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libsoup-3.0-dev \
            webkit2gtk-driver xvfb dbus

      - name: Set up Rust 1.93.1 toolchain (pinned — see header)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: 1.93.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build the app binary (debug, embedded assets)
        # radio: src-tauri does not compile without it. The gitignored AI-CW
        # model is absent in CI; debug builds only warn, but be explicit that
        # this binary is knowingly model-less — it tests the SHELL, not decode.
        env:
          NEXUS_ALLOW_MISSING_AICW: "1"
        run: >
          cargo build
          --manifest-path src-tauri/Cargo.toml
          --features radio,custom-protocol

      - name: Install tauri-driver
        run: cargo install tauri-driver --version "=2.1.0" --locked

      - name: Run the smoke flows
        run: |
          set -euo pipefail
          FAKEHOME="$RUNNER_TEMP/e2e-home"
          mkdir -p "$FAKEHOME"
          xvfb-run -a dbus-run-session -- env \
            HOME="$FAKEHOME" \
            XDG_CONFIG_HOME="$FAKEHOME/.config" \
            XDG_DATA_HOME="$FAKEHOME/.local/share" \
            XDG_CACHE_HOME="$FAKEHOME/.cache" \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            NEXUS_E2E_BINARY=src-tauri/target/debug/Nexus \
            node e2e/smoke.mjs

      - name: Failure screenshot (what the operator would have seen)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e/artifacts/
          if-no-files-found: ignore
