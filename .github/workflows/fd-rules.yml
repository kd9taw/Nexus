# Publish-on-change of the Field Day rules data that Nexus downloads for FD scoring
# parameters (crates/tempo-core/src/fd_rules.seed.json is BOTH the bundled seed and the
# published artifact — see tempo_core::fd_rules: a downloaded copy activates at the next
# launch, seed-floor rules apply).
#
# No cron: the rules change ~yearly, and the in-app refresh path is the pre-event
# "check for updates" button, so a push touching the seed is the only publish trigger.
# The rolling GitHub Release (`fd-rules`) needs NO secrets — the built-in GITHUB_TOKEN is
# enough. The gate IS the in-app loader — `cargo run -p tempo-core --bin fd-rules-check`
# is a thin shell around `tempo_core::fd_rules::validate` (= `parse_spec`), the very
# function the shipped app enforces, so a seed the app would refuse cannot ship and there
# is no second validator to drift from. (There was one: a node port of parse_spec that
# four rounds of parity fixes never reconciled, because matching it byte-for-byte means
# reimplementing serde's derive behaviour and serde_json's lexer.) Serving under
# hamradiotools.io is the same one-time `_redirects` site edit as fcc-states/cty; the
# optional Cloudflare R2 step below hosts it directly under the domain when the secret
# exists.
name: Field Day rules data (fd-rules.json)

on:
  push:
    branches: [main]
    paths:
      - crates/tempo-core/src/fd_rules.seed.json
      - crates/tempo-core/src/fd_rules.rs
      - crates/tempo-core/src/bin/fd-rules-check.rs
      - .github/workflows/fd-rules.yml
  workflow_dispatch: {}

# READ. The job below compiles and RUNS this repository's own code - `cargo run` on the very
# change that triggered the workflow - so it must not hold a token that can publish. The `publish`
# job declares its own write and runs no repo code at all: it downloads an artifact and calls `gh`.
#
# The design note above is right that "the gate IS the loader", and that is the correct
# architecture. But it also means the validator and the published data arrive in the same change: a
# PR that relaxes parse_spec relaxes its own gate, and the result reaches every installed Nexus.
# Splitting the token off does not fix that - review is still what stands there - but it does stop
# a build step that runs merged code from also being able to push.
permissions:
  contents: read

concurrency:
  group: fd-rules
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # node is here only for the optional `npx wrangler` R2 step at the bottom.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The gate below builds tempo-core, which links libtempo — a CMake/Fortran
      # project. This is the SUBSET of ci.yml's list that libtempo itself needs
      # (no GTK/WebKit/hamlib: nothing here builds the Tauri shell or the audio
      # crate). Keep it in step with ci.yml's "Install libtempo build
      # dependencies" step, which documents what each package is for.
      - name: Install libtempo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            libfftw3-dev \
            libboost-dev \
            cmake \
            ninja-build \
            pkg-config

      # Same pin as ci.yml — the gate must be the loader the tested build has.
      - name: Set up Rust 1.93.1 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fd-rules-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fd-rules-cargo-

      # THE gate: the app's own loader, on the file about to be published.
      # Exit 0 = the app would load it. Exit 1 = it would refuse it, and the
      # reason printed is parse_spec's own — nothing else publishes.
      - name: Validate the seed with the real loader (refuses a bad file, exit 1)
        run: cargo run --quiet -p tempo-core --bin fd-rules-check -- crates/tempo-core/src/fd_rules.seed.json

      - name: Stage the artifact
        run: |
          mkdir -p out
          cp crates/tempo-core/src/fd_rules.seed.json out/fd-rules.json

      - uses: actions/upload-artifact@v4
        with:
          name: fd-rules
          path: out/*
          retention-days: 14

  # Runs NO repository code: no checkout, no build, no cargo. It takes the bytes the validator
  # already approved and uploads them. This is the only job in the file that can write.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the rolling Release asset
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fd-rules
          path: out
      # node is here only for the optional `npx wrangler` R2 step at the bottom.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Publish to the rolling `fd-rules` Release (automatic source, no secrets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view fd-rules >/dev/null 2>&1 \
            || gh release create fd-rules \
                 --title "Field Day rules data (fd-rules.json)" \
                 --notes "Auto-published when the in-repo rules seed changes. Nexus downloads this for Field Day scoring parameters; it activates at the next launch." \
                 --latest=false
          gh release upload fd-rules out/fd-rules.json --clobber

      - name: (optional) Publish under hamradiotools.io via Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret — skipping R2 publish (the Release above is the source)."
            exit 0
          fi
          npx --yes wrangler@4.129.1 r2 object put nexus-data/fd-rules.json --file out/fd-rules.json --content-type application/json
