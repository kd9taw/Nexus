[package]
publish = false
name = "tempo-tcisim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Test support for Nexus's TCI client: a TCI server on loopback that models an SDR program's radio in the dialects Nexus meets and injects faults, plus the observe-only recorder testers run to capture a real server's session."

[lints]
workspace = true

[dependencies]
# The WebSocket under TCI: the simulator's server side, and the recorder's client side. Already in
# the lock through tempo-client, so this is an edge and no new
# crate. Only the handshake: TCI has no TLS.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
