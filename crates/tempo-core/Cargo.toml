[package]
publish = false
name = "tempo-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nexus transceiver core — slot timing, virtual-air channel, TX/RX engine over the FT1 modem"

[lints]
workspace = true

[dependencies]
tempo-fast = { path = "../tempo-fast" }
modes = { path = "../modes" }
wspr = { path = "../wspr" }
# Fixed-size real FFT for the waterfall power spectrum (MIT). Zero-alloc, ~2 transitive deps —
# an exact fit for the compile-time 4096-sample window.
microfft = "0.6"
# The Field Day ruleset loader (fd_rules: the bundled fd_rules.seed.json +
# install_from for a downloaded fd-rules.json). Both crates were already in the
# workspace lock (tempo-app, tempo-audio, propagation…), so this adds nothing
# new to the tree — it promotes serde_json from this crate's dev-deps to real.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MD5 for the Winlink secure-login challenge-response (src/winlink/secure.rs). Used ONLY as the
# published Winlink auth primitive — never for integrity, secrecy, or any security decision Nexus
# makes on its own; MD5 is broken as a hash and this is a protocol requirement, not a choice.
# MIT OR Apache-2.0, one-way-inbound compatible with GPL-3.0-only; NOTICE entry added. Brings the
# RustCrypto digest subtree (digest, block-buffer, crypto-common, generic-array, typenum) newly
# into the tree — all permissive and all already on deny.toml's allow-list.
# Pinned to the head of the stable 0.10 line (digest 0.10); 0.11 moves to digest 0.11 and is not
# taken here.
md-5 = "0.10.6"

[dev-dependencies]
# (serde_json is a real dependency above since the fd_rules data loader — the
# WSJT-X predicate-oracle tests and the fd_rules integration tests use it too.)
# Q65 TX helpers (tone spacing / bandwidth / over length) for the encode_wav_q65
# parity CLI. DEV-ONLY: examples are never shipped, and tempo-core itself does not
# depend on any modem crate. q65 depends only on tempo-fast-sys, so no cycle.
q65 = { path = "../q65" }
fst4 = { path = "../fst4" }
msk144 = { path = "../msk144" }
jt65 = { path = "../jt65" }
# Property tests for the Winlink LZHUF round-trip and the FBB framer's lengths/checksums.
# Already in the workspace lock via tempo-sstv at this version, so naming it here adds NO new
# code to the tree — it is bookkeeping (tempo-core must declare what it uses), not a new
# third-party dependency.
proptest = "1"

# JS8 (pure Rust, no sys dep) for the encode_wav_js8 parity CLI. DEV-ONLY, same rule as
# above: examples are never shipped and tempo-core itself does not depend on the modem.
# B5 makes `modes` depend on `js8`; until then this is the only path from tempo-core to it.
js8 = { path = "../js8" }