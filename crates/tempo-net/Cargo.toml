[package]
publish = false
name = "tempo-net"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WSJT-X-compatible UDP network output + PSK Reporter spotting so third-party ham apps (JTAlert, GridTracker, N1MM, loggers) interoperate with Nexus. Pure Rust."

[lints]
workspace = true

[dependencies]
# Flex discovery must SHARE UDP 4992 with a co-hosted SmartSDR (both sides set
# SO_REUSEADDR); std exposes no socket options, socket2 is already in the tree
# via tokio.
socket2 = "0.6"
# fdsync (Field Day club sync) is the ONE protocol in this crate where Nexus
# owns BOTH ends of the wire, so its NDJSON codec is serde-derived instead of
# hand-rolled like the external-protocol codecs above. First serde use in this
# crate; both crates are already workspace-wide (tempo-core, tempo-app), so no
# new external code enters the tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The WebSocket under TCI: the server's handshake, framing and masking (`tci::server`), and the client
# side of one connection to an SDR program (`tci::session`). Already in the tree at this exact version
# through tokio-tungstenite (tempo-client, src-tauri) and tempo-tcisim, with the same one feature
# tempo-client turns on, so nothing new enters the lock. Only the
# handshake: TCI has no TLS.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

# fdsync's adapter list (`lan_addrs`): the host's club beacon goes to each subnet's broadcast
# address, and its screen lists the addresses a joiner types. Both crates are already in the
# tree (libc beside socket2, `windows` through windows-capture in tempo-stream), and every
# feature named is one the shipped build already turns on, so nothing new is compiled. The same
# holds for fdfirewall's reading of Windows' firewall policy (Foundation, WindowsFirewall, Com,
# Ole, Variant), which tempo-stream's Remote reader turns on too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[features]
# The simulated network Icom (`icom::sim`), for another crate's tests: tempo-audio's Icom network
# daemon runs its suite against it. Test support only; nothing that ships turns it on.
icom-sim = []
# The door past `flex::admission::BENCHED` (`flex::session::Config::unbenched`), for another crate's
# tests: tempo-audio runs the Flex client's CW path with it. It admits the Flex starts no tester's
# bench has confirmed, so it is test support only: nothing that ships turns it on, and a release
# build refuses to compile with it.
flex-unbenched = []

[dev-dependencies]
# The SmartSDR simulator, for the Flex session's fault suites (`flex::sim_tests`). Test support from
# this workspace, std only; nothing outside the tests depends on it.
tempo-flexsim = { path = "../tempo-flexsim" }
# The TCI codecs' property and fuzz tests (`tci::wire`, `tci::frame`): no input a server sends may
# panic a decoder. Already a dev-dependency of js8, tempo-core and tempo-sstv, at the same version,
# so nothing new enters the lock.
proptest = "1"
# The TCI server simulator, for the TCI session's fault suites (`tci::session`). Test support from
# this workspace; it depends on tungstenite only, never on this crate.
tempo-tcisim = { path = "../tempo-tcisim" }
