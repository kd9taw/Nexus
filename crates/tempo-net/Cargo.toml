[package]
publish = false
name = "tempo-net"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WSJT-X-compatible UDP network output + PSK Reporter spotting so third-party ham apps (JTAlert, GridTracker, N1MM, loggers) interoperate with Nexus. Pure Rust."

[lints]
workspace = true

[dependencies]
# Flex discovery must SHARE UDP 4992 with a co-hosted SmartSDR (both sides set
# SO_REUSEADDR); std exposes no socket options, socket2 is already in the tree
# via tokio.
socket2 = "0.6"
# fdsync (Field Day club sync) is the ONE protocol in this crate where Nexus
# owns BOTH ends of the wire, so its NDJSON codec is serde-derived instead of
# hand-rolled like the external-protocol codecs above. First serde use in this
# crate; both crates are already workspace-wide (tempo-core, tempo-app), so no
# new external code enters the tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The simulated network Icom (`icom::sim`), for another crate's tests: tempo-audio's Icom network
# daemon runs its suite against it. Test support only; nothing that ships turns it on.
icom-sim = []
# The door past `flex::admission::BENCHED` (`flex::session::Config::unbenched`), for another crate's
# tests: tempo-audio runs the Flex client's CW path with it. It admits the Flex starts no tester's
# bench has confirmed, so it is test support only: nothing that ships turns it on, and a release
# build refuses to compile with it.
flex-unbenched = []

[dev-dependencies]
# The SmartSDR simulator, for the Flex session's fault suites (`flex::sim_tests`). Test support from
# this workspace, std only; nothing outside the tests depends on it.
tempo-flexsim = { path = "../tempo-flexsim" }
