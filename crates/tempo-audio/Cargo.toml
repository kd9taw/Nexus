[package]
publish = false
name = "tempo-audio"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nexus real-radio transport: sound-card audio (cpal) + PTT/CAT via rigctld, on the FT1 slot clock"

[lints]
workspace = true

[features]
# Pure logic (rig over TCP, RX ring, slot-clock runtime) builds with no extra
# system deps. The `device` feature pulls in cpal for real sound-card I/O — gate
# it on so the workspace test build needs no audio libraries.
default = []
device = ["dep:cpal", "dep:tempo-net", "dep:tempo-sstv", "dep:alsa"]
# Serial PTT + COM-port enumeration via `serialport`. OFF by default: the
# headless workspace build has no libudev. The station PC enables it.
serial = ["dep:serialport"]
# The AI CW decoder thread (DeepCW model via tract). Pure Rust; pulled in by the
# station build (src-tauri `radio`). The model itself is an app resource, not a dep.
ai-cw = ["dep:deepcw"]

# Multi-radio Phase 0 probe: opens every enabled radio profile's codec at once.
# Needs a real sound card, so it only exists with `device`.
[[example]]
name = "audio_probe"
required-features = ["device"]

[dependencies]
tempo-app = { path = "../tempo-app" }
tempo-core = { path = "../tempo-core" }
# Voice-keyer WAV I/O (read/write 12 kHz mono message files). Pure, no audio device.
hound = "3.5"
# Received-SSTV image encoding. MIT OR Apache-2.0, already in the tree via tauri, and on
# deny.toml's allowlist. Encode-only use: one 320x256-ish frame per ~2-minute transmission.
png = "0.17"
cpal = { version = "0.18", optional = true }
serialport = { version = "4", optional = true }
deepcw = { path = "../deepcw", optional = true }
tempo-net = { path = "../tempo-net", optional = true }
# SSTV RX decoder core (the `sstvrx` thread). Rides `device` like the rest of
# the station-side transport.
tempo-sstv = { path = "../tempo-sstv", optional = true }
# SSTV gallery persistence (gallery.json load/save in `sstv_store`). Pure.
serde_json = "1"

# Linux-only: read ALSA's PCM hints ourselves, so the device picker can show the card
# DESCRIPTION ("USB AUDIO CODEC") the operator's system, `aplay -l`, KDE, pavucontrol and
# WSJT-X all show — cpal keeps only the raw PCM name ("plughw:CARD=CODEC,DEV=0") and, worse,
# probe-opens every hint and silently drops what it cannot open. `alsa` is cpal's OWN
# dependency at the same "0.11" requirement, so this is already in Cargo.lock and adds no new
# code to the tree; it is a direct dependency only so we can call `HintIter` (which opens no
# PCM stream). Apache-2.0 OR MIT — GPL-3.0-only compatible; NOTICE entry filed.
# Moved 0.9 → 0.11 WITH cpal 0.18, to keep that "cpal's own dependency, same requirement"
# argument true — two alsa versions in one tree would mean two `snd_config` global states.
# `HintIter`/`Hint` are unchanged between the two (name/desc/direction, `new_str`), so this
# is a version match, not a migration.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11", optional = true }

# Windows-only: assign the launched rigctld to a Job Object so the OS kills it
# (freeing the serial/COM port) whenever Tempo exits — even on a crash.
# macOS-only: read USB port paths so the pickers can say WHICH RIG a device belongs to. Two
# identical rig codecs report the identical CoreAudio name (a pair of C-Media dongles both
# enumerate as "USB Audio Device"), and two ports of one bridge look alike too, so string matching
# can only offer a bare name and a " #2". `usbtopo` matches each device to a radio by USB topology
# instead — as a TIE-BREAK behind the existing string matching, never in place of it.
#
# `io-kit-sys` and `core-foundation-sys` were already in Cargo.lock at these requirements via
# serialport and cpal — direct dependencies only so we can call the registry/property lookups
# ourselves, exactly like the `alsa` entry.
# ⚠️ `coreaudio-sys` IS NEW, and the comment this replaces said otherwise. It was true when this
# code was written: cpal 0.15 pulled it in. The cpal 0.15 -> 0.18 upgrade replaced it with the
# objc2-core-audio family and dropped it from the tree, so it stopped being true underneath a
# finished PR. Carried deliberately rather than making a contributor rewrite working IOKit
# interop against a different binding for no operator-visible difference. MIT, GPL-3.0-only
# compatible, macOS builds only. NOTICE says the same thing — keep the two in step.
# Licences, read PER CRATE from each one's own Cargo.toml rather than assumed alike:
# io-kit-sys "MIT / Apache-2.0", core-foundation-sys "MIT OR Apache-2.0", coreaudio-sys "MIT"
# (MIT only — not dual). All three are GPL-3.0-only compatible and all three are already on
# `deny.toml`'s allowlist today, because cargo-deny reads the whole lockfile with no target
# filter and they have been in it as transitive deps all along. NOTICE entries filed.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Windows-only: COM + IDispatch for the OmniRig CAT backend (`src/omnirig/com.rs`) —
# CoInitializeEx/CoCreateInstance/CLSIDFromProgID and late-bound property calls on
# OmniRig's `OmniRig.OmniRigX` object. `windows-sys` above cannot serve this: it is the
# raw-FFI crate and carries no COM interface types (no `IDispatch`, no `VARIANT` with a
# Drop), so hand-rolling the vtables is the only alternative and it is the wrong trade for
# a transmit-adjacent path. Microsoft, Apache-2.0 OR MIT — GPL-3.0-only compatible
# (verified from the crate's own metadata + its bundled licence files). Minimum feature set:
# Com for the COM API and IDispatch, Ole for DISPID_PROPERTYPUT, Variant for the VT tags,
# Foundation for the two HRESULTs that mean "OmniRig is not installed".
#
# ⚠️ THE 0.54 PIN IS A DECISION, NOT AN OVERSIGHT — AND THE TREE CARRIES TWO `windows`
# VERSIONS ON PURPOSE. Do not "consolidate" this in passing.
#
# This entry used to justify 0.54 by saying it was already in the lock as cpal's own
# dependency, so it added no new crate to the tree — the same argument the `alsa` entry above
# still makes. That argument DIED at the cpal 0.18 upgrade: 0.18's WASAPI backend raised its
# `windows` floor to 0.61+, and the lock now resolves cpal's half to 0.62. So the tree holds
# `windows` 0.54 here for the OmniRig COM path and `windows` 0.62 under cpal for WASAPI.
#
# Why that is ACCEPTED rather than fixed:
#   * Both are Windows-only targets, so neither costs a Linux or macOS build anything, and the
#     two never meet — we call COM through IDispatch, cpal calls WASAPI.
#   * `cargo deny check bans` passes on the duplicate, and
#     `cargo check --target x86_64-pc-windows-gnu` compiles with both present.
#   * Consolidating means migrating our COM code from 0.54 to 0.62. That is ONE file —
#     `src/omnirig/com.rs`, the only place in the tree that uses this crate (`Interface`,
#     `BSTR`, `VARIANT`, `HRESULT`, the `Win32::System::Com`/`Ole`/`Variant` types). Do not
#     be misled by the `std::os::windows::*` imports in `rigctld_proc.rs`, `ports.rs`,
#     `baud_ladder.rs` and `src-tauri/src/lib.rs` — those are the STANDARD LIBRARY, and
#     `rigctld_proc.rs`'s `windows_sys::` is the separate `windows-sys` 0.59 entry above.
#     Neither is affected by this pin.
#   * So the work is small, and that is NOT why it is deferred. It is deferred because
#     `com.rs` is the OmniRig CAT backend: it keys the rig, it is Windows-only, and nothing
#     about it can be verified from a Linux box beyond a cross-compile. A COM-interop
#     rewrite on a transmit path earns a bench pass on a real Windows station with OmniRig
#     installed, and that is a different change from an audio-format batch.
#
# Bumping this to match cpal is a perfectly good thing to do ON PURPOSE, with that bench pass
# behind it. It is not a cleanup, and a duplicate-dependency warning is not a reason on its own.
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
# TEST-ONLY, and only for `tests/rotctld_pass.rs`: that suite flies a REAL
# satellite pass (real elements, real look angles) onto a real Hamlib rotctld,
# because the tracking policy and the wire code are each well covered alone and
# every interesting bug lives between them. In-workspace and test-scoped, so
# the shipped dependency graph is unchanged.
propagation = { path = "../propagation" }
