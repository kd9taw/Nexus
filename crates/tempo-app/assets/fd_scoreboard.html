<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Day Scoreboard</title>
<style>
/* The spectator scoreboard: one self-contained page, served by Nexus over the LAN for a
   TV or projector, for any contest club sync runs. No external reference of any kind
   lives in this file (a Rust test pins it): it must render at a field site with no
   route to the internet.

   TV-FIRST. The whole board is one 16:9 frame sized in --u, a hundredth of the frame's
   width, so it lays out identically at 1920x1080 and at 3840x2160 (a TV browser that
   reports a 4K viewport at a device pixel ratio of 1 gets the same board, twice the
   pixels), and a 4:3 projector letterboxes rather than reflowing. Nothing scrolls and
   nothing auto-cycles: a spectator who glances up must find each block where it was.
   Big numerals are heavy, tabular and high-contrast; the smallest text on the board
   is about one fiftieth of its height.

   THEMES. Dark is the default (a TV in a tent). ?theme=light gives the light board,
   ?theme=auto follows the TV's own setting. Every colour is a token below, defined for
   both. */
:root {
  --u: min(1vw, 1.7778vh);
  --bg: #05090e;
  --frame: #090f17;
  --panel: #0e1520;
  --panel-hi: #131c29;
  --line: #1e2937;
  --text: #f2f6fa;
  --dim: #a4b3c3;
  --faint: #6f7f90;
  --accent: #4cc2ff;
  --accent-ink: #03121c;
  --lit: #34d27e;
  --lit-ink: #04200e;
  --need: #1c2a3b;
  --need-ink: #8296ab;
  --warn: #ffb454;
  --hot: #ff6a5e;
  --hot-ink: #1d0705;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  --sans: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #dfe5ec;
  --frame: #eef2f6;
  --panel: #ffffff;
  --panel-hi: #f5f8fb;
  --line: #d3dbe4;
  --text: #0b1520;
  --dim: #3f4e5f;
  --faint: #677688;
  --accent: #0868ad;
  --accent-ink: #ffffff;
  --lit: #13814a;
  --lit-ink: #ffffff;
  --need: #e6ebf1;
  --need-ink: #66778a;
  --warn: #9a5800;
  --hot: #c0342a;
  --hot-ink: #ffffff;
  color-scheme: light;
}
/* On the light board a band's hue rides the chip's edge; its name stays ink-dark. */
:root[data-theme="light"] .pos-band { color: var(--text); }
:root[data-theme="light"] .pos-where { border-width: calc(var(--u) * 0.18); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#board {
  width: calc(var(--u) * 100);
  height: calc(var(--u) * 56.25);
  padding: calc(var(--u) * 0.9);
  background: var(--frame);
  display: grid;
  grid-template-rows: calc(var(--u) * 5.6) minmax(0, 1fr) calc(var(--u) * 4.5);
  gap: calc(var(--u) * 0.75);
}
.num { font-variant-numeric: tabular-nums; }

/* ---- header: the event, the station, the clock and the time left ---- */
#hdr { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 1.5); padding: 0 calc(var(--u) * 0.5) calc(var(--u) * 0.45); }
#hdr-left { flex: 1 1 auto; min-width: 0; }
#ev-name { font-size: calc(var(--u) * 2.7 * var(--fit, 1)); font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; white-space: nowrap; overflow: hidden; }
#ev-station { font-family: var(--mono); font-size: calc(var(--u) * 1.45); line-height: 1.25; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* A live board whose host has gone quiet keeps the board and says so in its own header. */
#ev-station.warn { font-family: var(--sans); font-weight: 800; color: var(--warn); }
#hdr-right { flex: 0 0 auto; text-align: right; }
#clock-row { display: flex; align-items: baseline; justify-content: flex-end; gap: calc(var(--u) * 0.45); }
#clock { font-size: calc(var(--u) * 2.9); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
#clock-utc { font-size: calc(var(--u) * 1.25); font-weight: 800; letter-spacing: 0.1em; color: var(--dim); }
#time-label { font-size: calc(var(--u) * 1.3); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-top: calc(var(--u) * 0.3); white-space: nowrap; }
#time-label.soon { color: var(--warn); }
/* The time-left bar is the header's own bottom rule, the width of the board. */
#timebar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 0.3); background: var(--line); border-radius: calc(var(--u) * 0.3); overflow: hidden; }
#timebar-fill { height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }

/* ---- the three columns ---- */
#main { display: grid; grid-template-columns: calc(var(--u) * 28) minmax(0, 1fr) calc(var(--u) * 26.5); gap: calc(var(--u) * 0.75); min-height: 0; }
#col-left, #col-right { display: flex; flex-direction: column; gap: calc(var(--u) * 0.75); min-height: 0; min-width: 0; }
#col-center { display: flex; min-height: 0; min-width: 0; }
.panel {
  background: var(--panel);
  border: calc(var(--u) * 0.08) solid var(--line);
  border-radius: calc(var(--u) * 0.7);
  padding: calc(var(--u) * 0.7) calc(var(--u) * 1);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.panel h2 {
  font-size: calc(var(--u) * 1.05);
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  line-height: 1.2;
  margin-bottom: calc(var(--u) * 0.4);
  flex: 0 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- the score: one big number, and how it is made ---- */
#score-panel { flex: 0 0 auto; }
#score-total { font-size: calc(var(--u) * 6.0 * var(--fit, 1)); font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
#score-caption { font-size: calc(var(--u) * 1.05); color: var(--dim); line-height: 1.3; margin: calc(var(--u) * 0.2) 0 calc(var(--u) * 0.45); }
/* How the score is made, as label-over-value cells two to a row; the arithmetic lines span both. */
#score-lines { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: calc(var(--u) * 0.8); }
.score-line { display: flex; flex-direction: column; min-width: 0; padding: calc(var(--u) * 0.22) 0; border-top: calc(var(--u) * 0.06) solid var(--line); }
.score-line.wide { grid-column: 1 / -1; }
.score-line .k { font-size: calc(var(--u) * 0.95); font-weight: 700; color: var(--dim); line-height: 1.25; }
.score-line .v { font-size: calc(var(--u) * 1.45 * var(--fit, 1)); font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.score-line.provisional .k, .score-line.provisional .v { color: var(--warn); }
#score-note { display: none; font-size: calc(var(--u) * 1.0); line-height: 1.3; color: var(--warn); margin-top: calc(var(--u) * 0.4); }
#score-note.on { display: block; }

/* ---- the rate ---- */
#rate-panel { flex: 1 1 auto; }
#qso-stats { flex: 0 0 auto; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: calc(var(--u) * 0.6); }
.stat { min-width: 0; }
.stat-v { font-size: calc(var(--u) * 2.6 * var(--fit, 1)); font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.stat-u { font-size: calc(var(--u) * 1.2); font-weight: 800; color: var(--dim); margin-left: 0.12em; }
.stat-k { font-size: calc(var(--u) * 0.9); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--dim); margin-top: calc(var(--u) * 0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#spark-wrap { flex: 1 1 auto; min-height: 0; position: relative; margin-top: calc(var(--u) * 0.6); }
#sparkline { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sparkline rect { fill: var(--accent); opacity: 0.85; }
#sparkline rect.now { fill: var(--lit); opacity: 1; }
#spark-cap { position: absolute; left: 0; top: 0; font-size: calc(var(--u) * 0.85); font-weight: 700; color: var(--faint); white-space: nowrap; }

/* ---- the line score: contacts by band and mode ---- */
#bm-panel { flex: 0 0 auto; }
#bm-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: calc(var(--u) * 1.05 * var(--fit, 1)); font-variant-numeric: tabular-nums; }
#bm-table th, #bm-table td { padding: calc(var(--u) * 0.12) calc(var(--u) * 0.08); text-align: center; white-space: nowrap; overflow: hidden; }
#bm-table thead th { font-size: 0.85em; font-weight: 800; color: var(--dim); border-bottom: calc(var(--u) * 0.08) solid var(--line); }
#bm-table tbody th { text-align: left; font-size: 0.85em; font-weight: 800; color: var(--dim); }
#bm-table thead th:first-child { width: 20%; }
#bm-table td { font-weight: 700; }
#bm-table td.z { color: var(--faint); font-weight: 400; }
#bm-table tr.total td, #bm-table tr.total th { color: var(--accent); font-weight: 900; border-top: calc(var(--u) * 0.08) solid var(--line); }

/* ---- the map: the sections globe, a county mosaic, or a board of what the ruleset counts ---- */
#globe-panel { flex: 1 1 auto; }
#sec-head { flex: 0 0 auto; display: flex; align-items: baseline; gap: calc(var(--u) * 0.8); min-width: 0; }
#sec-head h2 { margin-bottom: 0; flex: 0 1 auto; }
#sec-count { font-size: calc(var(--u) * 1.9); font-weight: 900; color: var(--lit); font-variant-numeric: tabular-nums; white-space: nowrap; }
#globe-legend { margin-left: auto; display: flex; gap: calc(var(--u) * 1.1); font-size: calc(var(--u) * 0.95); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.leg { display: flex; align-items: center; gap: calc(var(--u) * 0.4); }
.leg .dot { width: calc(var(--u) * 0.8); height: calc(var(--u) * 0.8); border-radius: 50%; background: var(--need-ink); }
.leg.on { color: var(--lit); }
.leg.on .dot { background: var(--lit); }
.leg.home .dot { background: transparent; border: calc(var(--u) * 0.2) solid var(--accent); }
#globe-wrap { flex: 1 1 auto; min-height: 0; position: relative; margin-top: calc(var(--u) * 0.5); }
#globe, #mapsvg, #chipmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#mapsvg, #chipmap { display: none; }
#globe-wrap.mosaic #globe, #globe-wrap.chips #globe { display: none; }
#globe-wrap.mosaic #mapsvg { display: block; }
#globe-wrap.chips #chipmap { display: grid; }
#mapsvg .cell { fill: var(--need); stroke: var(--panel); }
#mapsvg .cell.on { fill: var(--lit); }
#mapsvg .cell.home { stroke: var(--accent); }
#mapsvg .cell.fresh { animation: fresh 2.6s ease-out; }
#mapsvg text { font-family: var(--mono); font-weight: 800; fill: var(--need-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#mapsvg text.on { fill: var(--lit-ink); }
@keyframes fresh { 0% { fill: var(--warn); } 100% { fill: var(--lit); } }
#chipmap { align-content: start; gap: calc(var(--u) * 0.35); grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); }
.chip { font-family: var(--mono); font-weight: 800; font-size: calc(var(--u) * 1.0 * var(--fit, 1)); text-align: center; padding: calc(var(--u) * 0.25) 0; border-radius: calc(var(--u) * 0.3); background: var(--need); color: var(--need-ink); white-space: nowrap; overflow: hidden; }
.chip.on { background: var(--lit); color: var(--lit-ink); }
#framing { flex: 0 0 auto; font-size: calc(var(--u) * 1.0); line-height: 1.3; color: var(--faint); margin-top: calc(var(--u) * 0.4); }

/* ---- positions: who is on which band right now ---- */
#pos-panel { flex: 1 1 auto; }
#pos-list { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.pos-row { display: grid; grid-template-columns: calc(var(--u) * 5.4 * var(--fit, 1)) minmax(0, 1fr) auto; gap: calc(var(--u) * 0.8); align-items: center; padding: calc(var(--u) * 0.45 * var(--fit, 1)) 0; border-bottom: calc(var(--u) * 0.06) solid var(--line); }
/* Which band this position is on, in the band's own hue (the globe's, the cockpit's),
   so 20m looks like 20m everywhere. */
.pos-where { text-align: center; border-radius: calc(var(--u) * 0.45); padding: calc(var(--u) * 0.3) 0; background: var(--panel-hi); border: calc(var(--u) * 0.1) solid var(--line); }
.pos-where { border-color: var(--band, var(--line)); }
.pos-band { color: var(--band, var(--text)); font-weight: 900; font-size: calc(var(--u) * 1.45 * var(--fit, 1)); line-height: 1.05; font-variant-numeric: tabular-nums; }
.pos-mode { font-weight: 800; font-size: calc(var(--u) * 0.95 * var(--fit, 1)); color: var(--dim); letter-spacing: 0.06em; }
/* Presence expires; QSO counts do not. Only the live claim goes dim. */
.pos-where.stale { opacity: 0.4; }
.pos-who { min-width: 0; }
.pos-label { font-weight: 800; font-size: calc(var(--u) * 1.35 * var(--fit, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos-op { font-family: var(--mono); font-size: calc(var(--u) * 1.0 * var(--fit, 1)); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos-nums { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos-nums .q { font-weight: 900; font-size: calc(var(--u) * 1.35 * var(--fit, 1)); }
.pos-nums .p { font-size: calc(var(--u) * 1.0 * var(--fit, 1)); color: var(--dim); }
.pos-nums b { color: var(--accent); }

/* ---- multipliers, bonuses or objectives: how the score multiplies ---- */
#mult-panel { flex: 0 0 auto; max-height: 50%; }
#mult-list { display: none; }
#mult-panel.mults #mult-list { display: block; }
#mult-panel.mults #bonus-list { display: none; }
.mult-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: calc(var(--u) * 0.6); padding: calc(var(--u) * 0.3) 0; border-top: calc(var(--u) * 0.06) solid var(--line); }
.mult-row:first-child { border-top: 0; }
.mult-k { font-size: calc(var(--u) * 1.2 * var(--fit, 1)); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mult-v { font-size: calc(var(--u) * 1.9 * var(--fit, 1)); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.05; }
.mult-v .of { font-size: 0.55em; font-weight: 800; color: var(--dim); margin-left: 0.25em; }
.mult-bar { grid-column: 1 / -1; height: calc(var(--u) * 0.35); background: var(--need); border-radius: calc(var(--u) * 0.35); overflow: hidden; }
.mult-bar span { display: block; height: 100%; background: var(--lit); }
.mult-stations { font-size: calc(var(--u) * 1.1 * var(--fit, 1)); padding: calc(var(--u) * 0.35) 0 0; border-top: calc(var(--u) * 0.06) solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mult-stations .st { font-family: var(--mono); font-weight: 800; color: var(--faint); margin-right: calc(var(--u) * 0.9); }
.mult-stations .st.on { color: var(--lit); }
#bonus-list { display: block; }
.bonus-more { font-size: calc(var(--u) * 1.0); color: var(--faint); margin-top: calc(var(--u) * 0.25); }
.bonus { display: none; align-items: flex-start; gap: calc(var(--u) * 0.4); font-size: calc(var(--u) * 1.15 * var(--fit, 1)); line-height: 1.3; padding: calc(var(--u) * 0.12) 0; color: var(--faint); min-width: 0; }
.bonus.claimed { display: flex; }
.bonus > span:nth-child(2) { min-width: 0; }
.bonus .tick { width: 1.1em; text-align: center; font-weight: 900; flex: 0 0 auto; }
.bonus .om { margin-left: auto; padding-left: calc(var(--u) * 0.4); font-variant-numeric: tabular-nums; font-weight: 800; flex: 0 0 auto; }
.bonus.claimed { color: var(--text); }
.bonus.claimed .tick { color: var(--lit); }

/* ---- the latest contact: the board's lower third ---- */
#ftr { flex-direction: row; align-items: center; gap: calc(var(--u) * 1.2); padding-top: calc(var(--u) * 0.5); padding-bottom: calc(var(--u) * 0.5); }
#hero-label { flex: 0 0 auto; font-size: calc(var(--u) * 1.0); font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); border-radius: calc(var(--u) * 0.35); padding: calc(var(--u) * 0.35) calc(var(--u) * 0.7); white-space: nowrap; }
#hero { flex: 1 1 auto; min-width: 0; font-size: calc(var(--u) * 2.0 * var(--fit, 1)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hero .call { font-family: var(--mono); color: var(--accent); font-weight: 900; }
#hero .attr { color: var(--dim); font-weight: 700; font-size: 0.7em; }
#hero.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { color: var(--lit); } 100% { color: var(--text); } }
#recent { flex: 0 1 auto; max-width: 42%; font-family: var(--mono); font-size: calc(var(--u) * 1.1); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- status: the stale badge, or a notice where there is no board ---- */
#stale {
  display: none;
  position: fixed; top: calc(var(--u) * 1.2); left: 50%; transform: translateX(-50%);
  max-width: calc(var(--u) * 80);
  background: var(--hot); color: var(--hot-ink); font-weight: 800;
  padding: calc(var(--u) * 0.5) calc(var(--u) * 1.2); border-radius: calc(var(--u) * 0.5);
  font-size: calc(var(--u) * 1.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#stale.on { display: block; }
#inactive {
  display: none;
  position: fixed; inset: 0; background: var(--bg);
  align-items: center; justify-content: center;
}
#inactive.on { display: flex; }
#notice {
  width: calc(var(--u) * 72);
  background: var(--panel); border: calc(var(--u) * 0.1) solid var(--line);
  border-left: calc(var(--u) * 0.6) solid var(--accent);
  border-radius: calc(var(--u) * 0.9);
  padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
}
#notice-kicker { font-size: calc(var(--u) * 1.1); font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
#notice-title { font-size: calc(var(--u) * 3.2); font-weight: 800; line-height: 1.12; margin: calc(var(--u) * 0.6) 0 calc(var(--u) * 1.1); }
#notice-body { font-size: calc(var(--u) * 1.65); line-height: 1.4; color: var(--text); }
#notice-do { font-size: calc(var(--u) * 1.45); line-height: 1.45; color: var(--dim); margin-top: calc(var(--u) * 1.1); }
#notice-foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: calc(var(--u) * 2); padding-top: calc(var(--u) * 1); border-top: calc(var(--u) * 0.08) solid var(--line); font-size: calc(var(--u) * 1.2); color: var(--faint); }
#notice-clock { font-size: calc(var(--u) * 2.2); font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  #hero.flash, #mapsvg .cell.fresh { animation: none; }
  #timebar-fill { transition: none; }
}
</style>
</head>
<body>
<div id="board">
  <div id="hdr">
    <div id="hdr-left">
      <div id="ev-name"></div>
      <div id="ev-station"></div>
    </div>
    <div id="hdr-right">
      <div id="clock-row"><span id="clock"></span><span id="clock-utc"></span></div>
      <div id="time-label"></div>
    </div>
    <div id="timebar"><div id="timebar-fill"></div></div>
  </div>
  <div id="main">
    <div id="col-left">
      <div class="panel" id="score-panel">
        <h2 id="score-title"></h2>
        <div id="score-total">0</div>
        <div id="score-caption"></div>
        <div id="score-lines"></div>
        <div id="score-note"></div>
      </div>
      <div class="panel" id="rate-panel">
        <h2 id="qso-title"></h2>
        <div id="qso-stats">
          <div class="stat"><div class="stat-v" id="qso-count">0</div><div class="stat-k" id="qso-count-k"></div></div>
          <div class="stat"><div class="stat-v"><span id="qso-rate">0</span><span class="stat-u" id="qso-rate-unit"></span></div><div class="stat-k" id="qso-rate-k"></div></div>
          <div class="stat"><div class="stat-v" id="qso-rate10">0</div><div class="stat-k" id="qso-rate10-unit"></div></div>
        </div>
        <div id="spark-wrap"><svg id="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none"></svg><div id="spark-cap"></div></div>
      </div>
      <div class="panel" id="bm-panel">
        <h2 id="bm-title"></h2>
        <table id="bm-table">
          <thead><tr id="bm-head"></tr></thead>
          <tbody id="bm-body"></tbody>
        </table>
      </div>
    </div>
    <div id="col-center">

/* MIRROR of CONTESTS in ui/src/fdEvent.ts — each contest's own name, by its
   rules-file id (invariant, never translated). A hand copy because this page has
   no build step; the jsdom suite holds the two together. An id this list does not
   know shows the sponsor's id from the payload instead. */
var CONTEST_NAMES = {
  arrlfd: 'ARRL Field Day',
  wfd: 'Winter Field Day',
  arrlss_cw: 'ARRL November Sweepstakes (CW)',
  arrlss_ssb: 'ARRL November Sweepstakes (Phone)',
  arrlvhf_jan: 'ARRL January VHF Contest',
  arrlvhf_jun: 'ARRL June VHF Contest',
  arrlvhf_sep: 'ARRL September VHF Contest',
  cqww_cw: 'CQ World-Wide DX Contest (CW)',
  cqww_ssb: 'CQ World-Wide DX Contest (SSB)',
  cqww_rtty: 'CQ World-Wide RTTY DX Contest',
  cqwpx_cw: 'CQ World-Wide WPX Contest (CW)',
  cqwpx_ssb: 'CQ World-Wide WPX Contest (SSB)',
  cqp: 'California QSO Party',
  ilqp: 'Illinois QSO Party',
  nyqp: 'New York QSO Party',
  ohqp: 'Ohio QSO Party',
  tnqp: 'Tennessee QSO Party',
  txqp: 'Texas QSO Party'
};

/* Labels for the multiplier universes, by the rule id the rules data gives them. */
var MULT_LABEL = {
  county: 'multCounty', mult: 'multMult', state: 'multState', qth: 'multQth',
  dxcc: 'multDxcc', country: 'multCountry', zone: 'multZone', grid: 'multGrid',
  section: 'multSection', ny: 'multNy', prefix: 'multPrefix'
};

/* ------------------------------------------------------------------ */
/* Pure render(data, meta) functions. Every DATA value goes through
   textContent — calls, sections and counties arrive over RF and over the
   LAN and are untrusted; only static STRINGS skeletons and generated
   numerics are ever assigned as markup. */
/* ------------------------------------------------------------------ */

var $ = function (id) { return document.getElementById(id); };
var metaDone = false;
var lastHeroKey = '';
var clockOffsetMs = 0;
var eventWindow = { start: 0, end: 0 };
var hasBoard = false;      /* a real board has been drawn at least once */
var stationText = '';      /* what the header's station line says while the board is live */
var boardAtMs = 0;         /* host clock of the last good board */
var placeNames = {};       /* code -> name, for the latest contact */
var mapState = null;       /* the county mosaic or chip board, when meta has one */
var globeStarted = false;

function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function modeWord(mode) {
  if (mode === 'PH') return STRINGS.phoneWord;
  if (mode === 'CW') return STRINGS.cwWord;
  return STRINGS.digitalWord;
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

/* Thousands grouped so a four-digit score reads at a glance (1,234). */
function fmtNum(n) {
  var s = String(Math.round(Number(n) || 0));
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fill(template, vals) {
  return template.replace(/\{(\w+)\}/g, function (m, k) {
    return own(vals, k) && vals[k] !== undefined && vals[k] !== null ? String(vals[k]) : '';
  });
}

function fmtDuration(secs) {
  var d = Math.floor(secs / 86400);
  var h = Math.floor((secs % 86400) / 3600);
  var m = Math.floor((secs % 3600) / 60);
  return (d ? d + ' ' + STRINGS.dayShort + ' ' : '') +
    h + ' ' + STRINGS.hourShort + ' ' + pad2(m) + ' ' + STRINGS.minShort;
}

function contestName(kind, fallback) {
  return own(CONTEST_NAMES, kind) ? CONTEST_NAMES[kind] : (fallback || kind || '');
}

/* A Field Day payload (power tiers or objectives) draws the sections globe and the
   bonus list; any other contest draws its multiplier universes. */
function isFieldDay(meta) {
  return meta.scoring_model === 'powered' || meta.scoring_model === 'objectives';
}

/* Shrink-to-fit for the few blocks whose content length the payload decides (a long
   event name, a five-digit score, a dozen positions). Steps a --fit factor down until
   nothing overflows. In a browser that does not lay out (the jsdom suite) every box
   measures zero, so this is a no-op there. */
function fit(node, probe, tall) {
  if (!node) return;
  var boxes = probe ? Array.prototype.slice.call(probe) : [node];
  /* Width for a line of text; height too for a list (`tall`), where rows pile up. */
  var over = function () {
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      if (b.scrollWidth > b.clientWidth + 1) return true;
      if (tall && b.scrollHeight > b.clientHeight + 1) return true;
    }
    return false;
  };
  node.style.setProperty('--fit', '1');
  for (var k = 1; k > 0.5 && over(); k -= 0.06) {
    node.style.setProperty('--fit', (k - 0.06).toFixed(2));
  }
}

/* Static labels, the map, the legend and the bonus/objective skeleton, from
   meta.json (the section universe, the multiplier universes and the menus are
   the RULES DATA — never hardcoded here; the page only ever counts them). */
function renderMeta(meta) {
  $('score-title').textContent = STRINGS.scoreTitle;
  $('qso-title').textContent = STRINGS.qsoTitle;
  $('qso-count-k').textContent = STRINGS.qsosStat;
  $('qso-rate-unit').textContent = STRINGS.perHour;
  $('qso-rate-k').textContent = STRINGS.lastHour;
  $('qso-rate10-unit').textContent = STRINGS.last10;
  $('spark-cap').textContent = STRINGS.hourlyCaption;
  $('bm-title').textContent = STRINGS.bandModeTitle;
  $('pos-title').textContent = STRINGS.positionsTitle;
  $('hero-label').textContent = STRINGS.latestLabel;
  $('stale').textContent = STRINGS.staleBadge;
  $('clock-utc').textContent = STRINGS.utcWord;
  $('notice-kicker').textContent = STRINGS.noticeKicker;

  var name = contestName(meta.event.kind, meta.event.name);
  $('ev-name').textContent = name + ' ' + meta.event.year;
  try { document.title = name + ' · ' + meta.event.call; } catch (e) { /* no title */ }
  eventWindow = { start: meta.event.start_unix, end: meta.event.end_unix };

  var fd = isFieldDay(meta);
  placeNames = {};
  (meta.sections || []).forEach(function (s) { if (!own(placeNames, s.code)) placeNames[s.code] = s.name; });
  (meta.mults || []).forEach(function (m) {
    (m.values || []).forEach(function (v) { if (!own(placeNames, v.code)) placeNames[v.code] = v.name; });
  });

  var legend = $('globe-legend');
  legend.textContent = '';
  var addLeg = function (cls, text) {
    var w = el('div', 'leg' + (cls ? ' ' + cls : ''));
    w.appendChild(el('span', 'dot'));
    w.appendChild(el('span', '', text));
    legend.appendChild(w);
  };
  addLeg('on', STRINGS.legendWorked);
  addLeg('', STRINGS.legendUnworked);

  if (fd) {
    $('sec-title').textContent = STRINGS.sectionsTitle;
    $('framing').textContent = STRINGS.framing;
    $('globe-wrap').className = '';
    $('mult-panel').className = 'panel';
    $('bonus-title').textContent =
      meta.scoring_model === 'objectives' ? STRINGS.objectivesTitle : STRINGS.bonusesTitle;
    mapState = null;
    initGlobe();
    if (!window.__FDBOARD_TEST__ && !globeStarted) {
      globeStarted = true;
      startGlobe();
    }
  } else {
    var m = mapMult(meta);
    $('sec-title').textContent = m ? multLabel(m.id) : STRINGS.multsTitle;
    $('framing').textContent = STRINGS.framingMap;
    $('mult-panel').className = 'panel mults';
    $('bonus-title').textContent = STRINGS.multsTitle;
    if (m && meta.event.section) addLeg('home', STRINGS.legendHome);
    mapState = buildMap(m);
    $('globe-wrap').className = mapState ? mapState.kind : 'chips';
  }

  /* Bonus / objective checklist skeleton: an objectives event's objectives with
     their multipliers, else the bonus menu with its points. */
  var bl = $('bonus-list');
  bl.textContent = '';
  var menu = meta.objectives && meta.objectives.length ? meta.objectives : (meta.bonuses || []);
  menu.forEach(function (b) {
    var row = el('div', 'bonus');
    row.setAttribute('data-id', b.id);
    row.appendChild(el('span', 'tick', '☐'));
    row.appendChild(el('span', '', b.label));
    if (typeof b.multiplier === 'number') row.appendChild(el('span', 'om', '×' + b.multiplier));
    else if (typeof b.points === 'number') row.appendChild(el('span', 'om', '+' + b.points));
    bl.appendChild(row);
  });
  bl.appendChild(el('div', 'bonus-more'));

  metaDone = true;
  fit($('ev-name'));
}

function renderScore(score) {
  var lines = $('score-lines');
  lines.textContent = '';
  var addLine = function (k, v, cls) {
    var row = el('div', 'score-line' + (cls ? ' ' + cls : ''));
    row.appendChild(el('span', 'k', k));
    row.appendChild(el('span', 'v', v));
    lines.appendChild(row);
  };
  $('score-total').textContent = fmtNum(score.total);
  var note = $('score-note');
  note.textContent = score.incomplete ? STRINGS.incompleteNote : '';
  note.className = score.incomplete ? 'on' : '';
  if (score.model === 'objectives') {
    /* WFD: the payload carries no power fields at all, so power math cannot be
       rendered here even by mistake. With its objectives (objective_multiplier
       in the payload) the headline is the CLAIMED total, the sponsor's QSO
       points × (objective multiplier + 1); without them it is the raw QSO
       points, and the ×(n+1) projection is a labelled, provisional secondary. */
    var om = score.objective_multiplier;
    if (typeof om === 'number') {
      $('score-caption').textContent = STRINGS.claimedPoints;
      addLine(STRINGS.objectivesLine, String(score.objectives_claimed || 0));
      addLine(STRINGS.objectiveMultLine, String(om));
      addLine(STRINGS.formulaLine,
        fmtNum(score.qso_points) + ' × (' + om + ' + 1) = ' + fmtNum(score.total), 'wide');
      if (score.bonus_points) addLine(STRINGS.bonusLine, fmtNum(score.bonus_points));
    } else {
      $('score-caption').textContent = STRINGS.rawPoints;
      var n = score.objectives_claimed || 0;
      addLine(STRINGS.objectivesLine, String(n));
      if (score.bonus_points) addLine(STRINGS.bonusLine, fmtNum(score.bonus_points));
      addLine(
        STRINGS.atSubmission,
        fmtNum(score.qso_points) + ' × ' + (n + 1) + ' → ' +
          fmtNum(score.projected_at_submission) + ' ' + STRINGS.projectedWord,
        'provisional wide'
      );
    }
  } else if (score.model === 'multipliers' || score.model === 'points') {
    /* Any other contest: QSO points, the power tier where the ruleset has one,
       times the multiplier total, plus the ticked menu and the bonus stations. */
    $('score-caption').textContent =
      score.model === 'multipliers' ? STRINGS.multipliedPoints : STRINGS.pointsOnly;
    addLine(STRINGS.qsoPointsLine, fmtNum(score.qso_points));
    if (typeof score.power_mult === 'number') addLine(STRINGS.powerLine, '× ' + score.power_mult);
    if (typeof score.mults === 'number') addLine(STRINGS.multsLine, '× ' + fmtNum(score.mults));
    addLine(STRINGS.bonusLine, '+ ' + fmtNum(score.bonus_points));
  } else {
    $('score-caption').textContent = STRINGS.totalPoints;
    addLine(STRINGS.qsoPointsLine, fmtNum(score.qso_points));
    addLine(STRINGS.powerLine, '× ' + score.power_mult);
    addLine(STRINGS.poweredLine, fmtNum(score.powered_points));
    addLine(STRINGS.bonusLine, '+ ' + fmtNum(score.bonus_points));
  }
  fit($('score-total'));
  fit(lines, lines.querySelectorAll('.v'));
}

function renderQsos(qsos) {
  $('qso-count').textContent = fmtNum(qsos.count);
  $('qso-rate').textContent = fmtNum(qsos.rate_hour);
  $('qso-rate10').textContent = fmtNum(qsos.rate_10min);
  ['qso-count', 'qso-rate10'].forEach(function (id) { fit($(id)); });
  /* One bar per hour of the event so far, the hour in progress in the worked
     colour. Generated numerics only, so innerHTML on the <svg> keeps the bars in
     the SVG namespace without naming the namespace URL. */
  var svg = $('sparkline');
  var h = (qsos.hourly || []).slice(-48);
  if (!h.length) { svg.innerHTML = ''; return; }
  var max = Math.max.apply(null, h.concat([1]));
  var w = 100 / h.length;
  var gap = Math.min(w * 0.25, 1.2);
  var bars = h.map(function (v, i) {
    var bh = Math.max(v ? 0.8 : 0, (v / max) * 21);
    return '<rect' + (i === h.length - 1 ? ' class="now"' : '') + ' x="' + (i * w + gap / 2).toFixed(2) +
      '" y="' + (30 - bh).toFixed(2) + '" width="' + Math.max(0.4, w - gap).toFixed(2) +
      '" height="' + bh.toFixed(2) + '"></rect>';
  });
  svg.innerHTML = bars.join('');
  /* The caption sits over the empty top of the chart; on a board too short for both it
     gives way rather than covering the bars. */
  var wrap = $('spark-wrap');
  var u = $('board').clientWidth / 100;
  $('spark-cap').style.display = wrap.clientHeight < 3.2 * u ? 'none' : '';
}

   keeps 'constructor'/'toString' from resolving to something on the
   prototype. A code with no entry — a typo, 'DX', or a section added to
   fd_rules before this table catches up — is a deliberate NO-OP: no pin,
   no arc, silently. DX stations are the honest case: Field Day DX sends
   "DX", which is not a section, and this page has no DXCC table to place
   it by, so it is not placed at all. It still counts everywhere else on
   the board — score, band/mode grid, ticker. */

  var k = String(code === null || code === undefined ? '' : code).toUpperCase();
  return Object.prototype.hasOwnProperty.call(SECTION_LATLON, k) ? SECTION_LATLON[k] : null;
}

/* ---- pure geometry ---------------------------------------------------- */

var DEG = Math.PI / 180;
var TAU = Math.PI * 2;
/* Degrees the north pole tips toward the viewer: North America reads as a
   continent rather than a band along the top edge. */
var TILT_C = Math.cos(18 * DEG);
var TILT_S = Math.sin(18 * DEG);

function norm180(deg) { return ((deg + 540) % 360) - 180; }

/* A lat/lon as a unit vector: x east at lon 0, y north, z toward the viewer
   when lon 0 faces us. Every other routine here works in this frame. */
function unitVec(lat, lon) {
  var f = lat * DEG, l = lon * DEG, cf = Math.cos(f);
  return [cf * Math.sin(l), Math.sin(f), cf * Math.cos(l)];

   is the far side of the sphere and must not be drawn (the back-face cull). */

   on the unit sphere), so an arc follows the path a signal would and not a
   straight line across the screen. */
/* THE slerp — n+1 unit vectors, flat [x,y,z,x,y,z,...], plus the angular
   distance the caller needs for its arc lift.

   ⚠️ ONE COPY ON PURPOSE. `arcPoints` (the test seam) and `buildArc` (what
   actually renders) each carried their own identical loop, so the suite's
   great-circle test guarded a function no production path called: changing
   the interpolation that draws left every test green. Both go through here
   now, so the test covers the maths that reaches the screen.

   Coincident and near-antipodal points both collapse to A rather than
   dividing by ~0. For two ARRL sections neither can happen; it is a
   no-NaN guard, not a claim to handle a true antipode meaningfully. */

  var A = unitVec(a[0], a[1]), B = unitVec(b[0], b[1]);

      s2 = Math.sin(t * d) / sd;

   source of truth in crates/propagation/src/geo.rs (Cooper's declination +
   the equation of time). This page is the THIRD mirror; if the physics
   changes it changes in geo.rs first. Good to about half a degree, which is
   far better than a TV globe needs. */

  var d = new Date(ms);

      var el = xx * s.x + yy * s.y + Math.sqrt(1 - r2) * s.z;
      var a = el >= 0 ? 0 : (el <= -0.31 ? 1 : -el / 0.31);
      px[k] = 2; px[k + 1] = 7; px[k + 2] = 16;
      px[k + 3] = (a * 200) | 0;
    }
  }
  nightCtx.putImageData(nightImg, 0, 0);
  gCtx.save();
  gCtx.beginPath();
  gCtx.arc(cx, cy, R, 0, TAU);
  gCtx.clip();
  gCtx.drawImage(nightCanvas, cx - R, cy - R, R * 2, R * 2);
  gCtx.restore();
}

/* The greyline itself, crisp — the line where the sun is on the horizon.
   Rebuilt once a SECOND (it creeps 0.25 deg a minute); the frame loop only
   turns the cached unit vectors, so this costs no trig per frame. */
var glXyz = null, glAtSec = -1;
function paintGreyline(cx, cy, R, nowMs) {
  var sec = Math.floor(nowMs / 1000), i, u;
  if (sec !== glAtSec || !glXyz) {
    glAtSec = sec;
    var ring = terminatorRing(nowMs, 180);
    glXyz = [];
    for (i = 0; i < ring.length; i++) {
      u = unitVec(ring[i][0], ring[i][1]);
      glXyz.push(u[0], u[1], u[2]);
    }
    glXyz.push(glXyz[0], glXyz[1], glXyz[2]); /* close the ring */
  }
  gCtx.beginPath();
  var started = false;
  for (i = 0; i + 2 < glXyz.length; i += 3) {
    var v = rotXyz(glXyz[i], glXyz[i + 1], glXyz[i + 2]);
    if (v.z <= 0) { started = false; continue; }
    if (started) gCtx.lineTo(cx + v.x * R, cy - v.y * R);
    else { gCtx.moveTo(cx + v.x * R, cy - v.y * R); started = true; }
  }
  gCtx.lineWidth = 1.4;
  gCtx.strokeStyle = 'rgba(255,196,120,0.50)';
  gCtx.stroke();
}

/* 85 pins a frame — never the QSO list. Lit is worked, dim is not yet. */
function paintPins(cx, cy, R) {
  var dim = Math.max(1.3, R * 0.009);
  var big = Math.max(2.2, R * 0.017);
  var i, v, lit, fade, sx, sy;
  for (i = 0; i < PIN_CODE.length; i++) {
    v = rotXyz(PIN_XYZ[3 * i], PIN_XYZ[3 * i + 1], PIN_XYZ[3 * i + 2]);
    if (v.z <= 0.01) continue;
    fade = Math.min(1, v.z * 7); /* fade in at the limb instead of popping */
    sx = cx + v.x * R; sy = cy - v.y * R;
    lit = Object.prototype.hasOwnProperty.call(LIT, PIN_CODE[i]);
    if (lit) {
      gCtx.beginPath();
      gCtx.arc(sx, sy, big * 2.6, 0, TAU);
      gCtx.fillStyle = 'rgba(47,208,122,' + (0.14 * fade).toFixed(3) + ')';
      gCtx.fill();
    }
    gCtx.beginPath();
    gCtx.arc(sx, sy, lit ? big : dim, 0, TAU);
    gCtx.fillStyle = lit
      ? 'rgba(70,232,144,' + fade.toFixed(3) + ')'
      : 'rgba(146,168,188,' + (0.42 * fade).toFixed(3) + ')';
    gCtx.fill();
  }

  if (HOME) {
    var h = project(HOME[0], HOME[1], rotDeg);
    if (h.z > 0.01) {
      gCtx.beginPath();
      gCtx.arc(cx + h.x * R, cy - h.y * R, big * 1.5, 0, TAU);
      gCtx.lineWidth = 2;
      gCtx.strokeStyle = 'rgba(76,194,255,' + Math.min(1, h.z * 7).toFixed(3) + ')';
      gCtx.stroke();
    }
  }
}

/* At most ARC_MAX short polylines — the arcs are the only per-contact work
   the frame loop ever does, and they expire. */
function paintArcs(cx, cy, R, nowMs) {
  for (var a = ARCS.length - 1; a >= 0; a--) {
    var arc = ARCS[a];
    var age = (nowMs - arc.born) / 1000;
    if (age < 0 || age > ARC_LIFE_S) { ARCS.splice(a, 1); continue; }
    var grow = Math.min(1, age / ARC_DRAW_S);
    var alpha = age <= ARC_DRAW_S ? 1 : 1 - (age - ARC_DRAW_S) / (ARC_LIFE_S - ARC_DRAW_S);
    var last = Math.max(1, Math.round(grow * arc.n));
    var hx = 0, hy = 0, haveHead = false;
    for (var pass = 0; pass < 2; pass++) {
      gCtx.beginPath();
      var started = false;
      for (var i = 0; i <= last; i++) {
        var v = rotXyz(arc.xyz[3 * i], arc.xyz[3 * i + 1], arc.xyz[3 * i + 2]);
        if (v.z <= 0) { started = false; continue; }
        var r = arc.rad[i] * R;
        var sx = cx + v.x * r, sy = cy - v.y * r;
        if (started) gCtx.lineTo(sx, sy);
        else { gCtx.moveTo(sx, sy); started = true; }
        if (i === last) { hx = sx; hy = sy; haveHead = true; }
      }
      gCtx.lineCap = 'round';
      gCtx.lineWidth = pass === 0 ? Math.max(7, R * 0.05) : Math.max(2.4, R * 0.017);
      gCtx.globalAlpha = (pass === 0 ? 0.22 : 1) * alpha;
      gCtx.strokeStyle = arc.color;
      gCtx.stroke();
    }
    if (haveHead && grow < 1) {
      gCtx.globalAlpha = alpha;
      gCtx.fillStyle = arc.color;
      gCtx.beginPath();
      gCtx.arc(hx, hy, Math.max(6, R * 0.038), 0, TAU);
      gCtx.globalAlpha = 0.25 * alpha;
      gCtx.fill();
      gCtx.beginPath();
      gCtx.arc(hx, hy, Math.max(2.6, R * 0.017), 0, TAU);
      gCtx.globalAlpha = alpha;
      gCtx.fill();
    }

       beat between "an arc fired" and "that pin is lit from now on". */
    if (grow >= 1) {
      var e = rotXyz(arc.end[0], arc.end[1], arc.end[2]);
      if (e.z > 0) {
        var t = (age - ARC_DRAW_S) / (ARC_LIFE_S - ARC_DRAW_S);
        gCtx.beginPath();

        gCtx.lineWidth = Math.max(2, R * 0.014);

        gCtx.stroke();

  }

   second here, which is also what heals a boot that ran before layout. */

  window.requestAnimationFrame(globeFrame);

  var dt = lastFrameMs ? (ts - lastFrameMs) / 1000 : 0;
  lastFrameMs = ts;
  var sec = Math.floor(ts / 1000);
  if (sec !== lastSizeSec) { lastSizeSec = sec; sizeGlobe(); }
  rotDeg = (rotDeg + ROT_DEG_PER_S * Math.min(dt, 0.5)) % 360;
  paintGlobe(Date.now() + clockOffsetMs);

function startGlobe() {
  initGlobe();

       above. The terminator still creeps, so repaint once a minute — nothing
       a viewer would see move. */
    paintGlobe(Date.now() + clockOffsetMs);

    worked.length + ' ' + STRINGS.ofWord + ' ' + meta.sections.length;

}

function globeSnapshot() {
  var lit = [], k;
  for (k in LIT) { if (Object.prototype.hasOwnProperty.call(LIT, k)) lit.push(k); }
  lit.sort();
  return { lit: lit, home: HOME, arcs: ARCS.length, fired: arcsFired, seeded: seeded };

   county list shows the chip board rather than a map with a hole in it. */
var MAP_LAYOUTS = [IL_COUNTIES];

/* Cut one polygon to the half-plane of points no farther from the point a than
   from the point b — the Sutherland-Hodgman step against their bisector. The
   bisector passes through (mx, my) at right angles to (dx, dy) = b - a. */

   narrow enough that the border counties end near the state line. */

/* The mosaic of a {code: [lat, lon]} table, one convex cell per code, sorted by code.
   Equal degrees both ways (x east, y south) rather than true scale: the state reads a
   little wider than it is, and every county gets room for its code. */

  var codes = Object.keys(centres).sort(), i, j, k;
  var pts = codes.map(function (c) { return [centres[c][1], -centres[c][0]]; });
  var cells = [], x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (i = 0; i < pts.length; i++) {
    var poly = [];
    for (k = 0; k < 40; k++) {
      var a = (k / 40) * TAU;
      poly.push([pts[i][0] + MOSAIC_R * Math.cos(a), pts[i][1] + MOSAIC_R * Math.sin(a)]);
    }
    for (j = 0; j < pts.length && poly.length; j++) {
      if (j === i) continue;
      var dx = pts[j][0] - pts[i][0], dy = pts[j][1] - pts[i][1];
      if (dx * dx + dy * dy > 4 * MOSAIC_R * MOSAIC_R) continue; /* too far to cut it */
      poly = clipHalfPlane(poly, (pts[i][0] + pts[j][0]) / 2, (pts[i][1] + pts[j][1]) / 2, dx, dy);
    }
    cells.push(poly);
    for (k = 0; k < poly.length; k++) {

      y0 = Math.min(y0, poly[k][1]); y1 = Math.max(y1, poly[k][1]);

function cellCentroid(poly) {

    var w = p[0] * q[1] - q[0] * p[1];
    a += w; cx += (p[0] + q[0]) * w; cy += (p[1] + q[1]) * w;

    if (Math.abs(c) < 1e-12) continue;

    sign = s;

/* The length of the line through c, horizontal (axis 0) or vertical (axis 1), inside a

function chord(poly, c, axis) {
  var lo = Infinity, hi = -Infinity, o = 1 - axis;
  for (var k = 0; k < poly.length; k++) {
    var p = poly[k], q = poly[(k + 1) % poly.length];
    if ((p[o] - c[o]) * (q[o] - c[o]) > 0 || p[o] === q[o]) continue;
    var t = (c[o] - p[o]) / (q[o] - p[o]);

      if (on && own(fresh, code) && !own(mapState.lit, code)) cls += ' fresh';
      paths[i].setAttribute('class', cls);
      paths[i].setAttribute('stroke-width', code === home ? '0.034' : '0.016');
      if (texts[i]) texts[i].setAttribute('class', on ? 'on' : '');
    }
  } else {
    var chips = $('chipmap').querySelectorAll('.chip');
    for (i = 0; i < chips.length; i++) {
      var c = chips[i].getAttribute('data-code');
      var hit = own(lit, String(c).toUpperCase());
      if (hit) count += 1;
      chips[i].className = 'chip' + (hit ? ' on' : '');
    }
    fit($('chipmap'), null, true);
  }
  mapState.lit = lit;
  mapState.seeded = true;
  $('sec-count').textContent = mapState.size
    ? count + ' ' + STRINGS.ofWord + ' ' + mapState.size
    : String(worked.length);
}

function mapSnapshot() {
  if (!mapState) return null;
  var lit = Object.keys(mapState.lit).sort();
  return { kind: mapState.kind, id: mapState.id, size: mapState.size, lit: lit };
}

/* The line score: one column per band worked, longest wavelength first, a row per
   mode class and a total row. */
function renderBandMode(rows) {
  var head = $('bm-head');
  head.textContent = '';
  head.appendChild(el('th', '', ''));
  rows.forEach(function (r) { head.appendChild(el('th', '', r.band)); });
  head.appendChild(el('th', '', STRINGS.totalCol));
  var body = $('bm-body');
  body.textContent = '';
  [['ph', STRINGS.phoneCol], ['cw', STRINGS.cwCol], ['dig', STRINGS.digitalCol]].forEach(function (m) {
    var tr = document.createElement('tr');
    tr.appendChild(el('th', '', m[1]));
    var sum = 0;
    rows.forEach(function (r) {
      var v = Number(r[m[0]]) || 0;
      sum += v;
      tr.appendChild(el('td', v ? '' : 'z', fmtNum(v)));
    });
    tr.appendChild(el('td', sum ? '' : 'z', fmtNum(sum)));
    body.appendChild(tr);
  });
  var tot = document.createElement('tr');
  tot.className = 'total';
  tot.appendChild(el('th', '', STRINGS.totalCol));
  var all = 0;
  rows.forEach(function (r) {
    var v = (Number(r.ph) || 0) + (Number(r.cw) || 0) + (Number(r.dig) || 0);
    all += v;
    tot.appendChild(el('td', '', fmtNum(v)));
  });
  tot.appendChild(el('td', '', fmtNum(all)));
  body.appendChild(tot);
  fit($('bm-table'), $('bm-table').querySelectorAll('th, td'));
}

function renderPositions(positions) {
  var list = $('pos-list');
  list.textContent = '';
  positions.forEach(function (p) {
    var row = el('div', 'pos-row');
    /* WHERE THIS POSITION IS RIGHT NOW. Presence, not log history: a club
       running several stations needs to see who is on which band without
       walking the site. The host decides when a reading has expired (it owns
       the sockets and the clock) and says so with `stale`; the page only
       draws it. A position that has never reported shows a dash rather than
       an invented band. */
    var where = el('div', 'pos-where' + (p.stale ? ' stale' : ''));
    if (p.band) where.style.setProperty('--band', bandColor(p.band));
    where.appendChild(el('div', 'pos-band', p.band || '—'));
    where.appendChild(el('div', 'pos-mode', p.mode || ''));
    row.appendChild(where);
    var who = el('div', 'pos-who');
    who.appendChild(el('div', 'pos-label', p.label));
    if (p.operator) who.appendChild(el('div', 'pos-op', STRINGS.opWord + ' ' + p.operator));
    row.appendChild(who);
    var nums = el('div', 'pos-nums');
    nums.appendChild(el('div', 'q', p.qsos_raw + ' ' + STRINGS.qsosWord));
    var pts = el('div', 'p');
    pts.appendChild(el('b', '', String(p.points)));
    pts.appendChild(document.createTextNode(' ' + STRINGS.ptsWord));
    nums.appendChild(pts);
    row.appendChild(nums);
    list.appendChild(row);
  });
  fit(list, null, true);
}

function renderBonuses(claimed) {
  var have = {};
  claimed.forEach(function (id) { have[id] = true; });
  var rows = $('bonus-list').querySelectorAll('.bonus');
  for (var i = 0; i < rows.length; i++) {
    var id = rows[i].getAttribute('data-id');
    var tick = rows[i].querySelector('.tick');
    if (have[id]) { rows[i].classList.add('claimed'); tick.textContent = '☑'; }
    else { rows[i].classList.remove('claimed'); tick.textContent = '☐'; }
  }
  /* The TV lists what has been CLAIMED; the rest of the menu is one line, so a long
     menu (ARRL Field Day's sixteen) never crowds out the board. */
  var open = rows.length - $('bonus-list').querySelectorAll('.bonus.claimed').length;
  var more = $('bonus-list').querySelector('.bonus-more');
  if (more) more.textContent = open ? fill(STRINGS.moreOpen, { n: open }) : '';
  fit($('mult-panel'), [$('bonus-list')], true);
}

/* The multiplier universes of any contest but the Field Days: each one's count (the
   scorer's own, caps applied), how many it could be when the universe is the map's,
   its cap, and the bonus stations worked. */
function renderMults(data, meta) {
  var list = $('mult-list');
  list.textContent = '';
  var rows = {};
  (data.mults || []).forEach(function (m) { rows[m.id] = m; });
  var total = data.score && typeof data.score.mults === 'number' ? data.score.mults : null;
  $('bonus-title').textContent = STRINGS.multsTitle + (total === null ? '' : ' · ' + fmtNum(total));
  (meta.mults || []).forEach(function (m) {
    var d = own(rows, m.id) ? rows[m.id] : { count: 0, worked: [] };
    var row = el('div', 'mult-row');
    row.setAttribute('data-id', m.id);
    row.appendChild(el('div', 'mult-k', multLabel(m.id)));
    var v = el('div', 'mult-v', fmtNum(d.count));
    var whole = mapState && mapState.id === m.id && mapState.size ? mapState.size : 0;
    if (whole) v.appendChild(el('span', 'of', STRINGS.ofWord + ' ' + whole));
    else if (typeof m.cap === 'number') v.appendChild(el('span', 'of', STRINGS.maxWord + ' ' + m.cap));
    row.appendChild(v);
    if (whole) {
      var bar = el('div', 'mult-bar');
      var fillBar = el('span');
      fillBar.style.width = Math.min(100, (100 * (Number(d.count) || 0)) / whole).toFixed(1) + '%';
      bar.appendChild(fillBar);
      row.appendChild(bar);
    }
    list.appendChild(row);
  });
  var st = data.bonus_stations || [];
  if (st.length) {
    var line = el('div', 'mult-stations');
    line.appendChild(el('span', 'st-k', STRINGS.bonusStationsLine + ' '));
    st.forEach(function (s) {
      line.appendChild(el('span', 'st' + (s.worked ? ' on' : ''), (s.worked ? '✓' : '') + s.call));
    });
    list.appendChild(line);
  }
  fit($('mult-panel'), [list], true);
}

function placeName(code) {
  return own(placeNames, code) ? placeNames[code] : code;
}

function renderTicker(ticker) {
  var hero = $('hero');
  hero.textContent = '';
  if (!ticker.length) {
    hero.appendChild(el('span', 'attr', STRINGS.waitingFirst));
    $('recent').textContent = '';
    return;
  }
  var t = ticker[0];
  var key = t.when_unix + '|' + t.call;
  hero.appendChild(el('span', 'call', t.call));
  hero.appendChild(document.createTextNode(
    (t.section ? ' · ' + placeName(t.section) : '') +
    ' · ' + t.band + ' ' + (t.submode || modeWord(t.mode)) + ' '
  ));
  hero.appendChild(el('span', 'attr',
    '· ' + t.position + (t.operator ? ' (' + t.operator + ')' : '')));
  if (key !== lastHeroKey) {
    lastHeroKey = key;
    hero.classList.remove('flash');
    void hero.offsetWidth; /* restart the highlight animation */
    hero.classList.add('flash');
  }
  /* Before that: as many earlier contacts as fit whole, never one cut in half. */
  var recent = $('recent');
  var items = ticker.slice(1, 7).map(function (q) {
    return q.call + (q.section ? ' ' + q.section : '') + ' ' + q.band;
  });
  recent.textContent = items.join('  ·  ');
  while (items.length > 1 && recent.scrollWidth > recent.clientWidth + 1) {
    items.pop();
    recent.textContent = items.join('  ·  ');
  }
  fit(hero);
}

/* The composite render — everything from one data.json + one meta.json. */
function render(data, meta) {
  if (!metaDone) renderMeta(meta);
  hasBoard = true;
  boardAtMs = (Number(data.now_unix) || 0) * 1000;
  var fd = isFieldDay(meta);
  stationText = fd
    ? data.event.call + ' — ' + data.event.class + ', ' + data.event.section
    : data.event.call + (data.event.section ? ' — ' + placeName(data.event.section) : '');
  $('ev-station').textContent = stationText;
  $('ev-station').className = '';
  eventWindow = { start: data.event.start_unix, end: data.event.end_unix };
  renderScore(data.score);
  renderQsos(data.qsos);
  if (fd) {
    renderGlobe(data, meta);
    renderBonuses(data.claimed || []);
  } else {
    renderMap(data, meta);
    renderMults(data, meta);
  }
  renderBandMode(data.band_mode || []);
  renderPositions(data.positions || []);
  renderTicker(data.ticker || []);
}

function setStale(on) {
  $('stale').textContent = STRINGS.staleBadge;
  $('stale').className = on ? 'on' : '';
}

/* Why there is no board here, by the reason the server gives, in plain words and
   with what to do. A problem reaching the host keeps the last board on screen with a
   warning in its header; everything else is a notice of its own, with the clock still
   running, so the TV is never just a dead overlay. */
var NOTICES = {
  'no-club': ['noticeNoClubTitle', 'noticeNoClubBody', 'noticeNoClubDo'],
  'refused': ['noticeRefusedTitle', 'noticeRefusedBody', 'noticeRefusedDo'],
  'club-starting': ['noticeStartingTitle', 'noticeStartingBody', 'noticeStartingDo'],
  'club-session': ['noticeSessionTitle', 'noticeSessionBody', 'noticeSessionDo'],
  'no-ruleset': ['noticeRulesTitle', 'noticeRulesBody', 'noticeRulesDo'],
  'host-unreachable': ['noticeUnreachableTitle', 'noticeUnreachableBody', 'noticeUnreachableDo', 1],
  'host-no-board': ['noticeNoBoardTitle', 'noticeNoBoardBody', 'noticeNoBoardDo', 1],
  'host-idle': ['noticeHostIdleTitle', 'noticeHostIdleBody', 'noticeHostIdleDo', 1],
  'host-bad-reply': ['noticeBadReplyTitle', 'noticeBadReplyBody', 'noticeBadReplyDo', 1]
};

function noticeFor(info) {
  var n = own(NOTICES, info.reason)
    ? NOTICES[info.reason]
    : ['noticeGenericTitle', 'noticeGenericBody', 'noticeNoClubDo'];
  var vals = {
    host: info.host || '',
    why: info.detail || '',
    contest: contestName(info.contest, info.contest)
  };
  return {
    title: fill(STRINGS[n[0]], vals),
    body: fill(STRINGS[n[1]], vals),
    todo: fill(STRINGS[n[2]], vals),
    keepBoard: n[3] === 1
  };
}

function hhmm(ms) {
  var d = new Date(ms);
  return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
}

function setInactive(on, info) {
  var box = $('inactive');
  var station = $('ev-station');
  if (station.className === 'warn') {
    station.className = '';
    station.textContent = stationText;
  }
  if (!on) {
    box.className = '';
    return;
  }
  info = info || {};
  var n = noticeFor(info);
  if (n.keepBoard && hasBoard) {
    box.className = '';
    station.textContent = fill(STRINGS.hostLostBanner, { host: info.host || '', at: hhmm(boardAtMs) });
    station.className = 'warn';
    return;
  }
  $('notice-kicker').textContent = STRINGS.noticeKicker;
  $('notice-title').textContent = n.title;
  $('notice-body').textContent = n.body;
  $('notice-do').textContent = n.todo;
  $('notice-where').textContent = info.host || '';
  box.className = 'on';
}

/* UTC clock + time left, off the host's clock (now_unix from the last poll
   corrects the TV's own drift). */
function tickClock() {
  var now = new Date(Date.now() + clockOffsetMs);
  var hms = pad2(now.getUTCHours()) + ':' + pad2(now.getUTCMinutes()) + ':' + pad2(now.getUTCSeconds());
  $('clock').textContent = hms;
  $('notice-clock').textContent = hms + ' ' + STRINGS.utcWord;
  var s = Math.floor(now.getTime() / 1000);
  var label = '';
  var pct = 0;
  var soon = false;
  if (eventWindow.end > eventWindow.start) {
    if (s < eventWindow.start) {
      label = STRINGS.startsIn + ' ' + fmtDuration(eventWindow.start - s);
    } else if (s < eventWindow.end) {
      label = STRINGS.endsIn + ' ' + fmtDuration(eventWindow.end - s);
      pct = ((s - eventWindow.start) / (eventWindow.end - eventWindow.start)) * 100;
      soon = eventWindow.end - s < 3600;
    } else {
      label = STRINGS.endedWord;
      pct = 100;
    }
  }
  $('time-label').textContent = label;
  $('time-label').className = soon ? 'soon' : '';
  $('timebar-fill').style.width = pct.toFixed(2) + '%';
}

/* ------------------------------------------------------------------ */
/* Liveness: 3 s polling with the rev counter. A failed poll keeps the
   last good board; three misses show the stale badge; recovery is
   automatic — no user action ever required on the TV. Self-rescheduling
   setTimeout, so browser throttling cannot pile requests up. */
/* ------------------------------------------------------------------ */

var META = null;
var lastRev = -1;
var misses = 0;

function poll() {
  fetch('/scoreboard/data.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(function (data) {
      misses = 0;
      setStale(false);
      if (data.active === false) {
        setInactive(true, data);
        return;
      }
      /* The club changed contest (a host restarts its club when its picker moves):
         start again from that contest's meta, with nothing of the old board kept. */
      if (META && META.event && data.event &&
          (data.event.kind !== META.event.kind || data.event.start_unix !== META.event.start_unix)) {
        window.location.reload();
        return;
      }
      setInactive(false);
      clockOffsetMs = data.now_unix * 1000 - Date.now();
      if (data.rev !== lastRev) {
        lastRev = data.rev;
        render(data, META);
      }
    })
    .catch(function () {
      misses += 1;
      if (misses >= 3) setStale(true);
    })
    .then(function () { setTimeout(poll, 3000); });
}

function loadMeta() {
  fetch('/scoreboard/meta.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (meta) {
      if (meta.active === false) {
        setInactive(true, meta);
        setTimeout(loadMeta, 3000);
        return;
      }
      META = meta;
      renderMeta(meta);
      poll();
    })
    .catch(function () { setTimeout(loadMeta, 3000); });
}

/* ?theme=light, ?theme=auto (the TV's own setting), else dark. */
function applyTheme() {
  var q = '';
  try { q = String(window.location.search || ''); } catch (e) { q = ''; }
  var m = /[?&]theme=(light|dark|auto)(?:&|$)/.exec(q);
  var want = m ? m[1] : 'dark';
  var root = document.documentElement;
  if (want === 'auto' && typeof window.matchMedia === 'function') {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    root.setAttribute('data-theme', mq.matches ? 'light' : 'dark');
    if (mq && typeof mq.addEventListener === 'function') {
      mq.addEventListener('change', function (e) {
        root.setAttribute('data-theme', e.matches ? 'light' : 'dark');
      });
    }
    return;
  }
  root.setAttribute('data-theme', want === 'light' ? 'light' : 'dark');
}
applyTheme();

/* Test seam: the jsdom suite sets __FDBOARD_TEST__ and drives the pure
   render functions directly — no network, no timers. */
window.__fdboard = {
  STRINGS: STRINGS,
  CONTEST_NAMES: CONTEST_NAMES,
  render: render,
  renderMeta: renderMeta,
  setStale: setStale,
  setInactive: setInactive,
  tickClock: tickClock,
  /* The globe's PURE half — geometry and state, no canvas required, so the
     jsdom suite can check the maths and the arc bookkeeping exactly. */
  globe: {
    SECTION_LATLON: SECTION_LATLON,
    sectionLatLon: sectionLatLon,
    bandColor: bandColor,
    project: project,
    arcPoints: arcPoints,
    subsolarPoint: subsolarPoint,
    terminatorRing: terminatorRing,
    contactKey: contactKey,
    landRingCount: function () { return decodeLand(LAND_RAW).length; },
    snapshot: globeSnapshot
  },
  /* The county mosaic's pure half, the same way. */
  map: {
    IL_COUNTIES: IL_COUNTIES,
    MAP_LAYOUTS: MAP_LAYOUTS,
    pickLayout: pickLayout,
    buildMosaic: buildMosaic,
    inCell: inCell,
    snapshot: mapSnapshot
  }
};
if (!window.__FDBOARD_TEST__) {
  loadMeta();
  setInterval(tickClock, 1000);
  tickClock();
}
</script>
</body>
</html>
