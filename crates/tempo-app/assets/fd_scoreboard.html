<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Day Scoreboard</title>
<style>
/* Field Day spectator scoreboard — one self-contained page, served by the host
   Nexus over the LAN. Dark, high-contrast, sized for a 16:9 TV read across a
   room: fluid clamp() typography, all four blocks visible at once (a spectator
   who glances up must find the block where it was — nothing auto-cycles).
   No external reference of any kind lives in this file (a Rust test pins it). */
:root {
  --bg: #0b0f14;
  --panel: #121924;
  --panel-2: #0e141d;
  --line: #26303d;
  --text: #e8eef5;
  --dim: #93a1b0;
  --faint: #5c6a78;
  --accent: #4cc2ff;
  --lit: #2fd07a;
  --lit-bg: #10321f;
  --warn: #ffb454;
  --hot: #ff6a5e;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}
#board {
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: clamp(6px, 0.8vh, 12px);
  padding: clamp(8px, 1vw, 18px);
}

/* ---- header ---- */
#hdr {
  display: flex;
  align-items: baseline;
  gap: clamp(10px, 1.5vw, 28px);
  border-bottom: 1px solid var(--line);
  padding-bottom: clamp(4px, 0.6vh, 10px);
}
#ev-name { font-size: clamp(20px, 2.6vw, 44px); font-weight: 800; letter-spacing: 0.02em; }
#ev-station { font-size: clamp(14px, 1.5vw, 26px); color: var(--dim); font-family: var(--mono); }
#hdr-right { margin-left: auto; text-align: right; }
#clock { font-size: clamp(18px, 2vw, 34px); font-family: var(--mono); font-weight: 700; }
#time-label { font-size: clamp(11px, 1vw, 18px); color: var(--dim); }
#timebar { height: clamp(4px, 0.5vh, 8px); background: var(--panel); border-radius: 4px; margin-top: 4px; overflow: hidden; }
#timebar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 1s linear; }

/* ---- main grid ---- */
#main {
  display: grid;
  grid-template-columns: minmax(220px, 1.15fr) minmax(0, 2.1fr) minmax(220px, 1.45fr);
  gap: clamp(6px, 0.8vw, 14px);
  min-height: 0;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: clamp(8px, 1vw, 16px);
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.panel h2 {
  font-size: clamp(10px, 0.9vw, 16px);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: clamp(4px, 0.6vh, 10px);
}
#col-left, #col-right { display: flex; flex-direction: column; gap: clamp(6px, 0.8vh, 14px); min-height: 0; }
#col-center { display: flex; flex-direction: column; gap: clamp(6px, 0.8vh, 14px); min-height: 0; }

/* score */
#score-total { font-size: clamp(40px, 5.5vw, 110px); font-weight: 800; font-family: var(--mono); line-height: 1.05; }
#score-caption { color: var(--dim); font-size: clamp(11px, 1vw, 18px); margin-bottom: clamp(4px, 0.8vh, 12px); }
.score-line { display: flex; justify-content: space-between; font-size: clamp(12px, 1.1vw, 20px); padding: 2px 0; }
.score-line .k { color: var(--dim); }
.score-line .v { font-family: var(--mono); font-weight: 700; }
.score-line.provisional .k, .score-line.provisional .v { color: var(--warn); }
#qso-stats { display: flex; gap: clamp(8px, 1vw, 18px); align-items: baseline; }
#qso-count { font-size: clamp(24px, 2.6vw, 48px); font-weight: 800; font-family: var(--mono); }
.qso-sub { color: var(--dim); font-size: clamp(11px, 1vw, 18px); }
#sparkline { width: 100%; height: clamp(30px, 5vh, 70px); margin-top: 4px; }
#sparkline polyline { fill: none; stroke: var(--accent); stroke-width: 2; }
#sparkline .fill { fill: rgba(76, 194, 255, 0.15); stroke: none; }

/* the globe — the sections display: one pin per ARRL/RAC section, lit as it
   is reached, readable from the far side of a tent. Everything visual about
   it is painted on the canvas; the CSS only gives it a box to fill. */
#sec-head { display: flex; align-items: baseline; gap: clamp(6px, 0.8vw, 14px); flex-wrap: wrap; }
#sec-count { font-family: var(--mono); font-weight: 800; font-size: clamp(16px, 1.8vw, 32px); color: var(--accent); }
#globe-legend { margin-left: auto; display: flex; gap: clamp(8px, 1vw, 18px); font-size: clamp(9px, 0.8vw, 14px); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.leg { display: flex; align-items: center; gap: 5px; }
.leg .dot { width: clamp(7px, 0.6vw, 11px); height: clamp(7px, 0.6vw, 11px); border-radius: 50%; background: var(--faint); }
.leg.on { color: var(--lit); }
.leg.on .dot { background: var(--lit); box-shadow: 0 0 8px rgba(47, 208, 122, 0.6); }
#globe-wrap { flex: 1; min-height: 0; position: relative; margin-top: clamp(2px, 0.5vh, 8px); }
/* ⚠️ THE GLOBE MUST NOT SHRINK AS THE EVENT FILLS UP. It used to be `flex: 3` beside a
   content-sized band table with no flex of its own, so the table took its full height first
   and the globe lived on the remainder: measured 592px tall at two worked bands and 246px at
   thirteen. Every stroke width derives from the globe's radius and clamps to a floor, so at
   hour 22 — every band worked, the fullest and most impressive the board ever gets — the pins
   bottomed out around 1.3px and a spectator six metres away saw nothing. Exactly backwards.
   The globe now claims a hard floor of most of the column and the band table takes what is
   left, scrolling inside itself rather than pushing the globe down.

   MEASURED, headless Chrome at 1920x1080, --force-device-scale-factor=1, globe RADIUS by
   number of worked bands — before this rule, then after:
       2 bands   R 290 -> 396
       8 bands   R 195 -> 301
      13 bands   R 117 -> 287     (every band worked: the fullest the board ever is)
   At R=287 none of the stroke widths clamp to their floors any more, and the band table still
   shows all thirteen rows by scrolling itself. The column does not overflow and the page never
   scrolls sideways at any of the three. */
#globe-panel { flex: 1 1 auto; min-height: min(58vh, 620px); }
#bm-panel { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* band × mode */
#bm-table { width: 100%; border-collapse: collapse; font-size: clamp(11px, 1.05vw, 20px); }
#bm-table th, #bm-table td { text-align: right; padding: clamp(1px, 0.3vh, 5px) clamp(4px, 0.6vw, 12px); font-family: var(--mono); }
#bm-table th { color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: clamp(9px, 0.8vw, 14px); }
#bm-table th:first-child, #bm-table td:first-child { text-align: left; }
#bm-table td { border-top: 1px solid var(--line); }
#bm-table td.z { color: var(--faint); }
#bm-table td.total { color: var(--accent); font-weight: 800; }

/* positions */
.pos-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: clamp(3px, 0.5vh, 8px) 0; border-bottom: 1px solid var(--line); }
.pos-label { font-weight: 700; font-size: clamp(12px, 1.15vw, 22px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos-op { color: var(--dim); font-family: var(--mono); font-size: clamp(10px, 0.9vw, 16px); }
.pos-nums { text-align: right; font-family: var(--mono); font-size: clamp(11px, 1vw, 19px); }
.pos-nums b { color: var(--accent); }

/* bonuses / objectives */
#bonus-list { overflow: hidden; }
.bonus { display: flex; align-items: center; gap: 6px; font-size: clamp(10px, 0.95vw, 17px); padding: 1px 0; color: var(--faint); }
.bonus .tick { width: clamp(10px, 0.9vw, 16px); text-align: center; font-weight: 800; }
.bonus.claimed { color: var(--text); }
.bonus.claimed .tick { color: var(--lit); }

/* footer / ticker */
#ftr { border-top: 1px solid var(--line); padding-top: clamp(4px, 0.6vh, 10px); }
#hero-label { font-size: clamp(9px, 0.8vw, 14px); color: var(--faint); letter-spacing: 0.12em; text-transform: uppercase; }
#hero { font-size: clamp(18px, 2.2vw, 40px); font-weight: 800; font-family: var(--mono); }
#hero .call { color: var(--accent); }
#hero .attr { color: var(--dim); font-weight: 600; font-size: 0.7em; }
#hero.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { color: var(--lit); } 100% { color: var(--text); } }
#recent { font-family: var(--mono); color: var(--dim); font-size: clamp(10px, 0.95vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
#framing { color: var(--faint); font-size: clamp(10px, 0.95vw, 16px); margin-top: clamp(2px, 0.4vh, 6px); }

/* status overlays */
#stale {
  display: none;
  position: fixed; top: clamp(8px, 1vh, 16px); right: clamp(8px, 1vw, 16px);
  background: var(--hot); color: #14090b; font-weight: 800;
  padding: 4px 12px; border-radius: 6px; font-size: clamp(11px, 1vw, 18px);
}
#stale.on { display: block; }
#inactive {
  display: none;
  position: fixed; inset: 0; background: rgba(11, 15, 20, 0.92);
  align-items: center; justify-content: center; text-align: center;
  font-size: clamp(18px, 2.4vw, 40px); color: var(--dim); padding: 10vw;
}
#inactive.on { display: flex; }
</style>
</head>
<body>
<div id="board">
  <div id="hdr">
    <div id="ev-name"></div>
    <div id="ev-station"></div>
    <div id="hdr-right">
      <div><span id="clock"></span> <span id="clock-utc"></span></div>
      <div id="time-label"></div>
      <div id="timebar"><div id="timebar-fill"></div></div>
    </div>
  </div>
  <div id="main">
    <div id="col-left">
      <div class="panel">
        <h2 id="score-title"></h2>
        <div id="score-total">0</div>
        <div id="score-caption"></div>
        <div id="score-lines"></div>
      </div>
      <div class="panel">
        <h2 id="qso-title"></h2>
        <div id="qso-stats">
          <div id="qso-count">0</div>
          <div class="qso-sub"><span id="qso-rate">0</span><span id="qso-rate-unit"></span></div>
          <div class="qso-sub"><span id="qso-rate10">0</span> <span id="qso-rate10-unit"></span></div>
        </div>
        <svg id="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
      </div>
    </div>
    <div id="col-center">
      <div class="panel" id="globe-panel">
        <div id="sec-head"><h2 id="sec-title"></h2><span id="sec-count"></span><div id="globe-legend"></div></div>
        <div id="globe-wrap"><canvas id="globe"></canvas></div>
      </div>
      <div class="panel" id="bm-panel">
        <h2 id="bm-title"></h2>
        <table id="bm-table">
          <thead><tr>
            <th id="bm-h-band"></th><th id="bm-h-ph"></th><th id="bm-h-cw"></th>
            <th id="bm-h-dig"></th><th id="bm-h-total"></th>
          </tr></thead>
          <tbody id="bm-body"></tbody>
        </table>
      </div>
    </div>
    <div id="col-right">
      <div class="panel" style="flex: 1.3;">
        <h2 id="pos-title"></h2>
        <div id="pos-list"></div>
      </div>
      <div class="panel">
        <h2 id="bonus-title"></h2>
        <div id="bonus-list"></div>
      </div>
    </div>
  </div>
  <div id="ftr">
    <div id="hero-label"></div>
    <div id="hero"></div>
    <div id="recent"></div>
    <div id="framing"></div>
  </div>
</div>
<div id="stale"></div>
<div id="inactive"></div>
<script>
'use strict';
/* All page prose lives HERE — the locale seam. A later pass can inject a
   translated dict server-side without touching the render code. Callsigns,
   section codes, bands, modes and the event's own name are invariant. */
var STRINGS = {
  scoreTitle: 'Score',
  rawPoints: 'QSO points (raw) — multipliers apply at submission',
  totalPoints: 'total points',
  qsoPointsLine: 'QSO points',
  powerLine: 'power multiplier',
  poweredLine: 'powered points',
  bonusLine: 'bonus points',
  objectivesLine: 'objectives completed',
  atSubmission: 'at submission',
  projectedWord: 'projected',
  qsoTitle: 'Contacts',
  perHour: '/hr',
  last10: 'in last 10 min',
  sectionsTitle: 'Sections reached',
  ofWord: 'of',
  legendWorked: 'worked',
  legendUnworked: 'not yet',
  bandModeTitle: 'Contacts by band and mode',
  bandCol: 'Band',
  phoneCol: 'Phone',
  cwCol: 'CW',
  digitalCol: 'Digital',
  totalCol: 'Total',
  positionsTitle: 'Operating positions',
  qsosWord: 'QSOs',
  ptsWord: 'pts',
  opWord: 'op',
  bonusesTitle: 'Bonuses claimed',
  objectivesTitle: 'Objectives completed',
  latestLabel: 'Latest contact',
  waitingFirst: 'Waiting for the first contact…',
  phoneWord: 'Phone',
  cwWord: 'CW',
  digitalWord: 'Digital',
  utcWord: 'UTC',
  endsIn: 'ends in',
  startsIn: 'starts in',
  endedWord: 'event complete',
  hourShort: 'h',
  minShort: 'm',
  staleBadge: 'STALE — reconnecting…',
  hostOnlyMsg: 'The scoreboard is served from the host station.',
  framing: 'Ham radio operators here are contacting other stations across ' +
    'North America using portable equipment and emergency power — every arc ' +
    'on the globe is a contact just made, and its pin stays lit for the rest ' +
    'of the event.'
};

/* ------------------------------------------------------------------ */
/* Pure render(data, meta) functions. Every DATA value goes through
   textContent — calls and sections arrive over RF and are untrusted;
   only static STRINGS skeletons are ever assigned as markup. */
/* ------------------------------------------------------------------ */

var $ = function (id) { return document.getElementById(id); };
var metaDone = false;
var lastHeroKey = '';
var clockOffsetMs = 0;
var eventWindow = { start: 0, end: 0 };

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function modeWord(mode) {
  if (mode === 'PH') return STRINGS.phoneWord;
  if (mode === 'CW') return STRINGS.cwWord;
  return STRINGS.digitalWord;
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function fmtDuration(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  return h + ' ' + STRINGS.hourShort + ' ' + pad2(m) + ' ' + STRINGS.minShort;
}

/* Static labels + the globe legend + the bonus skeleton, from meta.json (the
   section universe and the bonus menu are the RULES DATA — never hardcoded
   here; the page only ever counts them). */
function renderMeta(meta) {
  $('score-title').textContent = STRINGS.scoreTitle;
  $('qso-title').textContent = STRINGS.qsoTitle;
  $('qso-rate-unit').textContent = STRINGS.perHour;
  $('qso-rate10-unit').textContent = STRINGS.last10;
  $('bm-title').textContent = STRINGS.bandModeTitle;
  $('bm-h-band').textContent = STRINGS.bandCol;
  $('bm-h-ph').textContent = STRINGS.phoneCol;
  $('bm-h-cw').textContent = STRINGS.cwCol;
  $('bm-h-dig').textContent = STRINGS.digitalCol;
  $('bm-h-total').textContent = STRINGS.totalCol;
  $('pos-title').textContent = STRINGS.positionsTitle;
  $('bonus-title').textContent =
    meta.scoring_model === 'objectives' ? STRINGS.objectivesTitle : STRINGS.bonusesTitle;
  $('hero-label').textContent = STRINGS.latestLabel;
  $('framing').textContent = STRINGS.framing;
  $('stale').textContent = STRINGS.staleBadge;
  $('inactive').textContent = STRINGS.hostOnlyMsg;
  $('clock-utc').textContent = STRINGS.utcWord;
  $('sec-title').textContent = STRINGS.sectionsTitle;

  $('ev-name').textContent = meta.event.name + ' ' + meta.event.year;
  eventWindow = { start: meta.event.start_unix, end: meta.event.end_unix };

  /* The globe legend. The section universe itself is the RULES DATA and is
     never hardcoded here; the globe's pin table is keyed by the same codes
     and is checked against that universe by the jsdom suite. */
  var legend = $('globe-legend');
  legend.textContent = '';
  var addLeg = function (cls, text) {
    var w = el('div', 'leg' + (cls ? ' ' + cls : ''));
    w.appendChild(el('span', 'dot'));
    w.appendChild(el('span', '', text));
    legend.appendChild(w);
  };
  addLeg('on', STRINGS.legendWorked);
  addLeg('', STRINGS.legendUnworked);
  initGlobe();

  /* Bonus / objective checklist skeleton. */
  var bl = $('bonus-list');
  bl.textContent = '';
  meta.bonuses.forEach(function (b) {
    var row = el('div', 'bonus');
    row.setAttribute('data-id', b.id);
    row.appendChild(el('span', 'tick', '☐'));
    row.appendChild(el('span', '', b.label));
    bl.appendChild(row);
  });

  metaDone = true;
}

function renderScore(score) {
  var lines = $('score-lines');
  lines.textContent = '';
  var addLine = function (k, v, cls) {
    var row = el('div', 'score-line' + (cls ? ' ' + cls : ''));
    row.appendChild(el('span', 'k', k));
    row.appendChild(el('span', 'v', v));
    lines.appendChild(row);
  };
  $('score-total').textContent = String(score.total);
  if (score.model === 'objectives') {
    /* WFD: the headline is RAW QSO points — the payload carries no power
       fields at all, so power math cannot be rendered here even by mistake.
       The ×(n+1) projection is a labelled, provisional secondary. */
    $('score-caption').textContent = STRINGS.rawPoints;
    var n = score.objectives_claimed || 0;
    addLine(STRINGS.objectivesLine, String(n));
    if (score.bonus_points) addLine(STRINGS.bonusLine, String(score.bonus_points));
    addLine(
      STRINGS.atSubmission,
      score.qso_points + ' × ' + (n + 1) + ' → ' +
        score.projected_at_submission + ' ' + STRINGS.projectedWord,
      'provisional'
    );
  } else {
    $('score-caption').textContent = STRINGS.totalPoints;
    addLine(STRINGS.qsoPointsLine, String(score.qso_points));
    addLine(STRINGS.powerLine, '× ' + score.power_mult);
    addLine(STRINGS.poweredLine, String(score.powered_points));
    addLine(STRINGS.bonusLine, '+ ' + score.bonus_points);
  }
}

function renderQsos(qsos) {
  $('qso-count').textContent = String(qsos.count);
  $('qso-rate').textContent = String(qsos.rate_hour);
  $('qso-rate10').textContent = String(qsos.rate_10min);
  var svg = $('sparkline');
  var h = qsos.hourly;
  if (!h || h.length < 2) { svg.innerHTML = ''; return; }
  var max = Math.max.apply(null, h.concat([1]));
  var pts = h.map(function (v, i) {
    var x = (i / (h.length - 1)) * 100;
    var y = 29 - (v / max) * 27;
    return x.toFixed(2) + ',' + y.toFixed(2);
  });
  /* innerHTML on the <svg> keeps the children in the SVG namespace without
     naming the namespace URL; the content is generated numerics only. */
  svg.innerHTML =
    '<polygon class="fill" points="0,30 ' + pts.join(' ') + ' 100,30"></polygon>' +
    '<polyline points="' + pts.join(' ') + '"></polyline>';
}

/* ================================================================== */
/* THE GLOBE — the sections display.
   Hand-rolled Canvas 2D orthographic globe: no library, no texture, no
   external reference of any kind (this page must render on a Field Day
   site with no route to the internet). It replaces the 83-chip section
   board and says the same thing — a lit pin is a section reached — but
   readable from the far side of a tent.
   Geometry below (projection, great-circle interpolation, the section
   table, the subsolar point, which ticker rows are new) is PURE and
   exposed on window.__fdboard.globe for the jsdom suite. Painting is
   separate and bails out cleanly when there is no 2D context. */
/* ------------------------------------------------------------------ */

/* MIRROR of ui/src/bandColors.ts BAND_COLOR (and its neutral fallback) —
   one hue per band so 20m looks like 20m on the map, in the cockpit band
   picker and here. A hand copy because this page has no build step and no
   imports; if that file changes, change this. */
var BAND_COLOR = {
  '2200m': '#6a4cff',
  '630m': '#6e54ff',
  '160m': '#7c5cff',
  '80m': '#5c7cff',
  '60m': '#4a8eff',
  '40m': '#3aa0ff',
  '30m': '#2bd4c0',
  '20m': '#3ddc6a',
  '17m': '#9bdc3d',
  '15m': '#ffcc44',
  '12m': '#ff9d3d',
  '10m': '#ff6d3d',
  '6m': '#ff4d6d',
  '4m': '#ff4da6',
  '2m': '#d24dff',
  '1.25m': '#c04dff',
  '70cm': '#b04dff',
  '33cm': '#a24dff',
  '23cm': '#944dff'
};
function bandColor(b) {
  return Object.prototype.hasOwnProperty.call(BAND_COLOR, b) ? BAND_COLOR[b] : '#8aa0b0';
}

/* ARRL/RAC section -> a representative lat/lon for the globe pin. The code
   universe is the canonical 83 from crates/tempo-core/src/fd_rules.seed.json
   (mirrored in ui/src/features/arrlSections.ts); the jsdom suite pins that
   every one of those 83 codes has an entry here.

   A SECTION IS A REGION, NOT A POINT. Each pair is an APPROXIMATE CENTRE of
   the POPULATED part of that region, good to roughly a degree. It is a TV
   pin — never a QTH, and never to be presented as the location of the
   station worked. Split-state sections sit on their own populated half
   (EPA on Philadelphia, WPA on Pittsburgh, EWA east of the Cascades…);
   PAC/PR/VI sit on their islands. */
var SECTION_LATLON = {
  'AB': [52.5, -113.5],
  'AK': [63.0, -151.0],
  'AL': [32.8, -86.8],
  'AR': [34.8, -92.4],
  'AZ': [34.0, -111.5],
  'BC': [49.8, -122.5],
  'CO': [39.0, -105.5],
  'CT': [41.6, -72.7],
  'DE': [39.1, -75.5],
  'EB': [37.9, -122.1],
  'EMA': [42.3, -71.3],
  'ENY': [41.9, -73.9],
  'EPA': [40.6, -75.9],

/* Section codes arrive over RF and are untrusted: the own-property check
   keeps 'constructor'/'toString' from resolving to something on the
   prototype. A code with no entry — a typo, 'DX', or a section added to
   fd_rules before this table catches up — is a deliberate NO-OP: no pin,
   no arc, silently. DX stations are the honest case: Field Day DX sends
   "DX", which is not a section, and this page has no DXCC table to place
   it by, so it is not placed at all. It still counts everywhere else on
   the board — score, band/mode grid, ticker. */
function sectionLatLon(code) {
  var k = String(code === null || code === undefined ? '' : code).toUpperCase();
  return Object.prototype.hasOwnProperty.call(SECTION_LATLON, k) ? SECTION_LATLON[k] : null;
}

/* ---- pure geometry ---------------------------------------------------- */

var DEG = Math.PI / 180;
var TAU = Math.PI * 2;
/* Degrees the north pole tips toward the viewer: North America reads as a
   continent rather than a band along the top edge. */
var TILT_C = Math.cos(18 * DEG);
var TILT_S = Math.sin(18 * DEG);

function norm180(deg) { return ((deg + 540) % 360) - 180; }

/* A lat/lon as a unit vector: x east at lon 0, y north, z toward the viewer
   when lon 0 faces us. Every other routine here works in this frame. */
function unitVec(lat, lon) {
  var f = lat * DEG, l = lon * DEG, cf = Math.cos(f);
  return [cf * Math.sin(l), Math.sin(f), cf * Math.cos(l)];

   is the far side of the sphere and must not be drawn (the back-face cull). */

   on the unit sphere), so an arc follows the path a signal would and not a
   straight line across the screen. */
/* THE slerp — n+1 unit vectors, flat [x,y,z,x,y,z,...], plus the angular
   distance the caller needs for its arc lift.

   ⚠️ ONE COPY ON PURPOSE. `arcPoints` (the test seam) and `buildArc` (what
   actually renders) each carried their own identical loop, so the suite's
   great-circle test guarded a function no production path called: changing
   the interpolation that draws left every test green. Both go through here
   now, so the test covers the maths that reaches the screen.

   Coincident and near-antipodal points both collapse to A rather than
   dividing by ~0. For two ARRL sections neither can happen; it is a
   no-NaN guard, not a claim to handle a true antipode meaningfully. */

  var A = unitVec(a[0], a[1]), B = unitVec(b[0], b[1]);

   source of truth in crates/propagation/src/geo.rs (Cooper's declination +
   the equation of time). This page is the THIRD mirror; if the physics
   changes it changes in geo.rs first. Good to about half a degree, which is
   far better than a TV globe needs. */

  var d = new Date(ms);

      var r2 = xx * xx + yy * yy;
      if (r2 > 1) { px[k + 3] = 0; continue; }
      var el = xx * s.x + yy * s.y + Math.sqrt(1 - r2) * s.z;
      var a = el >= 0 ? 0 : (el <= -0.31 ? 1 : -el / 0.31);
      px[k] = 2; px[k + 1] = 7; px[k + 2] = 16;
      px[k + 3] = (a * 200) | 0;
    }
  }
  nightCtx.putImageData(nightImg, 0, 0);
  gCtx.save();
  gCtx.beginPath();
  gCtx.arc(cx, cy, R, 0, TAU);
  gCtx.clip();
  gCtx.drawImage(nightCanvas, cx - R, cy - R, R * 2, R * 2);
  gCtx.restore();
}

/* The greyline itself, crisp — the line where the sun is on the horizon.
   Rebuilt once a SECOND (it creeps 0.25 deg a minute); the frame loop only
   turns the cached unit vectors, so this costs no trig per frame. */
var glXyz = null, glAtSec = -1;
function paintGreyline(cx, cy, R, nowMs) {
  var sec = Math.floor(nowMs / 1000), i, u;
  if (sec !== glAtSec || !glXyz) {
    glAtSec = sec;
    var ring = terminatorRing(nowMs, 180);
    glXyz = [];
    for (i = 0; i < ring.length; i++) {
      u = unitVec(ring[i][0], ring[i][1]);
      glXyz.push(u[0], u[1], u[2]);
    }
    glXyz.push(glXyz[0], glXyz[1], glXyz[2]); /* close the ring */
  }
  gCtx.beginPath();
  var started = false;
  for (i = 0; i + 2 < glXyz.length; i += 3) {
    var v = rotXyz(glXyz[i], glXyz[i + 1], glXyz[i + 2]);
    if (v.z <= 0) { started = false; continue; }
    if (started) gCtx.lineTo(cx + v.x * R, cy - v.y * R);
    else { gCtx.moveTo(cx + v.x * R, cy - v.y * R); started = true; }
  }
  gCtx.lineWidth = 1.4;
  gCtx.strokeStyle = 'rgba(255,196,120,0.50)';
  gCtx.stroke();
}

/* 83 pins a frame — never the QSO list. Lit is worked, dim is not yet. */
function paintPins(cx, cy, R) {
  var dim = Math.max(1.3, R * 0.009);
  var big = Math.max(2.2, R * 0.017);
  var i, v, lit, fade, sx, sy;
  for (i = 0; i < PIN_CODE.length; i++) {
    v = rotXyz(PIN_XYZ[3 * i], PIN_XYZ[3 * i + 1], PIN_XYZ[3 * i + 2]);
    if (v.z <= 0.01) continue;
    fade = Math.min(1, v.z * 7); /* fade in at the limb instead of popping */
    sx = cx + v.x * R; sy = cy - v.y * R;
    lit = Object.prototype.hasOwnProperty.call(LIT, PIN_CODE[i]);
    if (lit) {
      gCtx.beginPath();
      gCtx.arc(sx, sy, big * 2.6, 0, TAU);
      gCtx.fillStyle = 'rgba(47,208,122,' + (0.14 * fade).toFixed(3) + ')';
      gCtx.fill();
    }
    gCtx.beginPath();
    gCtx.arc(sx, sy, lit ? big : dim, 0, TAU);
    gCtx.fillStyle = lit
      ? 'rgba(70,232,144,' + fade.toFixed(3) + ')'
      : 'rgba(146,168,188,' + (0.42 * fade).toFixed(3) + ')';
    gCtx.fill();
  }
  /* the club's own site */
  if (HOME) {
    var h = project(HOME[0], HOME[1], rotDeg);
    if (h.z > 0.01) {
      gCtx.beginPath();
      gCtx.arc(cx + h.x * R, cy - h.y * R, big * 1.5, 0, TAU);
      gCtx.lineWidth = 2;
      gCtx.strokeStyle = 'rgba(76,194,255,' + Math.min(1, h.z * 7).toFixed(3) + ')';
      gCtx.stroke();
    }
  }
}

/* At most ARC_MAX short polylines — the arcs are the only per-contact work
   the frame loop ever does, and they expire. */
function paintArcs(cx, cy, R, nowMs) {
  for (var a = ARCS.length - 1; a >= 0; a--) {
    var arc = ARCS[a];
    var age = (nowMs - arc.born) / 1000;
    if (age < 0 || age > ARC_LIFE_S) { ARCS.splice(a, 1); continue; }
    var grow = Math.min(1, age / ARC_DRAW_S);
    var alpha = age <= ARC_DRAW_S ? 1 : 1 - (age - ARC_DRAW_S) / (ARC_LIFE_S - ARC_DRAW_S);
    var last = Math.max(1, Math.round(grow * arc.n));
    var hx = 0, hy = 0, haveHead = false;
    for (var pass = 0; pass < 2; pass++) {
      gCtx.beginPath();
      var started = false;
      for (var i = 0; i <= last; i++) {
        var v = rotXyz(arc.xyz[3 * i], arc.xyz[3 * i + 1], arc.xyz[3 * i + 2]);
        if (v.z <= 0) { started = false; continue; }
        var r = arc.rad[i] * R;
        var sx = cx + v.x * r, sy = cy - v.y * r;
        if (started) gCtx.lineTo(sx, sy);
        else { gCtx.moveTo(sx, sy); started = true; }
        if (i === last) { hx = sx; hy = sy; haveHead = true; }
      }
      gCtx.lineCap = 'round';
      gCtx.lineWidth = pass === 0 ? Math.max(7, R * 0.05) : Math.max(2.4, R * 0.017);
      gCtx.globalAlpha = (pass === 0 ? 0.22 : 1) * alpha;
      gCtx.strokeStyle = arc.color;
      gCtx.stroke();
    }
    if (haveHead && grow < 1) {
      gCtx.globalAlpha = alpha;
      gCtx.fillStyle = arc.color;
      gCtx.beginPath();
      gCtx.arc(hx, hy, Math.max(6, R * 0.038), 0, TAU);
      gCtx.globalAlpha = 0.25 * alpha;
      gCtx.fill();
      gCtx.beginPath();
      gCtx.arc(hx, hy, Math.max(2.6, R * 0.017), 0, TAU);
      gCtx.globalAlpha = alpha;
      gCtx.fill();
    }
    /* the landing: a ring blooming on the section the arc just reached, the
       beat between "an arc fired" and "that pin is lit from now on". */
    if (grow >= 1) {
      var e = rotXyz(arc.end[0], arc.end[1], arc.end[2]);
      if (e.z > 0) {
        var t = (age - ARC_DRAW_S) / (ARC_LIFE_S - ARC_DRAW_S);
        gCtx.beginPath();
        gCtx.arc(cx + e.x * R, cy - e.y * R, R * (0.016 + 0.08 * t), 0, TAU);
        gCtx.lineWidth = Math.max(2, R * 0.014);
        gCtx.globalAlpha = 1 - t;
        gCtx.strokeStyle = arc.color;
        gCtx.stroke();
      }
    }
    gCtx.globalAlpha = 1;
  }
}

/* Animation rides ALONGSIDE the 3 s poll, never inside it: one
   self-rescheduling rAF, capped near 30 fps because this runs for 24 hours
   on whatever laptop is driving the TV. The canvas box is re-measured once a
   second here, which is also what heals a boot that ran before layout. */
var lastSizeSec = -1;
function globeFrame(ts) {
  window.requestAnimationFrame(globeFrame);
  if (lastFrameMs && ts - lastFrameMs < 32) return;
  var dt = lastFrameMs ? (ts - lastFrameMs) / 1000 : 0;
  lastFrameMs = ts;
  var sec = Math.floor(ts / 1000);
  if (sec !== lastSizeSec) { lastSizeSec = sec; sizeGlobe(); }
  rotDeg = (rotDeg + ROT_DEG_PER_S * Math.min(dt, 0.5)) % 360;
  paintGlobe(Date.now() + clockOffsetMs);
}

function startGlobe() {
  initGlobe();
  if (!gCtx) return;
  if (motionOff) {
    /* No motion at all: a static globe with the pins lit, no arcs enqueued
       above. The terminator still creeps, so repaint once a minute — nothing
       a viewer would see move. */
    paintGlobe(Date.now() + clockOffsetMs);
    setInterval(function () {
      sizeGlobe();
      paintGlobe(Date.now() + clockOffsetMs);
    }, 60000);
    return;
  }
  rafOn = true;
  window.requestAnimationFrame(globeFrame);
}

/* The globe's half of render(): state in, count on the header, and a paint
   only when no frame loop is running (reduced motion, or before boot). */
function renderGlobe(data, meta) {
  updateGlobeState(data, animClockMs());
  var worked = data.sections_worked || [];
  $('sec-count').textContent =
    worked.length + ' ' + STRINGS.ofWord + ' ' + meta.sections.length;
  if (!rafOn) { sizeGlobe(); paintGlobe(Date.now() + clockOffsetMs); }
}

function globeSnapshot() {
  var lit = [], k;
  for (k in LIT) { if (Object.prototype.hasOwnProperty.call(LIT, k)) lit.push(k); }
  lit.sort();
  return { lit: lit, home: HOME, arcs: ARCS.length, fired: arcsFired, seeded: seeded };
}

function renderBandMode(rows) {
  var body = $('bm-body');
  body.textContent = '';
  rows.forEach(function (r) {
    var tr = document.createElement('tr');
    tr.appendChild(el('td', '', r.band));
    [r.ph, r.cw, r.dig].forEach(function (v) {
      tr.appendChild(el('td', v ? '' : 'z', String(v)));
    });
    tr.appendChild(el('td', 'total', String(r.ph + r.cw + r.dig)));
    body.appendChild(tr);
  });
}

function renderPositions(positions) {
  var list = $('pos-list');
  list.textContent = '';
  positions.forEach(function (p) {
    var row = el('div', 'pos-row');
    var left = el('div');
    left.appendChild(el('div', 'pos-label', p.label));
    if (p.operator) left.appendChild(el('div', 'pos-op', STRINGS.opWord + ' ' + p.operator));
    row.appendChild(left);
    var nums = el('div', 'pos-nums');
    nums.appendChild(el('div', '', p.qsos_raw + ' ' + STRINGS.qsosWord));
    var pts = el('div');
    var b = el('b', '', String(p.points));
    pts.appendChild(b);
    pts.appendChild(document.createTextNode(' ' + STRINGS.ptsWord));
    nums.appendChild(pts);
    row.appendChild(nums);
    list.appendChild(row);
  });
}

function renderBonuses(claimed) {
  var have = {};
  claimed.forEach(function (id) { have[id] = true; });
  var rows = $('bonus-list').querySelectorAll('.bonus');
  for (var i = 0; i < rows.length; i++) {
    var id = rows[i].getAttribute('data-id');
    var tick = rows[i].querySelector('.tick');
    if (have[id]) { rows[i].classList.add('claimed'); tick.textContent = '☑'; }
    else { rows[i].classList.remove('claimed'); tick.textContent = '☐'; }
  }
}

function sectionName(code, meta) {
  for (var i = 0; i < meta.sections.length; i++) {
    if (meta.sections[i].code === code) return meta.sections[i].name;
  }
  return code;
}

function renderTicker(ticker, meta) {
  var hero = $('hero');
  hero.textContent = '';
  if (!ticker.length) {
    hero.appendChild(el('span', 'attr', STRINGS.waitingFirst));
    $('recent').textContent = '';
    return;
  }
  var t = ticker[0];
  var key = t.when_unix + '|' + t.call;
  hero.appendChild(el('span', 'call', t.call));
  hero.appendChild(document.createTextNode(
    ' · ' + sectionName(t.section, meta) +
    ' · ' + t.band + ' ' + (t.submode || modeWord(t.mode)) + ' '
  ));
  hero.appendChild(el('span', 'attr',
    '· ' + t.position + (t.operator ? ' (' + t.operator + ')' : '')));
  if (key !== lastHeroKey) {
    lastHeroKey = key;
    hero.classList.remove('flash');
    void hero.offsetWidth; /* restart the highlight animation */
    hero.classList.add('flash');
  }
  $('recent').textContent = ticker.slice(1, 9).map(function (q) {
    return q.call + ' ' + q.section + ' ' + q.band + ' ' + (q.submode || q.mode);
  }).join('   ·   ');
}

/* The composite render — everything from one data.json + one meta.json. */
function render(data, meta) {
  if (!metaDone) renderMeta(meta);
  $('ev-station').textContent =
    data.event.call + ' — ' + data.event.class + ', ' + data.event.section;
  eventWindow = { start: data.event.start_unix, end: data.event.end_unix };
  renderScore(data.score);
  renderQsos(data.qsos);
  renderGlobe(data, meta);
  renderBandMode(data.band_mode);
  renderPositions(data.positions);
  renderBonuses(data.claimed);
  renderTicker(data.ticker, meta);
}

function setStale(on) {
  $('stale').textContent = STRINGS.staleBadge;
  $('stale').className = on ? 'on' : '';
}

function setInactive(on) {
  $('inactive').textContent = STRINGS.hostOnlyMsg;
  $('inactive').className = on ? 'on' : '';
}

/* UTC clock + time-remaining bar, off the host's clock (now_unix from the
   last poll corrects the TV's own drift). */
function tickClock() {
  var now = new Date(Date.now() + clockOffsetMs);
  $('clock').textContent =
    pad2(now.getUTCHours()) + ':' + pad2(now.getUTCMinutes()) + ':' + pad2(now.getUTCSeconds());
  var s = Math.floor(now.getTime() / 1000);
  var label = '';
  var pct = 0;
  if (eventWindow.end > eventWindow.start) {
    if (s < eventWindow.start) {
      label = STRINGS.startsIn + ' ' + fmtDuration(eventWindow.start - s);
    } else if (s < eventWindow.end) {
      label = STRINGS.endsIn + ' ' + fmtDuration(eventWindow.end - s);
      pct = ((s - eventWindow.start) / (eventWindow.end - eventWindow.start)) * 100;
    } else {
      label = STRINGS.endedWord;
      pct = 100;
    }
  }
  $('time-label').textContent = label;
  $('timebar-fill').style.width = pct.toFixed(2) + '%';
}

/* ------------------------------------------------------------------ */
/* Liveness: 3 s polling with the rev counter. A failed poll keeps the
   last good board; three misses show the stale badge; recovery is
   automatic — no user action ever required on the TV. Self-rescheduling
   setTimeout, so browser throttling cannot pile requests up. */
/* ------------------------------------------------------------------ */

var META = null;
var lastRev = -1;
var misses = 0;

function poll() {
  fetch('/scoreboard/data.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(function (data) {
      misses = 0;
      setStale(false);
      if (data.active === false) {
        setInactive(true);
        return;
      }
      setInactive(false);
      clockOffsetMs = data.now_unix * 1000 - Date.now();
      if (data.rev !== lastRev) {
        lastRev = data.rev;
        render(data, META);
      }
    })
    .catch(function () {
      misses += 1;
      if (misses >= 3) setStale(true);
    })
    .then(function () { setTimeout(poll, 3000); });
}

function loadMeta() {
  fetch('/scoreboard/meta.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (meta) {
      if (meta.active === false) {
        setInactive(true);
        setTimeout(loadMeta, 3000);
        return;
      }
      META = meta;
      renderMeta(meta);
      poll();
    })
    .catch(function () { setTimeout(loadMeta, 3000); });
}

/* Test seam: the jsdom suite sets __FDBOARD_TEST__ and drives the pure
   render functions directly — no network, no timers. */
window.__fdboard = {
  STRINGS: STRINGS,
  render: render,
  renderMeta: renderMeta,
  setStale: setStale,
  setInactive: setInactive,
  tickClock: tickClock,
  /* The globe's PURE half — geometry and state, no canvas required, so the
     jsdom suite can check the maths and the arc bookkeeping exactly. */
  globe: {
    SECTION_LATLON: SECTION_LATLON,
    sectionLatLon: sectionLatLon,
    bandColor: bandColor,
    project: project,
    arcPoints: arcPoints,
    subsolarPoint: subsolarPoint,
    terminatorRing: terminatorRing,
    contactKey: contactKey,
    landRingCount: function () { return decodeLand(LAND_RAW).length; },
    snapshot: globeSnapshot
  }
};
if (!window.__FDBOARD_TEST__) {
  startGlobe();
  loadMeta();
  setInterval(tickClock, 1000);
  tickClock();
}
</script>
</body>
</html>
