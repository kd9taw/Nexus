[package]
publish = false
name = "tempo-app"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nexus UI-facing application logic: wraps tempo-core into serializable DTOs and command methods, decoupled from Tauri/audio so it builds and unit-tests headless"

[lints]
workspace = true

[dependencies]
tempo-core = { path = "../tempo-core" }
modes = { path = "../modes" }
# JS8 message layer (Station/Reassembler behind the engine adapter in `js8.rs`) and the
# `Js8State` DTO's leaf types. Pure Rust; `modes` already pulls the same crate for the modem.
js8 = { path = "../js8" }
# Wire formats for the per-QSO interop broadcasts fired from `log_qso` (N1MM
# <contactinfo>). A leaf crate over std sockets — tempo-core already reaches it
# through `modes`, so this is an explicit edge on an existing arrow, not a new one.
tempo-net = { path = "../tempo-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# tests/fieldday_loopback.rs restarts its host on the SAME port while accepted
# sockets may sit in TIME_WAIT — the rebind needs SO_REUSEADDR, which std does
# not expose. Test-only; socket2 is already in the tree via tempo-net.
socket2 = "0.6"
