[package]
publish = false
name = "tempo-app"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nexus UI-facing application logic: wraps tempo-core into serializable DTOs and command methods, decoupled from Tauri/audio so it builds and unit-tests headless"

[lints]
workspace = true

[dependencies]
tempo-core = { path = "../tempo-core" }
modes = { path = "../modes" }
# JS8 message layer (Station/Reassembler behind the engine adapter in `js8.rs`) and the
# `Js8State` DTO's leaf types. Pure Rust; `modes` already pulls the same crate for the modem.
js8 = { path = "../js8" }
# Wire formats for the per-QSO interop broadcasts fired from `log_qso` (N1MM
# <contactinfo>). A leaf crate over std sockets — tempo-core already reaches it
# through `modes`, so this is an explicit edge on an existing arrow, not a new one.
tempo-net = { path = "../tempo-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for club sync: the hash a club host pins each position's club key by
# (`fdevent::sha256_hex`). Already in both lock files at this version, with these (default)
# features: the shell makes the club key with it, and street-map and rustls use it.
ring = "0.17"

[features]
# `test_util`: the log as a test reads it (SPEC-2 C19 Part D), for another crate's tests: a
# dev-dependency naming this feature turns it on, so no shipped build compiles it. It turns on
# tempo-core's own for those tests too: the confirmation check's replay of 1.17.0's matcher, which
# builds the state 1.17.0 left by running it (`tempo_core::reconcile::check::replay`).
test-util = ["tempo-core/test-util"]

[dev-dependencies]
# The same crate as above with one more feature, for this crate's tests only: `test-util`, the
# draw hook that forces the station minter's first nonces (`Minter::force_log_draws`). A
# dev-dependency's feature is never on in a shipped build.
tempo-core = { path = "../tempo-core", features = ["test-util"] }
# tests/fieldday_loopback.rs restarts its host on the SAME port while accepted
# sockets may sit in TIME_WAIT — the rebind needs SO_REUSEADDR, which std does
# not expose. Test-only; socket2 is already in the tree via tempo-net.
socket2 = "0.6"
# This crate with `test-util`, for its own integration tests: the hook that ages the a7 hide
# after a band or mode change (`Engine::age_a7_hide`). The same self-dependency tempo-sstv uses.
tempo-app = { path = ".", features = ["test-util"] }
